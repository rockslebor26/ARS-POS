name: ARS POS Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ARS POS Signed Release APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v7


      # ============================================================
      # 2. SETUP JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. SETUP ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # ============================================================
      # 4. INSTALL ANDROID SDK PACKAGES
      # ============================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID SDK"
          echo "=========================================="

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "sdkmanager version:"
          sdkmanager --version

          echo ""
          echo "Accepting Android SDK licenses..."

          yes | sdkmanager --licenses >/dev/null || true

          echo ""
          echo "Installing required packages..."

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "Verifying Android SDK..."

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -f "$ANDROID_HOME/platform-tools/adb"

          echo ""
          echo "Android SDK 35 OK."
          echo "Build Tools 35.0.0 OK."
          echo "Platform Tools OK."


      # ============================================================
      # 5. SETUP GRADLE 8.9
      # ============================================================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'


      # ============================================================
      # 6. CHECK REPOSITORY
      # ============================================================
      - name: Check repository files
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "REPOSITORY ROOT"
          echo "=========================================="

          pwd

          echo ""
          echo "Repository files:"
          ls -lah

          echo ""
          echo "ZIP FILES:"

          find . \
            -type f \
            -iname "*.zip" \
            -print


      # ============================================================
      # 7. FIND LATEST LOGIN FIX ZIP
      #
      # ZIP ini menjadi PRIORITAS UTAMA.
      # ============================================================
      - name: Find latest ARS POS ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=""

          # --------------------------------------------------------
          # PRIORITAS 1
          # Login Fix terbaru
          # --------------------------------------------------------
          EXACT_ZIP="./ARS_POS_PHASE1_LOGIN_FIX_v1_COMPLETE.zip"

          if [ -f "$EXACT_ZIP" ]; then

            ZIP_FILE="$EXACT_ZIP"

            echo "LOGIN FIX ZIP ditemukan."

          else

            echo "Login Fix ZIP tidak ditemukan."
            echo "Mencari Complete Fixed ZIP..."

            # ------------------------------------------------------
            # PRIORITAS 2
            # Complete Fixed
            # ------------------------------------------------------
            EXACT_ZIP="./ARS_POS_PHASE1_COMPLETE_FIXED.zip"

            if [ -f "$EXACT_ZIP" ]; then

              ZIP_FILE="$EXACT_ZIP"

            else

              echo "Complete Fixed ZIP tidak ditemukan."
              echo "Mencari Phase 1 Branding..."

              # ----------------------------------------------------
              # PRIORITAS 3
              # Phase 1 Branding
              # ----------------------------------------------------
              ZIP_FILE=$(find . \
                -type f \
                -iname "*PHASE1*BRANDING*.zip" \
                | head -n 1)

            fi

          fi


          # --------------------------------------------------------
          # VALIDASI
          # --------------------------------------------------------
          if [ -z "$ZIP_FILE" ]; then

            echo ""
            echo "ERROR: Tidak ada ZIP project ARS POS."

            echo ""
            echo "ZIP yang tersedia:"

            find . \
              -type f \
              -iname "*.zip" \
              -print

            exit 1

          fi


          echo ""
          echo "=========================================="
          echo "ZIP YANG AKAN DIGUNAKAN"
          echo "=========================================="

          echo "$ZIP_FILE"

          echo ""

          ls -lh "$ZIP_FILE"

          echo ""

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ============================================================
      # 8. EXTRACT PROJECT
      # ============================================================
      - name: Extract ARS POS project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "EXTRACT PROJECT"
          echo "=========================================="

          rm -rf extracted

          mkdir -p extracted

          echo "Extracting:"
          echo "$ZIP_FILE"

          unzip -o "$ZIP_FILE" -d extracted

          echo ""
          echo "Extract selesai."

          echo ""
          echo "Project files:"

          find extracted \
            -maxdepth 4 \
            -type f \
            | head -n 150


      # ============================================================
      # 9. LOCATE GRADLE PROJECT
      # ============================================================
      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "LOCATE GRADLE PROJECT"
          echo "=========================================="

          SETTINGS_FILE=$(find extracted \
            -type f \
            -name "settings.gradle.kts" \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then

            echo "ERROR:"
            echo "settings.gradle.kts tidak ditemukan."

            echo ""
            echo "Isi extracted:"

            find extracted \
              -maxdepth 7 \
              -type f \
              | sort

            exit 1

          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo ""
          echo "settings.gradle.kts:"
          echo "$SETTINGS_FILE"

          echo ""
          echo "PROJECT_DIR:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 10. VALIDATE PROJECT
      # ============================================================
      - name: Validate Gradle project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "VALIDATE PROJECT"
          echo "=========================================="

          echo ""
          echo "Project directory:"
          pwd

          echo ""
          echo "Project files:"
          ls -lah

          echo ""
          echo "Checking required files..."

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          test -f \
            app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt

          echo ""
          echo "Gradle project structure OK."
          echo "MainActivity.kt ditemukan."


      # ============================================================
      # 11. CHECK MAINACTIVITY
      # ============================================================
      - name: Check MainActivity
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          MAIN_FILE="app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"

          echo "=========================================="
          echo "MAINACTIVITY CHECK"
          echo "=========================================="

          echo ""
          echo "File:"
          echo "$MAIN_FILE"

          echo ""
          echo "Jumlah baris:"
          wc -l "$MAIN_FILE"

          echo ""
          echo "MainActivity:"
          grep -n "class MainActivity" "$MAIN_FILE" || true

          echo ""
          echo "App function:"
          grep -n "fun App" "$MAIN_FILE" || true

          echo ""
          echo "Login function:"
          grep -n "fun Login" "$MAIN_FILE" || true


      # ============================================================
      # 12. CHECK ARS BRANDING
      # ============================================================
      - name: Check ARS branding
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "ARS BRANDING CHECK"
          echo "=========================================="

          echo ""
          echo "LAUNCHER ICONS:"

          find app/src/main/res \
            -type f \
            \( \
              -iname "ic_launcher*" \
              -o \
              -iname "*launcher*" \
            \) \
            -print || true

          echo ""
          echo "ARS BACKGROUND:"

          find app/src/main/res \
            -type f \
            -iname "*ars_background*" \
            -print || true

          echo ""
          echo "ANDROID MANIFEST:"

          grep -n \
            "android:icon\|android:roundIcon" \
            app/src/main/AndroidManifest.xml || true


      # ============================================================
      # 13. CHECK BUILD ENVIRONMENT
      # ============================================================
      - name: Check build environment
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "JAVA"
          echo "=========================================="

          java -version

          echo ""
          echo "=========================================="
          echo "GRADLE"
          echo "=========================================="

          gradle --version

          echo ""
          echo "=========================================="
          echo "ANDROID SDK"
          echo "=========================================="

          sdkmanager --list_installed \
            | head -n 100


      # ============================================================
      # 14. CLEAN PROJECT
      # ============================================================
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "CLEAN"
          echo "=========================================="

          gradle clean \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 15. BUILD RELEASE APK
      # ============================================================
      - name: Build Release APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "BUILD RELEASE APK"
          echo "=========================================="

          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      # ============================================================
      # 16. CHECK APK OUTPUT
      # ============================================================
      - name: Check APK output
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "APK OUTPUT"
          echo "=========================================="

          find app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print

          echo ""
          echo "APK SIZE:"

          ls -lh \
            app/build/outputs/apk/release/*.apk


      # ============================================================
      # 17. VERIFY APK SIGNATURE
      # ============================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          APK=$(find app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          echo ""
          echo "APK:"
          echo "$APK"

          echo ""
          echo "=========================================="
          echo "APK SIGNATURE"
          echo "=========================================="

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"


      # ============================================================
      # 18. VERIFY APK ALIGNMENT
      # ============================================================
      - name: Verify APK alignment
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          APK=$(find app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | head -n 1)

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -c \
            -P 16 \
            -v 4 \
            "$APK"


      # ============================================================
      # 19. PREPARE FINAL APK
      # ============================================================
      - name: Prepare final APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          APK=$(find app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          FINAL_APK="app/build/outputs/apk/release/ARS-POS-1.0.0-signed.apk"

          cp "$APK" "$FINAL_APK"

          echo ""
          echo "=========================================="
          echo "FINAL APK"
          echo "=========================================="

          ls -lh "$FINAL_APK"


      # ============================================================
      # 20. GENERATE SHA-256
      # ============================================================
      - name: Generate APK checksum
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR/app/build/outputs/apk/release"

          sha256sum \
            ARS-POS-1.0.0-signed.apk \
            > ARS-POS-1.0.0-signed.apk.sha256

          echo ""
          echo "=========================================="
          echo "SHA-256"
          echo "=========================================="

          cat ARS-POS-1.0.0-signed.apk.sha256


      # ============================================================
      # 21. UPLOAD SIGNED APK
      # ============================================================
      - name: Upload signed APK
        uses: actions/upload-artifact@v7
        with:
          name: ARS-POS-1.0.0-SIGNED
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.0.0-signed.apk
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.0.0-signed.apk.sha256
          if-no-files-found: error
          retention-days: 30
