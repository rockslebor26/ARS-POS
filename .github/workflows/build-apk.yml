      - name: Remove runner copy of signing key
        if: always()
        shell: bash
        run: |
          KEYSTORE="$RUNNER_TEMP/ars-v888-210.jks"

          if [ -f "$KEYSTORE" ]; then

            if command -v shred >/dev/null 2>&1; then
