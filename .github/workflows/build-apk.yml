name: ARS POS Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build ARS POS Phase 4.3.2.21 Fullscreen Target Camera V8.4.1 FIX1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -f "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -f "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -f "$ANDROID_HOME/build-tools/35.0.0/aapt"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Locate Phase 4.3.2.21 V8.4.1 FIX1 source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="./ARS_POS_PHASE4_3_2_21_V8_4_1_FULLSCREEN_TARGET_CAMERA_FIX1.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP V8.4.1 FIX1 tidak ditemukan: $ZIP_FILE"
            find . -maxdepth 3 -type f -iname '*.zip' -print
            exit 1
          fi

          unzip -t "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ARS POS project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=$(find extracted -type f -name 'settings.gradle.kts' | head -n 1)

          test -n "$SETTINGS" || {
            echo "ERROR: settings.gradle.kts tidak ditemukan"
            exit 1
          }

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Gradle project: $PROJECT_DIR"

      - name: Validate V8.4.1 FIX1 source files
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          REQUIRED=(
            "settings.gradle.kts"
            "build.gradle.kts"
            "gradle.properties"
            "app/build.gradle.kts"
            "app/src/main/AndroidManifest.xml"
            "app/src/main/res/xml/file_paths.xml"

            "app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/PosViewModel.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/SmartProductInput.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/SmartVisualScanner.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/LongObjectAnalyzer.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/ProductVisualMatcher.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/VisualProductMatch.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/VisualScanObject.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/ProductMasterStudio.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/FullscreenMasterCamera.kt"

            "app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/data/SmartRecognitionEngine.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/data/RecognitionCandidate.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/data/ProductIdentityProfile.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/data/ProductIdentityProfileCodec.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/data/MasterVerificationResult.kt"

            "app/src/main/java/com/arspos/anglerriausyndicate/data/db/ArsDao.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/data/db/ArsDatabase.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/data/db/ProductEntity.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/data/db/ProductPhotoEntity.kt"
          )

          for FILE in "${REQUIRED[@]}"; do
            test -f "$FILE" || {
              echo "MISSING: $FILE"
              exit 1
            }
          done

          grep -q 'versionCode = 136' app/build.gradle.kts
          grep -q 'versionName = "1.3.6"' app/build.gradle.kts

          CAMERA=app/src/main/java/com/arspos/anglerriausyndicate/FullscreenMasterCamera.kt

          # Dialog wajib menggunakan Compose UI Window
          grep -q 'import androidx.compose.ui.window.Dialog' "$CAMERA"
          grep -q 'import androidx.compose.ui.window.DialogProperties' "$CAMERA"

          # Pastikan import Dialog yang salah tidak ada
          ! grep -q 'import androidx.compose.material3.Dialog' "$CAMERA"

          # Fullscreen
          grep -q 'usePlatformDefaultWidth = false' "$CAMERA"
          grep -q 'decorFitsSystemWindows = false' "$CAMERA"

          # Kamera foto
          grep -q 'ImageCapture' "$CAMERA"

          # Kamera video
          grep -q 'VideoCapture' "$CAMERA"

          # Lock Target Object
          grep -q 'LOCK TARGET' "$CAMERA"
          grep -q 'TARGET TERKUNCI' "$CAMERA"

          # Torch / flash
          grep -q 'toggleTorch' "$CAMERA"

          # Switch kamera
          grep -q 'switchLens' "$CAMERA"

          # Smart Shopping Scan
          grep -q 'TAMBAH SEMUA KE KERANJANG' \
            app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt

          echo "V8.4.1 FIX1 SOURCE VALIDATION OK"

      - name: Validate Kotlin source balance
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path

          pairs = {
              '{': '}',
              '(': ')',
              '[': ']'
          }

          reverse = {
              v: k for k, v in pairs.items()
          }

          def check(path):
              text = path.read_text(encoding='utf-8')

              stack = []
              i = 0
              line = 1

              line_comment = False
              block_comment = False
              string = False
              char = False
              escaped = False

              while i < len(text):

                  c = text[i]

                  if c == '\n':
                      line += 1
                      line_comment = False
                      i += 1
                      continue

                  if line_comment:
                      i += 1
                      continue

                  if block_comment:
                      if (
                          c == '*'
                          and i + 1 < len(text)
                          and text[i + 1] == '/'
                      ):
                          block_comment = False
                          i += 2
                      else:
                          i += 1
                      continue

                  if string:
                      if escaped:
                          escaped = False
                      elif c == '\\':
                          escaped = True
                      elif c == '"':
                          string = False

                      i += 1
                      continue

                  if char:
                      if escaped:
                          escaped = False
                      elif c == '\\':
                          escaped = True
                      elif c == "'":
                          char = False

                      i += 1
                      continue

                  if (
                      c == '/'
                      and i + 1 < len(text)
                      and text[i + 1] == '/'
                  ):
                      line_comment = True
                      i += 2
                      continue

                  if (
                      c == '/'
                      and i + 1 < len(text)
                      and text[i + 1] == '*'
                  ):
                      block_comment = True
                      i += 2
                      continue

                  if c == '"':
                      string = True
                      i += 1
                      continue

                  if c == "'":
                      char = True
                      i += 1
                      continue

                  if c in pairs:
                      stack.append((c, line))

                  elif c in reverse:
                      if not stack or stack[-1][0] != reverse[c]:
                          raise SystemExit(
                              f"Mismatch in {path}:{line}"
                          )

                      stack.pop()

                  i += 1

              if string or char or block_comment or stack:
                  raise SystemExit(
                      f"Unbalanced Kotlin: {path}"
                  )

          files = list(
              Path('app/src/main/java').rglob('*.kt')
          )

          for path in files:
              check(path)

          print(
              f"KOTLIN BALANCE OK: {len(files)} files"
          )
          PY

      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle clean \
            --no-daemon \
            --stacktrace

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          APK=$(find app/build/outputs/apk/release \
            -type f \
            -name '*.apk' \
            | head -n 1)

          test -n "$APK" || {
            echo "ERROR: APK tidak ditemukan"
            exit 1
          }

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging "$APK" \
            | grep -q 'package: name='

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -c \
            -P 16 \
            -v 4 \
            "$APK"

          echo "APK VERIFIED: $APK"

      - name: Rename APK and SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          APK=$(find app/build/outputs/apk/release \
            -type f \
            -name '*.apk' \
            | head -n 1)

          test -n "$APK"

          OUT="app/build/outputs/apk/release/ARS-POS-1.3.6-PHASE4.3.2.21-V8.4.1-FIX1-SIGNED.apk"

          cp "$APK" "$OUT"

          sha256sum "$OUT" > "$OUT.sha256"

          ls -lh \
            "$OUT" \
            "$OUT.sha256"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4

        with:
          name: ARS-POS-1.3.6-PHASE4.3.2.21-V8.4.1-FIX1

          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.3.6-PHASE4.3.2.21-V8.4.1-FIX1-SIGNED.apk
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.3.6-PHASE4.3.2.21-V8.4.1-FIX1-SIGNED.apk.sha256

          if-no-files-found: error
