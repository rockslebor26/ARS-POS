name: ARS POS Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ARS POS Phase 4.3.2.7.1 FIX5
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Phase 4.3.2.7.1 FIX5 ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE="./ARS_POS_PHASE4_3_2_7_1_RECOGNITION_ENGINE_V2_FIX5.zip"
          test -f "$ZIP_FILE"
          unzip -t "$ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract project
        shell: bash
        run: |
          set -e
          rm -rf extracted
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

      - name: Locate Gradle project
        shell: bash
        run: |
          set -e
          SETTINGS=$(find extracted -type f -name settings.gradle.kts | head -n 1)
          test -n "$SETTINGS"
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR"

      - name: Validate FIX5 source
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          test -f app/src/main/java/com/arspos/anglerriausyndicate/SmartProductInput.kt
          test -f app/src/main/java/com/arspos/anglerriausyndicate/data/SmartRecognitionEngine.kt
          test -f app/src/main/java/com/arspos/anglerriausyndicate/data/RecognitionCandidate.kt
          test -f app/src/main/java/com/arspos/anglerriausyndicate/VisualScanObject.kt
          test -f app/src/main/java/com/arspos/anglerriausyndicate/ProductVisualMatcher.kt
          test -f app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt

          grep -q 'suspend fun analyzeMultiOrientation' \
            app/src/main/java/com/arspos/anglerriausyndicate/SmartProductInput.kt

          grep -q 'val drafts = ArrayList<Draft>()' \
            app/src/main/java/com/arspos/anglerriausyndicate/SmartProductInput.kt

          grep -q 'val value = draft.barcode.trim()' \
            app/src/main/java/com/arspos/anglerriausyndicate/SmartProductInput.kt

          grep -q 'var modelCode = ""' \
            app/src/main/java/com/arspos/anglerriausyndicate/SmartProductInput.kt

          grep -q 'import com.arspos.anglerriausyndicate.SmartProductInput' \
            app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt

          grep -q 'import com.arspos.anglerriausyndicate.ProductVisualMatcher' \
            app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt

          grep -q 'import com.arspos.anglerriausyndicate.VisualProductMatch' \
            app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt

          grep -q 'data class RecognitionCandidate' \
            app/src/main/java/com/arspos/anglerriausyndicate/data/RecognitionCandidate.kt

          grep -q 'candidates: List<RecognitionCandidate>' \
            app/src/main/java/com/arspos/anglerriausyndicate/VisualScanObject.kt

          grep -q 'object SmartRecognitionEngine' \
            app/src/main/java/com/arspos/anglerriausyndicate/data/SmartRecognitionEngine.kt

          grep -q 'refsByProduct' \
            app/src/main/java/com/arspos/anglerriausyndicate/data/SmartRecognitionEngine.kt

          grep -q 'fieldTokenScore' \
            app/src/main/java/com/arspos/anglerriausyndicate/data/SmartRecognitionEngine.kt

          grep -q 'versionCode = 117' app/build.gradle.kts
          grep -q 'versionName = "1.1.7"' app/build.gradle.kts

          echo "FIX5 source validation OK."

      - name: Validate ML Kit dependencies
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          grep -q 'com.google.mlkit:object-detection:17.0.2' app/build.gradle.kts
          grep -q 'com.google.mlkit:text-recognition:16.0.1' app/build.gradle.kts
          grep -q 'com.google.mlkit:barcode-scanning:17.3.0' app/build.gradle.kts

          echo "ML Kit dependency validation OK."

      - name: Validate camera and POS
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          MAIN="app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"
          REPO="app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"

          grep -q 'ActivityResultContracts.TakePicture()' "$MAIN"
          grep -q 'Manifest.permission.CAMERA' "$MAIN"
          grep -q 'FileProvider' app/src/main/AndroidManifest.xml
          ! grep -q 'TakePicturePreview' "$MAIN"

          grep -q 'CASH' "$MAIN"
          grep -q 'QRIS' "$MAIN"
          grep -q 'TRANSFER' "$MAIN"
          grep -q 'DEBIT' "$MAIN"
          grep -q 'processingPayment' "$MAIN"
          grep -q 'formatRupiah' "$MAIN"

          grep -q 'db.withTransaction' "$REPO"
          grep -q 'dao.changeStock' "$REPO"

          echo "Camera + POS validation OK."

      - name: Build release APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          gradle clean \
            --no-daemon \
            --stacktrace

          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Verify APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          APK=$(find app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            | head -n 1)

          test -n "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -c \
            -P 16 \
            -v 4 \
            "$APK"

          BADGING=$(
            "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging \
            "$APK"
          )

          echo "$BADGING" | grep -q \
            "name='com.arspos.anglerriausyndicate'"

          echo "$BADGING" | grep -q \
            "versionCode='117'"

          echo "$BADGING" | grep -q \
            "versionName='1.1.7'"

          FINAL="app/build/outputs/apk/release/ARS-POS-1.1.7-PHASE4.3.2.7.1-RECOGNITION-ENGINE-V2-FIX5-SIGNED.apk"

          cp "$APK" "$FINAL"

          sha256sum "$FINAL" > "$FINAL.sha256"

          echo "FINAL=$FINAL" >> "$GITHUB_ENV"

          ls -lh "$FINAL" "$FINAL.sha256"
          cat "$FINAL.sha256"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ARS-POS-1.1.7-PHASE4.3.2.7.1-RECOGNITION-ENGINE-V2-FIX5-SIGNED
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.1.7-PHASE4.3.2.7.1-RECOGNITION-ENGINE-V2-FIX5-SIGNED.apk
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.1.7-PHASE4.3.2.7.1-RECOGNITION-ENGINE-V2-FIX5-SIGNED.apk.sha256
          if-no-files-found: error
          retention-days: 30
