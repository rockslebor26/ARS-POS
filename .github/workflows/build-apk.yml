name: ARS POS Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ARS POS Phase 4.3.2.13 Product Identity Engine V4
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -f "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -f "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -f "$ANDROID_HOME/build-tools/35.0.0/aapt"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Locate Phase 4.3.2.13 ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="./ARS_POS_PHASE4_3_2_13_PRODUCT_IDENTITY_ENGINE_V4.zip"

          test -f "$ZIP_FILE" || {
            echo "ERROR: ZIP tidak ditemukan: $ZIP_FILE"
            find . -maxdepth 2 -type f -iname '*.zip' -print
            exit 1
          }

          unzip -t "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ARS POS project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=$(find extracted -type f -name 'settings.gradle.kts' | head -n 1)

          test -n "$SETTINGS" || {
            echo "ERROR: settings.gradle.kts tidak ditemukan"
            exit 1
          }

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Gradle project: $PROJECT_DIR"

      - name: Validate project structure
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          REQUIRED=(
            "settings.gradle.kts"
            "build.gradle.kts"
            "gradle.properties"
            "app/build.gradle.kts"
            "app/src/main/AndroidManifest.xml"
            "app/src/main/res/xml/file_paths.xml"

            "app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/PosViewModel.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/Money.kt"

            "app/src/main/java/com/arspos/anglerriausyndicate/SmartProductInput.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/SmartVisualScanner.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/ProductVisualMatcher.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/VisualProductMatch.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/VisualScanObject.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/ProductMasterStudio.kt"

            "app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/data/SmartRecognitionEngine.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/data/RecognitionCandidate.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/data/ProductIdentityProfile.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/data/ProductIdentityProfileCodec.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/data/MasterVerificationResult.kt"

            "app/src/main/java/com/arspos/anglerriausyndicate/data/db/ArsDao.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/data/db/ArsDatabase.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/data/db/ProductEntity.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/data/db/ProductPhotoEntity.kt"

            "PHASE4_3_2_13_PRODUCT_IDENTITY_ENGINE_V4.md"
          )

          for FILE in "${REQUIRED[@]}"; do
            test -f "$FILE" || {
              echo "MISSING: $FILE"
              exit 1
            }
          done

          echo "PROJECT STRUCTURE OK"

      - name: Validate Phase 4.3.2.13 identity profile V4
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          PROFILE="app/src/main/java/com/arspos/anglerriausyndicate/data/ProductIdentityProfile.kt"
          CODEC="app/src/main/java/com/arspos/anglerriausyndicate/data/ProductIdentityProfileCodec.kt"
          ENGINE="app/src/main/java/com/arspos/anglerriausyndicate/data/SmartRecognitionEngine.kt"
          REPO="app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"
          MAIN="app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"
          INPUT="app/src/main/java/com/arspos/anglerriausyndicate/SmartProductInput.kt"

          grep -q 'Phase 4.3.2.13' "$PROFILE" "$ENGINE" "$MAIN"

          grep -q 'val aliases: List<String>' "$PROFILE"

          grep -q 'VERSION_2' "$CODEC"
          grep -q 'VERSION_1' "$CODEC"
          grep -q 'aliases' "$CODEC"

          grep -q 'profile.aliases' "$ENGINE"

          grep -q 'Identity aliases are product-specific memory' "$ENGINE"

          grep -q 'mergeProductIdentityProfile' "$REPO"

          grep -q 'addAll(old?.aliases.orEmpty())' "$REPO"

          grep -q 'analyzeMultiOrientation' "$MAIN"

          grep -q 'foto ini tetap dapat menjadi master visual awal' "$MAIN"

          grep -q 'Barcode tidak wajib' "$MAIN"

          echo "IDENTITY PROFILE V4 OK"

      - name: Validate no-barcode product path
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          MAIN="app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"
          REPO="app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"
          ENTITY="app/src/main/java/com/arspos/anglerriausyndicate/data/db/ProductEntity.kt"

          grep -q 'Barcode (opsional)' "$MAIN"
          grep -q 'IDENTITAS MANUAL TETAP DIDUKUNG' "$MAIN"
          grep -q 'generateSku' "$MAIN"

          grep -q 'ifBlank { null }' "$REPO"
          grep -q 'require(name.isNotBlank())' "$REPO"

          grep -q 'val barcode: String?=null' "$ENTITY"

          echo "NO-BARCODE PATH OK"

      - name: Validate master seed photo
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          MAIN="app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"
          VM="app/src/main/java/com/arspos/anglerriausyndicate/PosViewModel.kt"
          REPO="app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"

          grep -q 'First intake photo becomes a visual master seed' "$MAIN"
          grep -q 'suspend fun addProductPhoto' "$VM"
          grep -q 'captureAngle:String="UNKNOWN"' "$REPO"

          echo "MASTER SEED PATH OK"

      - name: Validate ML Kit and Camera
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          GRADLE_FILE="app/build.gradle.kts"
          MAIN="app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"

          grep -q 'com.google.mlkit:object-detection:17.0.2' "$GRADLE_FILE"
          grep -q 'com.google.mlkit:text-recognition:16.0.1' "$GRADLE_FILE"
          grep -q 'com.google.mlkit:barcode-scanning:17.3.0' "$GRADLE_FILE"

          grep -q 'ActivityResultContracts.TakePicture()' "$MAIN"
          grep -q 'Manifest.permission.CAMERA' "$MAIN"

          grep -q 'FileProvider' app/src/main/AndroidManifest.xml

          if grep -q 'TakePicturePreview' "$MAIN"; then
            echo "ERROR: TakePicturePreview masih digunakan."
            exit 1
          fi

          echo "ML KIT + CAMERA OK"

      - name: Validate database and update compatibility
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          APP="app/build.gradle.kts"
          DB="app/src/main/java/com/arspos/anglerriausyndicate/data/db/ArsDatabase.kt"
          REPO="app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"

          grep -q 'applicationId = "com.arspos.anglerriausyndicate"' "$APP"

          grep -q 'versionCode = 126' "$APP"
          grep -q 'versionName = "1.2.6"' "$APP"

          grep -q 'signingConfig = signingConfigs.getByName("debug")' "$APP"

          grep -q 'MIGRATION_3_4' "$DB"
          grep -q 'MIGRATION_4_5' "$DB"

          grep -q 'withTransaction' "$REPO"

          echo "UPDATE COMPATIBILITY OK"

      - name: Validate existing POS APIs
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          MAIN="app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"
          VM="app/src/main/java/com/arspos/anglerriausyndicate/PosViewModel.kt"
          REPO="app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"

          for FN in setPrimaryProductPhoto deleteProductPhoto stockIn saleItems processReturn profitSummary checkout; do

            grep -q "fun $FN" "$VM" || {
              echo "MISSING VM API: $FN"
              exit 1
            }

            grep -q "fun $FN" "$REPO" || {
              echo "MISSING REPOSITORY API: $FN"
              exit 1
            }

          done

          grep -q 'CASH' "$MAIN"
          grep -q 'QRIS' "$MAIN"
          grep -q 'TRANSFER' "$MAIN"
          grep -q 'DEBIT' "$MAIN"

          grep -q 'formatRupiah' "$MAIN"

          echo "EXISTING POS OK"

      - name: Validate source syntax balance
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path

          files = list(Path('app/src/main/java').rglob('*.kt'))

          for p in files:
              s = p.read_text(encoding='utf-8')

              if s.count('{') != s.count('}'):
                  raise SystemExit(f'Brace mismatch: {p}')

              if s.count('(') != s.count(')'):
                  raise SystemExit(f'Paren mismatch: {p}')

          print(f'BALANCE CHECK OK: {len(files)} Kotlin files')
          PY

      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle clean --no-daemon --stacktrace

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          APK=$(find app/build/outputs/apk/release \
            -type f \
            -name '*.apk' \
            | head -n 1)

          test -n "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging "$APK" \
            | grep -q 'package: name='

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -c \
            -P 16 \
            -v 4 \
            "$APK" \
            | tail -n 2

          echo "APK VERIFIED: $APK"

      - name: Rename signed APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          APK=$(find app/build/outputs/apk/release \
            -type f \
            -name '*.apk' \
            | head -n 1)

          OUT="app/build/outputs/apk/release/ARS-POS-1.2.6-PHASE4.3.2.13-PRODUCT-IDENTITY-ENGINE-V4-SIGNED.apk"

          cp "$APK" "$OUT"

          sha256sum "$OUT" | tee "$OUT.sha256"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4

        with:
          name: ARS-POS-1.2.6-PHASE4.3.2.13

          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.2.6-PHASE4.3.2.13-PRODUCT-IDENTITY-ENGINE-V4-SIGNED.apk
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.2.6-PHASE4.3.2.13-PRODUCT-IDENTITY-ENGINE-V4-SIGNED.apk.sha256

          if-no-files-found: error
