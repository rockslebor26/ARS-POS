name: ARS POS Official Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build ARS POS Phase 4.3.2.29 V8.4.9 Rod Anchor Cross-Lane Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -f "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -f "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -f "$ANDROID_HOME/build-tools/35.0.0/aapt"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Locate V8.4.9 source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="./ARS_POS_PHASE4_3_2_29_V8_4_9_ROD_ANCHOR_CROSS_LANE_GATE.zip"

          test -f "$ZIP_FILE" || {
            echo "ERROR: ZIP V8.4.9 tidak ditemukan: $ZIP_FILE"
            find . -maxdepth 3 -type f -iname '*.zip' -print
            exit 1
          }

          unzip -t "$ZIP_FILE"

          unzip -l "$ZIP_FILE" | grep -q \
            'app/src/main/java/com/arspos/anglerriausyndicate/ScanProposal.kt'

          unzip -l "$ZIP_FILE" | grep -q \
            'app/src/main/java/com/arspos/anglerriausyndicate/LongObjectAnalyzer.kt'

          unzip -l "$ZIP_FILE" | grep -q \
            'app/src/main/java/com/arspos/anglerriausyndicate/data/SmartRecognitionEngine.kt'

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ARS POS project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=$(find extracted -type f -name 'settings.gradle.kts' | head -n 1)

          test -n "$SETTINGS" || {
            echo "ERROR: settings.gradle.kts tidak ditemukan"
            exit 1
          }

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Gradle project: $PROJECT_DIR"

      - name: Validate V8.4.9 source files
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          PKG="app/src/main/java/com/arspos/anglerriausyndicate"

          REQUIRED=(
            "settings.gradle.kts"
            "build.gradle.kts"
            "gradle.properties"
            "app/build.gradle.kts"
            "app/src/main/AndroidManifest.xml"
            "app/src/main/res/xml/file_paths.xml"

            "$PKG/MainActivity.kt"
            "$PKG/PosViewModel.kt"
            "$PKG/ArsFlightRecorder.kt"
            "$PKG/ArsDevCenter.kt"
            "$PKG/ArsUpdateChannel.kt"
            "$PKG/BitmapSafety.kt"
            "$PKG/ProductMasterStudio.kt"
            "$PKG/FullscreenMasterCamera.kt"
            "$PKG/RodFocusProcessor.kt"
            "$PKG/SmartVisualScanner.kt"
            "$PKG/LongObjectAnalyzer.kt"
            "$PKG/ProductVisualMatcher.kt"
            "$PKG/VisualScanObject.kt"
            "$PKG/ScanResultAggregator.kt"
            "$PKG/ScanProposal.kt"
            "$PKG/ScanCoordinateNormalizer.kt"

            "$PKG/data/ProductionRepository.kt"
            "$PKG/data/SmartRecognitionEngine.kt"
            "$PKG/data/RecognitionCandidate.kt"
            "$PKG/data/ProductIdentityProfile.kt"
            "$PKG/data/ProductIdentityProfileCodec.kt"
            "$PKG/data/MasterVerificationResult.kt"

            "$PKG/data/db/ArsDao.kt"
            "$PKG/data/db/ArsDatabase.kt"
            "$PKG/data/db/ProductEntity.kt"
            "$PKG/data/db/ProductPhotoEntity.kt"

            "PHASE4_3_2_29_V8_4_9_ROD_ANCHOR_CROSS_LANE_GATE.md"
            "ARS_OFFICIAL_RELEASE_SETUP.md"
            "PROJECT_CONTINUITY.md"
          )

          for FILE in "${REQUIRED[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "MISSING: $FILE"
              find "$PKG" -maxdepth 3 -type f | sort || true
              exit 1
            fi
          done

          grep -q 'applicationId = "com.arspos.anglerriausyndicate"' app/build.gradle.kts
          grep -q 'versionCode = 144' app/build.gradle.kts
          grep -q 'versionName = "1.4.4"' app/build.gradle.kts

          grep -q 'create("arsOfficialRelease")' app/build.gradle.kts
          grep -q 'releaseSigningAvailable' app/build.gradle.kts
          ! grep -q 'signingConfig = signingConfigs.getByName("debug")' app/build.gradle.kts

          MAIN="$PKG/MainActivity.kt"
          FLIGHT="$PKG/ArsFlightRecorder.kt"
          DEV="$PKG/ArsDevCenter.kt"
          UPDATE="$PKG/ArsUpdateChannel.kt"
          SCANNER="$PKG/SmartVisualScanner.kt"
          LONG="$PKG/LongObjectAnalyzer.kt"
          MATCHER="$PKG/ProductVisualMatcher.kt"
          AGG="$PKG/ScanResultAggregator.kt"
          PROPOSAL="$PKG/ScanProposal.kt"
          NORMALIZER="$PKG/ScanCoordinateNormalizer.kt"
          REPO="$PKG/data/ProductionRepository.kt"
          ENGINE="$PKG/data/SmartRecognitionEngine.kt"
          CANDIDATE="$PKG/data/RecognitionCandidate.kt"

          grep -q 'Phase 4.3.2.29 V8.4.9' "$MAIN"
          grep -q 'Rod Anchor Identity' "$MAIN"
          grep -q 'Cross-Lane Scene Gate' "$MAIN"

          grep -q 'Phase: 4.3.2.29' "$FLIGHT"
          grep -q 'V8.4.9 — Rod Anchor Identity + Cross-Lane Scene Gate' "$FLIGHT"
          grep -q 'persisted update channel' "$FLIGHT"
          grep -q 'Latest cross-lane proposals suppressed' "$FLIGHT"
          grep -q 'Latest background long proposals suppressed' "$FLIGHT"
          grep -q 'Latest native heap delta' "$FLIGHT"
          grep -q 'Latest total PSS' "$FLIGHT"
          grep -q 'Latest decision rule' "$FLIGHT"
          grep -q 'Current Installed Version' "$FLIGHT"
          grep -q 'Previous Installed Version' "$FLIGHT"
          grep -q 'Signer SHA-256' "$FLIGHT"

          grep -q 'APP_UPDATE' "$UPDATE"
          grep -q 'IN_PLACE_UPDATE' "$UPDATE"
          grep -q 'signingSha256' "$UPDATE"

          grep -q 'cross-lane scene gate' "$DEV"
          grep -q 'rod-anchor identity' "$DEV"
          grep -q 'com.openai.chatgpt' "$DEV"

          grep -q 'normalOwnershipConflict' "$PROPOSAL"
          grep -q 'rodStructureScore' "$PROPOSAL"
          grep -q 'SOURCE_CROSS_LANE' "$PROPOSAL"
          grep -q 'SOURCE_BACKGROUND' "$PROPOSAL"

          grep -q 'applyCrossLaneSceneGate' "$SCANNER"
          grep -q 'MIN_ANALYZER_ROD_STRUCTURE' "$SCANNER"
          grep -q 'STRONG_NORMAL_OWNERSHIP' "$SCANNER"
          grep -q 'SOURCE_CROSS_LANE' "$SCANNER"
          grep -q 'SOURCE_BACKGROUND' "$SCANNER"
          grep -q 'assignPhysicalHintsAndSuppressBridges' "$SCANNER"
          grep -q 'isParallelContainer' "$SCANNER"

          grep -q 'rodStructureScore' "$LONG"
          grep -q 'background-rejection gate' "$LONG"

          grep -q 'scoreBatchLongCached' "$MATCHER"
          grep -q 'referenceStripCache' "$MATCHER"
          grep -q 'longProfileSimilarity' "$MATCHER"
          grep -q 'scoreBatchCoarse' "$MATCHER"

          grep -q 'anchorScore' "$CANDIDATE"

          grep -q 'rodAnchorScore' "$ENGINE"
          grep -q 'MIN_LONG_ANCHOR_SCORE' "$ENGINE"
          grep -q 'MIN_LONG_ANCHOR_MARGIN' "$ENGINE"
          grep -q 'ROD_ANCHOR_VISUAL_VERIFIED' "$ENGINE"
          grep -q 'ruleId' "$ENGINE"

          grep -q 'coarseProducts' "$REPO"
          grep -q 'shortlistedProducts' "$REPO"
          grep -q 'decisionRuleId' "$REPO"
          grep -q 'normalOwnershipConflict' "$REPO"
          grep -q 'rodStructureScore' "$REPO"
          grep -q 'nativeDeltaMb' "$REPO"
          grep -q 'totalPssMb' "$REPO"
          grep -q 'temporaryCrops' "$REPO"
          grep -q 'recycledCrops' "$REPO"
          grep -q 'longProposalCount <= 1' "$REPO"

          grep -q 'laneFamily' "$AGG"
          grep -q 'existing.all' "$AGG"
          grep -q 'shouldSuppressDuplicateLong' "$AGG"
          grep -q 'distinctLongInstances' "$AGG"
          grep -q 'confirmedDistinctParallel' "$AGG"

          grep -q 'object ScanCoordinateNormalizer' "$NORMALIZER"
          grep -q 'rotationDegrees' "$NORMALIZER"

          echo ""
          echo "========================================"
          echo "V8.4.9 SOURCE VALIDATION OK"
          echo "========================================"

      - name: Validate Kotlin source balance
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path

          pairs = {'{': '}', '(': ')', '[': ']'}
          reverse = {v: k for k, v in pairs.items()}

          def check(path):
              text = path.read_text(encoding='utf-8')
              stack = []
              i = 0
              line = 1
              line_comment = False
              block_comment = False
              string = False
              char = False
              escaped = False

              while i < len(text):
                  c = text[i]

                  if c == '\n':
                      line += 1
                      line_comment = False
                      i += 1
                      continue

                  if line_comment:
                      i += 1
                      continue

                  if block_comment:
                      if c == '*' and i + 1 < len(text) and text[i + 1] == '/':
                          block_comment = False
                          i += 2
                      else:
                          i += 1
                      continue

                  if string:
                      if escaped:
                          escaped = False
                      elif c == '\\':
                          escaped = True
                      elif c == '"':
                          string = False
                      i += 1
                      continue

                  if char:
                      if escaped:
                          escaped = False
                      elif c == '\\':
                          escaped = True
                      elif c == "'":
                          char = False
                      i += 1
                      continue

                  if c == '/' and i + 1 < len(text) and text[i + 1] == '/':
                      line_comment = True
                      i += 2
                      continue

                  if c == '/' and i + 1 < len(text) and text[i + 1] == '*':
                      block_comment = True
                      i += 2
                      continue

                  if c == '"':
                      string = True
                      i += 1
                      continue

                  if c == "'":
                      char = True
                      i += 1
                      continue

                  if c in pairs:
                      stack.append((c, line))
                  elif c in reverse:
                      if not stack or stack[-1][0] != reverse[c]:
                          raise SystemExit(f"Mismatch in {path}:{line}")
                      stack.pop()

                  i += 1

              if string or char or block_comment or stack:
                  raise SystemExit(f"Unbalanced Kotlin: {path}")

          files = list(Path('app/src/main/java').rglob('*.kt'))
          for path in files:
              check(path)

          print(f"KOTLIN BALANCE OK: {len(files)} files")
          PY

      - name: Prepare ARS POS official release signing
        shell: bash
        env:
          ARS_RELEASE_KEYSTORE_BASE64: ${{ secrets.ARS_RELEASE_KEYSTORE_BASE64 }}
          ARS_RELEASE_STORE_PASSWORD: ${{ secrets.ARS_RELEASE_STORE_PASSWORD }}
          ARS_RELEASE_KEY_ALIAS: ${{ secrets.ARS_RELEASE_KEY_ALIAS }}
          ARS_RELEASE_KEY_PASSWORD: ${{ secrets.ARS_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$ARS_RELEASE_KEYSTORE_BASE64" || {
            echo "ERROR: GitHub Secret ARS_RELEASE_KEYSTORE_BASE64 belum dibuat."
            exit 1
          }

          test -n "$ARS_RELEASE_STORE_PASSWORD" || {
            echo "ERROR: GitHub Secret ARS_RELEASE_STORE_PASSWORD belum dibuat."
            exit 1
          }

          test -n "$ARS_RELEASE_KEY_ALIAS" || {
            echo "ERROR: GitHub Secret ARS_RELEASE_KEY_ALIAS belum dibuat."
            exit 1
          }

          test -n "$ARS_RELEASE_KEY_PASSWORD" || {
            echo "ERROR: GitHub Secret ARS_RELEASE_KEY_PASSWORD belum dibuat."
            exit 1
          }

          KEYSTORE="$RUNNER_TEMP/ars-pos-official-release.jks"
          printf '%s' "$ARS_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          test -s "$KEYSTORE"

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass "$ARS_RELEASE_STORE_PASSWORD" \
            -alias "$ARS_RELEASE_KEY_ALIAS" \
            >/dev/null

          echo "ARS_RELEASE_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "Official release keystore validated."

      - name: Clean project
        shell: bash
        env:
          ARS_RELEASE_STORE_PASSWORD: ${{ secrets.ARS_RELEASE_STORE_PASSWORD }}
          ARS_RELEASE_KEY_ALIAS: ${{ secrets.ARS_RELEASE_KEY_ALIAS }}
          ARS_RELEASE_KEY_PASSWORD: ${{ secrets.ARS_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle clean \
            --no-daemon \
            --stacktrace

      - name: Build official release APK
        shell: bash
        env:
          ARS_RELEASE_STORE_PASSWORD: ${{ secrets.ARS_RELEASE_STORE_PASSWORD }}
          ARS_RELEASE_KEY_ALIAS: ${{ secrets.ARS_RELEASE_KEY_ALIAS }}
          ARS_RELEASE_KEY_PASSWORD: ${{ secrets.ARS_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Verify official APK identity and signature
        shell: bash
        env:
          ARS_RELEASE_CERT_SHA256: ${{ secrets.ARS_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          APK=$(find \
            app/build/outputs/apk/release \
            -type f \
            -name '*.apk' \
            | head -n 1)

          test -n "$APK" || {
            echo "ERROR: APK tidak ditemukan"
            exit 1
          }

          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 1)
          echo "$BADGING"

          echo "$BADGING" | grep -q "name='com.arspos.anglerriausyndicate'"
          echo "$BADGING" | grep -q "versionCode='144'"
          echo "$BADGING" | grep -q "versionName='1.4.4'"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            --print-certs \
            "$APK" \
            | tee signer-info.txt

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -c \
            -P 16 \
            -v 4 \
            "$APK"

          CERT_SHA=$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}' signer-info.txt)
          test -n "$CERT_SHA" || {
            echo "ERROR: Tidak dapat membaca signer SHA-256 dari APK"
            exit 1
          }

          test -n "${ARS_RELEASE_CERT_SHA256:-}" || {
            echo "ERROR: GitHub Secret ARS_RELEASE_CERT_SHA256 wajib diisi untuk melindungi update channel."
            exit 1
          }

          NORMALIZED_CERT=$(printf '%s' "$CERT_SHA" | tr -d ':' | tr '[:lower:]' '[:upper:]')
          EXPECTED=$(printf '%s' "$ARS_RELEASE_CERT_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]')

          if [ "$NORMALIZED_CERT" != "$EXPECTED" ]; then
            echo "ERROR: SIGNER BERUBAH. Build dihentikan untuk melindungi update channel."
            echo "Current signer: $CERT_SHA"
            exit 1
          fi

          printf 'ARS POS OFFICIAL RELEASE\nVersion: 1.4.4 (144)\nPackage: com.arspos.anglerriausyndicate\nSigner SHA-256: %s\n' \
            "$CERT_SHA" > SIGNING_FINGERPRINT.txt

          echo "SIGNER_SHA256=$CERT_SHA" >> "$GITHUB_ENV"
          echo "APK identity + signing verified."

          {
            echo "### ARS POS Official Release"
            echo "- Version: 1.4.4 (144)"
            echo "- Phase: 4.3.2.29 / V8.4.9"
            echo "- Package: com.arspos.anglerriausyndicate"
            echo "- Signer SHA-256: $CERT_SHA"
            echo "- Update target: install directly over V8.4.8 Official (do not uninstall)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rename APK and SHA256
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          APK=$(find \
            app/build/outputs/apk/release \
            -type f \
            -name '*.apk' \
            | head -n 1)

          test -n "$APK"

          OUT="app/build/outputs/apk/release/ARS-POS-1.4.4-PHASE4.3.2.29-V8.4.9-ROD-ANCHOR-CROSS-LANE-GATE-SIGNED.apk"

          cp "$APK" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          cp SIGNING_FINGERPRINT.txt app/build/outputs/apk/release/SIGNING_FINGERPRINT.txt

          ls -lh \
            "$OUT" \
            "$OUT.sha256" \
            app/build/outputs/apk/release/SIGNING_FINGERPRINT.txt

      - name: Upload official signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ARS-POS-1.4.4-PHASE4.3.2.29-V8.4.9-OFFICIAL
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.4.4-PHASE4.3.2.29-V8.4.9-ROD-ANCHOR-CROSS-LANE-GATE-SIGNED.apk
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.4.4-PHASE4.3.2.29-V8.4.9-ROD-ANCHOR-CROSS-LANE-GATE-SIGNED.apk.sha256
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/SIGNING_FINGERPRINT.txt
          if-no-files-found: error
