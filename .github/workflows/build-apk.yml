name: ARS POS V8.8.0 Identity Intelligence 200 R1 20260924

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ARS_POS_V8_8_0_IDENTITY_INTELLIGENCE_200_R1_20260924.zip
      - .github/workflows/build-apk_ARS_POS_V8_8_0_IDENTITY_INTELLIGENCE_200_R1_20260924.yml

permissions:
  contents: read

concurrency:
  group: ars-pos-v880-identity-intelligence-200-r1-20260924-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_ZIP: ARS_POS_V8_8_0_IDENTITY_INTELLIGENCE_200_R1_20260924.zip
      SOURCE_SHA256: 5b5c4933e86041525690f09083a1e0bb877532e81efe2368db3f89ae9c60d7d8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Verify exact V8.8.0 Identity Intelligence source package
        shell: bash
        run: |
          set -euo pipefail

          test -f "$SOURCE_ZIP" || {
            echo "::error::Upload $SOURCE_ZIP ke root repository."
            exit 1
          }

          printf '%s  %s\n' "$SOURCE_SHA256" "$SOURCE_ZIP" | sha256sum -c -
          unzip -t "$SOURCE_ZIP" >/dev/null

          PROJECT_DIR=$(mktemp -d "$RUNNER_TEMP/ars-v880-200.XXXXXX")
          unzip -q "$SOURCE_ZIP" -d "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          test -f "$PROJECT_DIR/settings.gradle.kts" || {
            echo "::error::settings.gradle.kts tidak ditemukan di root ZIP."
            exit 1
          }

          test -f "$PROJECT_DIR/build.gradle.kts" || {
            echo "::error::build.gradle.kts tidak ditemukan di root ZIP."
            exit 1
          }

          test -f "$PROJECT_DIR/app/build.gradle.kts" || {
            echo "::error::app/build.gradle.kts tidak ditemukan."
            exit 1
          }

          test -f "$PROJECT_DIR/physicaltruth-jvm/build.gradle.kts" || {
            echo "::error::physicaltruth-jvm/build.gradle.kts tidak ditemukan."
            exit 1
          }

          test -f "$PROJECT_DIR/physicaltruth-jvm/src/test/kotlin/com/arspos/anglerriausyndicate/RodMaterialEvidenceTest.kt" || {
            echo "::error::RodMaterialEvidenceTest.kt JVM module tidak ditemukan."
            exit 1
          }

          test -f "$PROJECT_DIR/physicaltruth-jvm/src/test/kotlin/com/arspos/anglerriausyndicate/PhysicalImageEvidenceTest.kt" || {
            echo "::error::PhysicalImageEvidenceTest.kt JVM module tidak ditemukan."
            exit 1
          }

          test -f "$PROJECT_DIR/physicaltruth-jvm/src/test/kotlin/com/arspos/anglerriausyndicate/PackageEdgeEvidenceTest.kt" || {
            echo "::error::PackageEdgeEvidenceTest.kt JVM regression tidak ditemukan."
            exit 1
          }

          test -f "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/PackageEdgePolicy.kt" || {
            echo "::error::PackageEdgePolicy.kt tidak ditemukan."
            exit 1
          }

          test -f "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/RodEndpointProfile.kt" || {
            echo "::error::RodEndpointProfile.kt tidak ditemukan."
            exit 1
          }

          test -f "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/LiveScenePreview.kt" || {
            echo "::error::LiveScenePreview.kt tidak ditemukan."
            exit 1
          }

          test -f "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/LiveSmartScanCamera.kt" || {
            echo "::error::LiveSmartScanCamera.kt tidak ditemukan."
            exit 1
          }

          test -f "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/CorrectTypeRoutingPolicy.kt" || {
            echo "::error::CorrectTypeRoutingPolicy.kt tidak ditemukan."
            exit 1
          }

          test -f "$PROJECT_DIR/physicaltruth-jvm/src/test/kotlin/com/arspos/anglerriausyndicate/NormalRescueRegressionTest.kt" || {
            echo "::error::NormalRescueRegressionTest.kt tidak ditemukan."
            exit 1
          }

          test -f "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/IdentityTextPolicy.kt" || {
            echo "::error::IdentityTextPolicy.kt tidak ditemukan."
            exit 1
          }

          test -f "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/LiveIdentityPolicy.kt" || {
            echo "::error::LiveIdentityPolicy.kt tidak ditemukan."
            exit 1
          }

          test -f "$PROJECT_DIR/app/src/test/java/com/arspos/anglerriausyndicate/IdentityTextPolicyTest.kt" || {
            echo "::error::IdentityTextPolicyTest.kt tidak ditemukan."
            exit 1
          }

          test -f "$PROJECT_DIR/app/src/test/java/com/arspos/anglerriausyndicate/LiveIdentityPolicyTest.kt" || {
            echo "::error::LiveIdentityPolicyTest.kt tidak ditemukan."
            exit 1
          }

          test -f "$PROJECT_DIR/app/src/test/resources/identity/v870_esse_change_double_unknown.jpg" || {
            echo "::error::ESSE V8.7.0 field regression fixture tidak ditemukan."
            exit 1
          }

          printf '%s  %s\n' \
            "8a9f49121738346d6d2fc73425208517ffa789afbba7758cbb4a5fc64ca2b8a0" \
            "$PROJECT_DIR/app/src/test/resources/identity/v870_esse_change_double_unknown.jpg" \
            | sha256sum -c -

          test -f "$PROJECT_DIR/app/src/test/resources/physical_truth/v860_normal_bottle_misrouted_long.jpg" || {
            echo "::error::Bound V8.6.0 NORMAL bottle regression fixture tidak ditemukan."
            exit 1
          }

          test -f "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/NormalProposalPurityPolicy.kt" || {
            echo "::error::NormalProposalPurityPolicy.kt tidak ditemukan."
            exit 1
          }

          test -f "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/PersistentPhysicalIdBinder.kt" || {
            echo "::error::PersistentPhysicalIdBinder.kt tidak ditemukan."
            exit 1
          }

          test -f "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/TemporalPhysicalConsensus.kt" || {
            echo "::error::TemporalPhysicalConsensus.kt tidak ditemukan."
            exit 1
          }

          grep -Fq 'typed-lane invariant' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/LiveScenePreview.kt"

          grep -Fq 'cross-lane bind forbidden' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/PersistentPhysicalIdBinder.kt"

          test -f "$PROJECT_DIR/PHASE4_3_5_0_V8_8_0_IDENTITY_INTELLIGENCE.md" || {
            echo "::error::Dokumen Identity Intelligence V8.8.0 tidak ditemukan."
            exit 1
          }

          test -f "$PROJECT_DIR/RELEASE_200.md" || {
            echo "::error::RELEASE_200.md tidak ditemukan."
            exit 1
          }

          test -f "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/ArsAdaptiveLearning.kt" || {
            echo "::error::ArsAdaptiveLearning.kt tidak ditemukan."
            exit 1
          }

          test -f "$PROJECT_DIR/tools/validate_source.py" || {
            echo "::error::tools/validate_source.py tidak ditemukan."
            exit 1
          }

          test -f "$PROJECT_DIR/SOURCE_FILES_SHA256.txt" || {
            echo "::error::SOURCE_FILES_SHA256.txt tidak ditemukan."
            exit 1
          }

          # Regression guard for Kotlin/Compose compile failure from the first 157 attempt.
          # Modifier.weight(...) is a RowScope/ColumnScope API. Do not import
          # the internal RowColumnParentData.weight symbol explicitly.
          if grep -RIn '^import androidx\.compose\.foundation\.layout\.weight$' \
            "$PROJECT_DIR/app/src/main/java" --include='*.kt'; then
            echo "::error::Invalid explicit Compose weight import detected. Use Modifier.weight inside RowScope/ColumnScope without this import."
            exit 1
          fi

          grep -Fq 'object NormalProposalPurityPolicy' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/NormalProposalPurityPolicy.kt"

          grep -Fq 'object PersistentPhysicalIdBinder' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/PersistentPhysicalIdBinder.kt"

          grep -Fq 'recordGroundTruth' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/ArsVisualEvidenceRecorder.kt"

          grep -Fq 'analysis_replay.png' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/ArsVisualEvidenceRecorder.kt"

          grep -Fq 'TEMPORAL_ML_SEED' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/TemporalPhysicalConsensus.kt"

          grep -Fq 'SCAN_PRE_GATE_BIND' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"

          grep -Fq 'highResolutionIdentityUsed' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"

          grep -Fq 'catch (cancelled: CancellationException)' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/LiveSmartScanCamera.kt"

          grep -Fq 'inputSha256' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/ArsVisualEvidenceRecorder.kt"

          grep -Fq 'analyzeLiveFast(crop)' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"

          grep -Fq 'analyzeLongIdentity(crop)' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"

          grep -Fq 'Live LONG uses the cheap coarse fingerprint pass' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"

          grep -Fq 'axisAngleSimilarity' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/PersistentPhysicalIdBinder.kt"

          grep -Fq 'firstCandidateMs' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/LiveSmartScanCamera.kt"

          grep -Fq 'CorrectTypeRoutingPolicy.shouldRescueNonRodToNormal' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/SmartVisualScanner.kt"

          grep -Fq 'NON_ROD_TO_NORMAL_RESCUE' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/SmartVisualScanner.kt"

          grep -Fq 'normal + nonRodNormalRescueRaw' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/SmartVisualScanner.kt"

          grep -Fq 'CorrectTypeRoutingPolicy.shouldPreviewMlTallAsNormal' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"

          grep -Fq 'recordCatalogSnapshot' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"

          grep -Fq 'catalog_snapshot.json' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/ArsVisualEvidenceRecorder.kt"

          grep -Fq 'LIVE_LOOP_DELAY_MS = 180L' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/ArsV850Config.kt"

          grep -Fq 'LIVE_STABLE_REFRESH_MS = 500L' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/ArsV850Config.kt"

          grep -Fq 'ground_truth.jsonl' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/ArsVisualEvidenceRecorder.kt"

          # V8.8.0 field-video identity regression guards.
          grep -Fq 'AMBIGUOUS_VISUAL_REQUIRES_OCR' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/LiveIdentityPolicy.kt"

          grep -Fq 'LiveIdentityPolicy.shouldRunNormalIdentity' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"

          grep -Fq 'IdentityTextPolicy.identityBearingText' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/data/SmartRecognitionEngine.kt"

          grep -Fq 'NORMAL_VISUAL_MASTER_VERIFIED_WEAK_OCR' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/data/SmartRecognitionEngine.kt"

          grep -Fq 'enableConfirmedHybridVisual' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"

          grep -Fq 'AJARKAN OBJEK ${firstUnrecognized.index} KE ARS' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"

          grep -Fq 'OCR IDENTITAS:' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"

          grep -Fq '"identityOcr"' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"

          grep -Fq '"ocrGateReasons"' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/LiveSmartScanCamera.kt"

          grep -Fq 'FEATURE_AMBIGUOUS_VISUAL_OCR = true' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/ArsV850Config.kt"

          grep -Fq 'FEATURE_REGULATORY_TEXT_FILTER = true' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/ArsV850Config.kt"

          grep -Fq 'FEATURE_WEAK_OCR_VISUAL_FALLBACK = true' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/ArsV850Config.kt"

          grep -Fq 'FEATURE_DIRECT_TEACH_CTA = true' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/ArsV850Config.kt"

          grep -Fq 'FEATURE_CONFIRMED_HYBRID_VISUAL = true' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/ArsV850Config.kt"

          # V8.8.0 Identity Intelligence + AI Gateway guards.
          # These modules may add evidence/recovery/teaching,
          # but must not bypass existing recognition/quantity safety.
          for f in \
            ArsV850Config.kt \
            MlGuidedLocalRodRecovery.kt \
            PersistentPhysicalFragmentFusion.kt \
            ArsSafetyKernel.kt \
            ArsDecisionEvidenceLedger.kt; do
            test -f "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/$f" || {
              echo "::error::V8.8.0 module $f tidak ditemukan."
              exit 1
            }
          done

          grep -Fq 'ML_GUIDED_LOCAL_RECOVERY' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/MlGuidedLocalRodRecovery.kt"

          grep -Fq 'PersistentPhysicalFragmentFusion' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/PersistentPhysicalFragmentFusion.kt"

          grep -Fq 'SafetyKernel' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/ArsSafetyKernel.kt"

          grep -Fq 'DecisionEvidenceLedger' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/ArsDecisionEvidenceLedger.kt"

          for f in \
            ArsAiEngineer.kt \
            ArsAiEngineerClient.kt \
            ArsAiGatewaySettings.kt \
            ArsAiEvidencePacket.kt \
            ArsAiLocalAdvisor.kt \
            ArsAiRequestSecurity.kt; do
            test -f "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/$f" || {
              echo "::error::V8.8.0 AI Engineer module $f tidak ditemukan."
              exit 1
            }
          done

          for f in server.mjs security.mjs package.json Dockerfile DEPLOYMENT.md SECURITY.md .env.example; do
            test -f "$PROJECT_DIR/ars-ai-gateway/$f" || {
              echo "::error::ARS AI Gateway production file $f tidak ditemukan."
              exit 1
            }
          done

          grep -Fq 'ARS AI ENGINEER • ANALISIS & ROOT CAUSE' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"

          grep -Fq 'AI_ENGINEER_MODE = "ENGINEERING_PROPOSAL_GATED"' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/ArsV850Config.kt"

          grep -Fq 'PHASE = "4.3.5.0"' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/ArsV850Config.kt"

          grep -Fq 'ENGINE = "V8.8.0"' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/ArsV850Config.kt"

          grep -Fq 'VERSION_CODE = 200' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/ArsV850Config.kt"

          grep -Fq 'SELF_LEARNING_MODE = "ACTIVE_CONFIRMED_ONLY"' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/ArsV850Config.kt"

          grep -Fq 'FEATURE_CONFIRMED_VISUAL_TEACHING = true' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/ArsV850Config.kt"

          grep -Fq 'AJARKAN KE ARS' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"

          grep -Fq 'NORMAL_VISUAL_MASTER_VERIFIED' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/data/SmartRecognitionEngine.kt"

          grep -Fq 'LEARNED_CONFIRMED_' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"

          grep -Fq 'reservedPersistentIds' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"

          grep -Fq 'RANCANG UPDATE SELANJUTNYA' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/ArsAiEngineer.kt"

          grep -Fq 'FEATURE_AI_GATEWAY_SIGNED_REQUESTS = true' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/ArsV850Config.kt"

          grep -Fq 'UJI KONEKSI AI' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/ArsAiEngineer.kt"

          grep -Fq 'X-ARS-Signature' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/ArsAiEngineerClient.kt"

          grep -Fq 'android.permission.INTERNET' \
            "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          grep -Fq 'android:usesCleartextTraffic="false"' \
            "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          (
            cd "$PROJECT_DIR/ars-ai-gateway"
            node --check server.mjs
            node --check security.mjs
            node --check runtime-bundled.mjs
            node --test
          )

          # Cloud Identity remains non-authoritative;
          # self-learning is bounded/operator-confirmed;
          # AI code changes stay release-gated.
          grep -Fq 'SELF_LEARNING_MODE = "ACTIVE_CONFIRMED_ONLY"' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/ArsV850Config.kt" || {
              echo "::error::V8.8.0 confirmed-learning mode is not active as expected."
              exit 1
            }

          python3 "$PROJECT_DIR/tools/validate_source.py" --root "$PROJECT_DIR"

          (
            cd "$PROJECT_DIR"
            sha256sum -c SOURCE_FILES_SHA256.txt > "$RUNNER_TEMP/ars-source-checks.txt"
          )

          python3 -m unittest discover \
            -s "$PROJECT_DIR/tools" \
            -p 'test_*.py'

          if grep -RInE 'javax\.imageio|ImageIO' \
            "$PROJECT_DIR/app/src/test" \
            --include='*.kt'; then
            echo "::error::Java SE ImageIO tidak boleh berada di Android app/src/test."
            exit 1
          fi

          echo "V8.8.0 Identity Intelligence source integrity and safety-boundary validation: PASS" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Do not use android-actions/setup-android here.
      # The previous CI failure was caused by that action requesting obsolete
      # package `tools`. GitHub's Ubuntu runner already carries Android command
      # line tools, so resolve sdkmanager directly and install exact SDK packages.
      - name: Resolve Android SDK manager
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK root tidak tersedia pada GitHub runner."
            exit 1
          fi

          SDKMANAGER_BIN="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER_BIN" ]; then
            SDKMANAGER_BIN="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -111 2>/dev/null | sort -V | tail -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER_BIN" ] || [ ! -x "$SDKMANAGER_BIN" ]; then
            echo "::error::sdkmanager tidak ditemukan pada Android SDK runner."
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER_BIN=$SDKMANAGER_BIN" >> "$GITHUB_ENV"

          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "sdkmanager=$SDKMANAGER_BIN"
            "$SDKMANAGER_BIN" --version
          } > "$RUNNER_TEMP/ars-sdk-info.txt"

      - name: Install exact Android SDK 35 packages
        shell: bash
        run: |
          set -euo pipefail

          yes | "$SDKMANAGER_BIN" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses >/dev/null || true

          "$SDKMANAGER_BIN" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -f "$ANDROID_SDK_ROOT/platforms/android-35/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Verify build toolchain
        shell: bash
        run: |
          set -euo pipefail

          java -version
          gradle --version
          "$SDKMANAGER_BIN" --version

          cd "$PROJECT_DIR"
          gradle projects --no-daemon

      - name: Prepare and verify existing official signer
        shell: bash
        env:
          ARS_RELEASE_KEYSTORE_BASE64: ${{ secrets.ARS_RELEASE_KEYSTORE_BASE64 }}
          ARS_RELEASE_STORE_PASSWORD: ${{ secrets.ARS_RELEASE_STORE_PASSWORD }}
          ARS_RELEASE_KEY_ALIAS: ${{ secrets.ARS_RELEASE_KEY_ALIAS }}
          ARS_RELEASE_KEY_PASSWORD: ${{ secrets.ARS_RELEASE_KEY_PASSWORD }}
          ARS_RELEASE_CERT_SHA256: ${{ secrets.ARS_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail

          : "${ARS_RELEASE_KEYSTORE_BASE64:?Missing official keystore secret}"
          : "${ARS_RELEASE_STORE_PASSWORD:?Missing store password secret}"
          : "${ARS_RELEASE_KEY_ALIAS:?Missing alias secret}"
          : "${ARS_RELEASE_KEY_PASSWORD:?Missing key password secret}"
          : "${ARS_RELEASE_CERT_SHA256:?Missing certificate secret}"

          EXPECTED=$(
            printf '%s' "$ARS_RELEASE_CERT_SHA256" \
              | tr -d ':[:space:]' \
              | tr '[:lower:]' '[:upper:]'
          )

          OFFICIAL="AA2A8C6C885BA887577A2C2813AEA2F72E5FB51892FC486108B57F8389D56AEB"

          test "$EXPECTED" = "$OFFICIAL" || {
            echo "::error::ARS_RELEASE_CERT_SHA256 bukan fingerprint resmi ARS POS."
            exit 1
          }

          KEYSTORE="$RUNNER_TEMP/ars-v880-200.jks"

          umask 077

          printf '%s' "$ARS_RELEASE_KEYSTORE_BASE64" \
            | base64 --decode > "$KEYSTORE"

          test -s "$KEYSTORE"

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass:env ARS_RELEASE_STORE_PASSWORD \
            -alias "$ARS_RELEASE_KEY_ALIAS" >/dev/null

          KEYSTORE_ACTUAL=$(
            keytool -exportcert -rfc \
              -keystore "$KEYSTORE" \
              -storepass:env ARS_RELEASE_STORE_PASSWORD \
              -alias "$ARS_RELEASE_KEY_ALIAS" \
            | openssl x509 -outform DER \
            | sha256sum \
            | awk '{print toupper($1)}'
          )

          if [ "$KEYSTORE_ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Keystore signer mismatch. Expected $EXPECTED, actual $KEYSTORE_ACTUAL"
            exit 1
          fi

          echo "ARS_RELEASE_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

          echo "Official signer pre-build verification: PASS" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Run physical truth JVM evidence replay
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle \
            :physicaltruth-jvm:test \
            --no-daemon \
            --stacktrace

          echo "Physical Truth JVM evidence replay: PASS" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Run Android unit tests and build signed APK
        shell: bash
        env:
          ARS_RELEASE_STORE_PASSWORD: ${{ secrets.ARS_RELEASE_STORE_PASSWORD }}
          ARS_RELEASE_KEY_ALIAS: ${{ secrets.ARS_RELEASE_KEY_ALIAS }}
          ARS_RELEASE_KEY_PASSWORD: ${{ secrets.ARS_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle \
            :app:testDebugUnitTest \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify APK package, version, signature and alignment
        shell: bash
        env:
          ARS_RELEASE_CERT_SHA256: ${{ secrets.ARS_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"

          SDK_BIN="$ANDROID_SDK_ROOT/build-tools/35.0.0"

          "$SDK_BIN/aapt" dump badging "$APK" > apk-badging.txt

          grep -Fq \
            "name='com.arspos.anglerriausyndicate'" \
            apk-badging.txt

          grep -Fq \
            "versionCode='200'" \
            apk-badging.txt

          grep -Fq \
            "versionName='1.10.0'" \
            apk-badging.txt

          test 200 -gt 190

          "$SDK_BIN/apksigner" \
            verify \
            --verbose \
            --print-certs \
            "$APK" > signer-info.txt

          "$SDK_BIN/zipalign" \
            -c \
            -P 16 \
            -v 4 \
            "$APK"

          ACTUAL=$(
            awk -F': ' \
              '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}' \
              signer-info.txt \
            | tr -d ':[:space:]' \
            | tr '[:lower:]' '[:upper:]'
          )

          EXPECTED=$(
            printf '%s' "$ARS_RELEASE_CERT_SHA256" \
              | tr -d ':[:space:]' \
              | tr '[:lower:]' '[:upper:]'
          )

          OFFICIAL="AA2A8C6C885BA887577A2C2813AEA2F72E5FB51892FC486108B57F8389D56AEB"

          test -n "$ACTUAL" || {
            echo "::error::Fingerprint signer APK tidak ditemukan pada output apksigner."
            exit 1
          }

          test "$ACTUAL" = "$EXPECTED"
          test "$ACTUAL" = "$OFFICIAL"

          mkdir -p "$GITHUB_WORKSPACE/release-output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/release-output/ARS-POS-1.10.0-V8.8.0-IDENTITY-INTELLIGENCE-R1-20260924-SIGNED.apk"

          cp signer-info.txt \
            "$GITHUB_WORKSPACE/release-output/SIGNING_FINGERPRINT.txt"

          cp apk-badging.txt \
            "$GITHUB_WORKSPACE/release-output/APK_METADATA.txt"

          cp "$RUNNER_TEMP/ars-source-checks.txt" \
            "$GITHUB_WORKSPACE/release-output/SOURCE_CHECKS.txt"

          cp "$RUNNER_TEMP/ars-sdk-info.txt" \
            "$GITHUB_WORKSPACE/release-output/SDK_INFO.txt"

          cp validation/validation-status.json \
            "$GITHUB_WORKSPACE/release-output/SOURCE_VALIDATION_STATUS.json"

          cd "$GITHUB_WORKSPACE/release-output"

          sha256sum \
            ARS-POS-1.10.0-V8.8.0-IDENTITY-INTELLIGENCE-R1-20260924-SIGNED.apk \
            > APK_SHA256.txt

          echo "Build 1.10.0 (200), Phase 4.3.5.0, V8.8.0 Identity Intelligence + Ambiguous-Visual OCR + Regulatory Text Filtering + Weak-OCR Verified Visual Fallback; AI Engineer is ENGINEERING_PROPOSAL_GATED; Cloud Identity remains SHADOW; Self Learning is ACTIVE_CONFIRMED_ONLY; physical/quantity safety retained." \
            >> "$GITHUB_STEP_SUMMARY"

          echo "Install in-place; do not uninstall." \
            >> "$GITHUB_STEP_SUMMARY"

          echo "JVM evidence replay + Android tests + release build + package/version/signer/alignment: PASS." \
            >> "$GITHUB_STEP_SUMMARY"

          echo "V8.8.0 device tests required: in-place 190->200 package/signer verification; AJARKAN KE ARS teaching; verified no-code/text/barcode visual-only recognition; 2-5 object prices/total + atomic quantity; one-to-one persistent binding on crossing rods; false-NORMAL/package-edge/duplicate regressions; memory/native pressure; gateway 2.1.1 online analysis/typed timeout." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified official APK
        uses: actions/upload-artifact@v7
        with:
          name: ARS-POS-V8.8.0-IDENTITY-INTELLIGENCE-200-R1-20260924-OFFICIAL
          path: release-output/
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: always() && env.PROJECT_DIR != ''
        uses: actions/upload-artifact@v7
        with:
          name: ARS-POS-V8.8.0-200-R1-20260924-TEST-REPORTS
          path: |
            ${{ env.PROJECT_DIR }}/physicaltruth-jvm/build/reports/tests/
            ${{ env.PROJECT_DIR }}/physicaltruth-jvm/build/test-results/
            ${{ env.PROJECT_DIR }}/app/build/reports/tests/
            ${{ env.PROJECT_DIR }}/app/build/test-results/
            ${{ env.PROJECT_DIR }}/validation/
          if-no-files-found: warn
          retention-days: 30

      - name: Remove runner copy of signing key
        if: always()
        shell: bash
        run: |
          KEYSTORE="$RUNNER_TEMP/ars-v880-200.jks"

          if [ -f "$KEYSTORE" ]; then
            if command -v shred >/dev/null 2>&1; then
              shred -u "$KEYSTORE" || rm -f -- "$KEYSTORE"
            else
              rm -f -- "$KEYSTORE"
            fi
          fi
