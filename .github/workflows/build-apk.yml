name: ARS POS Official Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build ARS POS Phase 4.3.2.30 V8.4.10 FIX1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -f "$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -f "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -f "$ANDROID_HOME/build-tools/35.0.0/zipalign"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Locate V8.4.10 FIX1 source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=./ARS_POS_PHASE4_3_2_30_V8_4_10_ANCHOR_PRESERVING_ROD_IDENTITY_FIX1.zip

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Source ZIP tidak ditemukan: $ZIP_FILE"
            echo "ZIP yang tersedia di repository:"
            find . -maxdepth 3 -type f -iname '*.zip' -print || true
            exit 1
          fi

          unzip -t "$ZIP_FILE" >/dev/null
          unzip -Z1 "$ZIP_FILE" > "$RUNNER_TEMP/ars-pos-zip-list.txt"

          grep -Fq 'app/src/main/java/com/arspos/anglerriausyndicate/ScanProposal.kt' "$RUNNER_TEMP/ars-pos-zip-list.txt"
          grep -Fq 'app/src/main/java/com/arspos/anglerriausyndicate/LongObjectAnalyzer.kt' "$RUNNER_TEMP/ars-pos-zip-list.txt"
          grep -Fq 'app/src/main/java/com/arspos/anglerriausyndicate/data/SmartRecognitionEngine.kt' "$RUNNER_TEMP/ars-pos-zip-list.txt"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Source ZIP OK: $ZIP_FILE"

      - name: Extract ARS POS project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted
          unzip -q -o "$ZIP_FILE" -d extracted

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=$(find extracted -type f -name 'settings.gradle.kts' -print -quit)

          if [ -z "${SETTINGS:-}" ]; then
            echo "ERROR: settings.gradle.kts tidak ditemukan."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Gradle project: $PROJECT_DIR"

      - name: Validate V8.4.10 FIX1 source
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          PKG=app/src/main/java/com/arspos/anglerriausyndicate

          REQUIRED=(
            settings.gradle.kts
            build.gradle.kts
            gradle.properties
            app/build.gradle.kts
            app/src/main/AndroidManifest.xml
            "$PKG/MainActivity.kt"
            "$PKG/ArsFlightRecorder.kt"
            "$PKG/ArsUpdateChannel.kt"
            "$PKG/SmartVisualScanner.kt"
            "$PKG/LongObjectAnalyzer.kt"
            "$PKG/ScanProposal.kt"
            "$PKG/data/ProductionRepository.kt"
            "$PKG/data/SmartRecognitionEngine.kt"
            "$PKG/data/RecognitionCandidate.kt"
          )

          for FILE in "${REQUIRED[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "ERROR: Required file missing: $FILE"
              exit 1
            fi
          done

          grep -Fq 'applicationId = "com.arspos.anglerriausyndicate"' app/build.gradle.kts
          grep -Fq 'versionCode = 145' app/build.gradle.kts
          grep -Fq 'versionName = "1.4.5"' app/build.gradle.kts
          grep -Fq 'create("arsOfficialRelease")' app/build.gradle.kts
          grep -Fq 'releaseSigningAvailable' app/build.gradle.kts

          if grep -Fq 'signingConfig = signingConfigs.getByName("debug")' app/build.gradle.kts; then
            echo "ERROR: Release APK masih menggunakan debug signing."
            exit 1
          fi

          grep -Fq 'Phase 4.3.2.30 V8.4.10' "$PKG/MainActivity.kt"
          grep -Fq 'Phase: 4.3.2.30' "$PKG/ArsFlightRecorder.kt"
          grep -Fq 'APP_UPDATE' "$PKG/ArsUpdateChannel.kt"
          grep -Fq 'IN_PLACE_UPDATE' "$PKG/ArsUpdateChannel.kt"
          grep -Fq 'signingSha256' "$PKG/ArsUpdateChannel.kt"
          grep -Fq 'applyCrossLaneSceneGate' "$PKG/SmartVisualScanner.kt"
          grep -Fq 'rodAnchorScore' "$PKG/data/SmartRecognitionEngine.kt"
          grep -Fq 'ROD_ANCHOR_VISUAL_VERIFIED' "$PKG/data/SmartRecognitionEngine.kt"

          echo "V8.4.10 FIX1 source validation OK."

      - name: Validate Kotlin source balance
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path

          pairs = {'{': '}', '(': ')', '[': ']'}
          reverse = {v: k for k, v in pairs.items()}

          def check(path):
              text = path.read_text(encoding='utf-8')
              stack = []
              i = 0
              line = 1
              line_comment = False
              block_comment = False
              string = False
              char = False
              escaped = False

              while i < len(text):
                  c = text[i]

                  if c == '\n':
                      line += 1
                      line_comment = False
                      i += 1
                      continue

                  if line_comment:
                      i += 1
                      continue

                  if block_comment:
                      if c == '*' and i + 1 < len(text) and text[i + 1] == '/':
                          block_comment = False
                          i += 2
                      else:
                          i += 1
                      continue

                  if string:
                      if escaped:
                          escaped = False
                      elif c == '\\':
                          escaped = True
                      elif c == '"':
                          string = False
                      i += 1
                      continue

                  if char:
                      if escaped:
                          escaped = False
                      elif c == '\\':
                          escaped = True
                      elif c == "'":
                          char = False
                      i += 1
                      continue

                  if c == '/' and i + 1 < len(text) and text[i + 1] == '/':
                      line_comment = True
                      i += 2
                      continue

                  if c == '/' and i + 1 < len(text) and text[i + 1] == '*':
                      block_comment = True
                      i += 2
                      continue

                  if c == '"':
                      string = True
                      i += 1
                      continue

                  if c == "'":
                      char = True
                      i += 1
                      continue

                  if c in pairs:
                      stack.append((c, line))
                  elif c in reverse:
                      if not stack or stack[-1][0] != reverse[c]:
                          raise SystemExit(f"Mismatch in {path}:{line}")
                      stack.pop()

                  i += 1

              if string or char or block_comment or stack:
                  raise SystemExit(f"Unbalanced Kotlin: {path}")

          files = list(Path('app/src/main/java').rglob('*.kt'))

          for path in files:
              check(path)

          print(f"KOTLIN BALANCE OK: {len(files)} files")
          PY

      - name: Prepare ARS POS official release signing
        shell: bash
        env:
          ARS_RELEASE_KEYSTORE_BASE64: ${{ secrets.ARS_RELEASE_KEYSTORE_BASE64 }}
          ARS_RELEASE_STORE_PASSWORD: ${{ secrets.ARS_RELEASE_STORE_PASSWORD }}
          ARS_RELEASE_KEY_ALIAS: ${{ secrets.ARS_RELEASE_KEY_ALIAS }}
          ARS_RELEASE_KEY_PASSWORD: ${{ secrets.ARS_RELEASE_KEY_PASSWORD }}

        run: |
          set -euo pipefail

          test -n "$ARS_RELEASE_KEYSTORE_BASE64" || {
            echo "ERROR: ARS_RELEASE_KEYSTORE_BASE64 belum dibuat."
            exit 1
          }

          test -n "$ARS_RELEASE_STORE_PASSWORD" || {
            echo "ERROR: ARS_RELEASE_STORE_PASSWORD belum dibuat."
            exit 1
          }

          test -n "$ARS_RELEASE_KEY_ALIAS" || {
            echo "ERROR: ARS_RELEASE_KEY_ALIAS belum dibuat."
            exit 1
          }

          test -n "$ARS_RELEASE_KEY_PASSWORD" || {
            echo "ERROR: ARS_RELEASE_KEY_PASSWORD belum dibuat."
            exit 1
          }

          KEYSTORE=$RUNNER_TEMP/ars-pos-official-release.jks

          printf '%s' "$ARS_RELEASE_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$KEYSTORE"

          chmod 600 "$KEYSTORE"
          test -s "$KEYSTORE"

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass "$ARS_RELEASE_STORE_PASSWORD" \
            -alias "$ARS_RELEASE_KEY_ALIAS" \
            >/dev/null

          echo "ARS_RELEASE_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

          echo "Official release keystore validated."

      - name: Clean project
        shell: bash
        env:
          ARS_RELEASE_STORE_PASSWORD: ${{ secrets.ARS_RELEASE_STORE_PASSWORD }}
          ARS_RELEASE_KEY_ALIAS: ${{ secrets.ARS_RELEASE_KEY_ALIAS }}
          ARS_RELEASE_KEY_PASSWORD: ${{ secrets.ARS_RELEASE_KEY_PASSWORD }}

        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle clean \
            --no-daemon \
            --stacktrace

      - name: Build official release APK
        shell: bash
        env:
          ARS_RELEASE_STORE_PASSWORD: ${{ secrets.ARS_RELEASE_STORE_PASSWORD }}
          ARS_RELEASE_KEY_ALIAS: ${{ secrets.ARS_RELEASE_KEY_ALIAS }}
          ARS_RELEASE_KEY_PASSWORD: ${{ secrets.ARS_RELEASE_KEY_PASSWORD }}

        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Verify official APK identity and signature
        shell: bash
        env:
          ARS_RELEASE_CERT_SHA256: ${{ secrets.ARS_RELEASE_CERT_SHA256 }}

        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          APK=$(find \
            app/build/outputs/apk/release \
            -type f \
            -name '*.apk' \
            -print \
            -quit)

          if [ -z "${APK:-}" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          BADGING=$(
            "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging \
            "$APK"
          )

          if [[ "$BADGING" != *"name='com.arspos.anglerriausyndicate'"* ]]; then
            echo "ERROR: Package APK tidak sesuai."
            exit 1
          fi

          if [[ "$BADGING" != *"versionCode='145'"* ]]; then
            echo "ERROR: versionCode APK bukan 145."
            exit 1
          fi

          if [[ "$BADGING" != *"versionName='1.4.5'"* ]]; then
            echo "ERROR: versionName APK bukan 1.4.5."
            exit 1
          fi

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            --print-certs \
            "$APK" \
            | tee signer-info.txt

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -c \
            -P 16 \
            -v 4 \
            "$APK"

          CERT_SHA=$(
            awk -F': ' \
              '/Signer #1 certificate SHA-256 digest:/ {
                print $2
                exit
              }' \
              signer-info.txt
          )

          if [ -z "${CERT_SHA:-}" ]; then
            echo "ERROR: Signer SHA-256 tidak dapat dibaca."
            exit 1
          fi

          if [ -z "${ARS_RELEASE_CERT_SHA256:-}" ]; then
            echo "ERROR: ARS_RELEASE_CERT_SHA256 belum dibuat."
            exit 1
          fi

          CURRENT_CERT=$(
            printf '%s' "$CERT_SHA" \
              | tr -d ':' \
              | tr '[:lower:]' '[:upper:]'
          )

          EXPECTED_CERT=$(
            printf '%s' "$ARS_RELEASE_CERT_SHA256" \
              | tr -d ':' \
              | tr '[:lower:]' '[:upper:]'
          )

          if [ "$CURRENT_CERT" != "$EXPECTED_CERT" ]; then
            echo "ERROR: SIGNER BERUBAH. Build dihentikan."
            echo "Current signer: $CERT_SHA"
            exit 1
          fi

          printf \
            'ARS POS OFFICIAL RELEASE\nVersion: 1.4.5 (145)\nPhase: 4.3.2.30 / V8.4.10 FIX2\nPackage: com.arspos.anglerriausyndicate\nSigner SHA-256: %s\n' \
            "$CERT_SHA" \
            > SIGNING_FINGERPRINT.txt

          echo "SIGNER_SHA256=$CERT_SHA" >> "$GITHUB_ENV"

          {
            echo "### ARS POS Official Release"
            echo "- Version: 1.4.5 (145)"
            echo "- Phase: 4.3.2.30 / V8.4.10 FIX2"
            echo "- Package: com.arspos.anglerriausyndicate"
            echo "- Signer SHA-256: $CERT_SHA"
            echo "- Update target: install directly over V8.4.9 Official (do not uninstall)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package APK and SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          APK=$(find \
            app/build/outputs/apk/release \
            -type f \
            -name '*.apk' \
            -print \
            -quit)

          if [ -z "${APK:-}" ]; then
            echo "ERROR: Release APK tidak ditemukan."
            exit 1
          fi

          OUTPUT_DIR=app/build/outputs/apk/release
          OUTPUT_NAME=ARS-POS-1.4.5-V8.4.10-FIX2-SIGNED.apk
          OUT=$OUTPUT_DIR/$OUTPUT_NAME

          cp "$APK" "$OUT"

          sha256sum "$OUT" > "$OUT.sha256"

          if [ ! -f SIGNING_FINGERPRINT.txt ]; then
            echo "ERROR: SIGNING_FINGERPRINT.txt tidak ditemukan."
            exit 1
          fi

          cp \
            SIGNING_FINGERPRINT.txt \
            "$OUTPUT_DIR/SIGNING_FINGERPRINT.txt"

          test -s "$OUT"
          test -s "$OUT.sha256"
          test -s "$OUTPUT_DIR/SIGNING_FINGERPRINT.txt"

          echo "========================================"
          echo "APK PACKAGE SUCCESS"
          echo "========================================"
          echo "APK: $OUT"

          ls -lh \
            "$OUT" \
            "$OUT.sha256" \
            "$OUTPUT_DIR/SIGNING_FINGERPRINT.txt"

      - name: Upload official signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ARS-POS-1.4.5-PHASE4.3.2.30-V8.4.10-FIX2-OFFICIAL
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.4.5-V8.4.10-FIX2-SIGNED.apk
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.4.5-V8.4.10-FIX2-SIGNED.apk.sha256
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/SIGNING_FINGERPRINT.txt
          if-no-files-found: error
