name: ARS POS Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ARS POS Phase 4.1 Product Photo Database
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v7


      # ============================================================
      # 2. SETUP JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. SETUP ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # ============================================================
      # 4. INSTALL ANDROID SDK PACKAGES
      # ============================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

          test -f "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -f "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -f "$ANDROID_HOME/build-tools/35.0.0/aapt"


      # ============================================================
      # 5. SETUP GRADLE 8.9
      # ============================================================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'


      # ============================================================
      # 6. CHECK REPOSITORY
      # ============================================================
      - name: Check repository files
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ARS POS REPOSITORY"
          echo "=========================================="

          pwd

          echo ""
          echo "Repository contents:"
          ls -lah

          echo ""
          echo "ZIP FILES:"
          find . -type f -iname "*.zip" -print


      # ============================================================
      # 7. REQUIRE PHASE 4.1 PROJECT ZIP
      # ============================================================
      - name: Require Phase 4.1 project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="./ARS_POS_PHASE4_1_PRODUCT_PHOTO_DATABASE_COMPLETE.zip"

          echo "=========================================="
          echo "CHECK PHASE 4.1 ZIP"
          echo "=========================================="

          if [ ! -f "$ZIP_FILE" ]; then

            echo "ERROR:"
            echo "$ZIP_FILE tidak ditemukan."

            echo ""
            echo "Upload ZIP Phase 4.1 terbaru ke ROOT repository."

            echo ""
            echo "ZIP yang tersedia:"
            find . -type f -iname "*.zip" -print

            exit 1
          fi

          echo ""
          echo "ZIP ditemukan:"
          ls -lh "$ZIP_FILE"

          echo ""
          echo "Testing ZIP integrity..."

          unzip -t "$ZIP_FILE"

          echo ""
          echo "ZIP integrity OK."

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ============================================================
      # 8. EXTRACT ARS POS PROJECT
      # ============================================================
      - name: Extract ARS POS project
        shell: bash
        run: |
          set -e

          rm -rf extracted

          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo ""
          echo "Project extracted successfully."


      # ============================================================
      # 9. LOCATE GRADLE PROJECT
      # ============================================================
      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find extracted \
            -type f \
            -name "settings.gradle.kts" \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then

            echo "ERROR:"
            echo "settings.gradle.kts tidak ditemukan."

            echo ""
            echo "Isi extracted project:"

            find extracted \
              -maxdepth 8 \
              -type f \
              | sort

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Gradle project ditemukan:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 10. VALIDATE PROJECT STRUCTURE
      # ============================================================
      - name: Validate Phase 4.1 sources
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "VALIDATE PROJECT STRUCTURE"
          echo "=========================================="

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties

          test -f app/build.gradle.kts

          test -f app/src/main/AndroidManifest.xml

          test -f \
            app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt

          test -f \
            app/src/main/java/com/arspos/anglerriausyndicate/PosViewModel.kt

          test -f \
            app/src/main/java/com/arspos/anglerriausyndicate/Money.kt

          test -f \
            app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt

          test -f \
            app/src/main/java/com/arspos/anglerriausyndicate/printer/EscPosReceipt.kt

          echo ""
          echo "Project structure OK."


      # ============================================================
      # 11. VALIDATE PRODUCT PHOTO DATABASE
      # ============================================================
      - name: Validate Product Photo Database
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "PRODUCT PHOTO DATABASE"
          echo "=========================================="

          echo ""
          echo "Searching ProductPhoto implementation..."

          PRODUCT_PHOTO_FILES=$(find app/src/main/java \
            -type f \
            | grep -i "ProductPhoto" || true)

          if [ -z "$PRODUCT_PHOTO_FILES" ]; then
            echo "ERROR: ProductPhoto source tidak ditemukan."
            exit 1
          fi

          echo "$PRODUCT_PHOTO_FILES"

          echo ""
          echo "Searching photo relation fields..."

          grep -Rni \
            "productId" \
            app/src/main/java \
            | grep -i "photo" \
            | head -n 30 || true

          echo ""
          echo "Searching primary photo support..."

          grep -Rni \
            "isPrimary" \
            app/src/main/java \
            | head -n 30 || true

          echo ""
          echo "Searching local photo path..."

          grep -Rni \
            "localPath" \
            app/src/main/java \
            | head -n 30 || true

          echo ""
          echo "Product Photo Database validation completed."


      # ============================================================
      # 12. VALIDATE CAMERA FEATURE
      # ============================================================
      - name: Validate camera feature
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          MAIN="app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"
          MANIFEST="app/src/main/AndroidManifest.xml"

          echo "=========================================="
          echo "CAMERA FEATURE"
          echo "=========================================="

          echo ""
          echo "Camera-related implementation:"

          grep -Rni \
            "Camera" \
            app/src/main/java \
            | head -n 40 || true

          echo ""
          echo "Camera permission:"

          grep -ni \
            "android.permission.CAMERA" \
            "$MANIFEST" \
            || true

          echo ""
          echo "Photo capture / picker:"

          grep -Rni \
            "TakePicture\|GetContent\|PickVisualMedia\|ImageCapture" \
            app/src/main/java \
            | head -n 40 || true

          echo ""
          echo "Camera validation completed."


      # ============================================================
      # 13. VALIDATE PHOTO MANAGEMENT
      # ============================================================
      - name: Validate photo management
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "PHOTO MANAGEMENT"
          echo "=========================================="

          echo ""
          echo "Add photo:"
          grep -Rni \
            "Tambah Foto\|TAMBAH FOTO\|Ambil Foto\|AMBIL FOTO" \
            app/src/main/java \
            | head -n 30 || true

          echo ""
          echo "Delete photo:"
          grep -Rni \
            "Hapus Foto\|HAPUS FOTO\|deletePhoto\|removePhoto" \
            app/src/main/java \
            | head -n 30 || true

          echo ""
          echo "Primary photo:"
          grep -Rni \
            "Foto Utama\|FOTO UTAMA\|isPrimary" \
            app/src/main/java \
            | head -n 30 || true

          echo ""
          echo "Photo management validation completed."


      # ============================================================
      # 14. VALIDATE DATABASE MIGRATION
      # ============================================================
      - name: Validate Room database migration
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "ROOM DATABASE MIGRATION"
          echo "=========================================="

          echo ""
          echo "Database version:"

          grep -Rni \
            "version = " \
            app/src/main/java \
            | head -n 20 || true

          echo ""
          echo "Migration references:"

          grep -Rni \
            "Migration" \
            app/src/main/java \
            | head -n 40 || true

          echo ""
          echo "Room migration validation completed."


      # ============================================================
      # 15. VALIDATE RUPIAH FORMATTER
      # ============================================================
      - name: Validate Rupiah formatter
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          MONEY="app/src/main/java/com/arspos/anglerriausyndicate/Money.kt"
          MAIN="app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"

          echo "=========================================="
          echo "RUPIAH FORMATTER"
          echo "=========================================="

          test -f "$MONEY"

          echo ""
          echo "Money.kt:"
          grep -n "formatRupiah" "$MONEY"

          echo ""
          echo "MainActivity.kt:"
          grep -n "formatRupiah" "$MAIN"

          echo ""
          echo "Indonesian locale:"
          grep -n 'Locale("id", "ID")' "$MONEY"

          echo ""
          echo "Rupiah formatter validation OK."


      # ============================================================
      # 16. VALIDATE PAYMENT FEATURES
      # ============================================================
      - name: Validate existing payment features
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          MAIN="app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"

          echo "=========================================="
          echo "PAYMENT FEATURES"
          echo "=========================================="

          grep -n "processingPayment" "$MAIN"
          grep -n "UANG PAS" "$MAIN"

          grep -n 'Rp 50.000' "$MAIN"
          grep -n 'Rp 100.000' "$MAIN"
          grep -n 'Rp 200.000' "$MAIN"
          grep -n 'Rp 500.000' "$MAIN"

          grep -n "CASH" "$MAIN"
          grep -n "QRIS" "$MAIN"
          grep -n "TRANSFER" "$MAIN"
          grep -n "DEBIT" "$MAIN"

          grep -n "UANG KURANG" "$MAIN"
          grep -n "KEMBALIAN" "$MAIN"

          echo ""
          echo "Payment features remain intact."


      # ============================================================
      # 17. VALIDATE TRANSACTION SAFETY
      # ============================================================
      - name: Validate transaction safety
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          REPO="app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"

          echo "=========================================="
          echo "TRANSACTION SAFETY"
          echo "=========================================="

          grep -n "db.withTransaction" "$REPO"

          grep -n "yyyyMMdd-HHmmssSSS" "$REPO"

          grep -n "dao.changeStock" "$REPO"

          echo ""
          echo "Transaction safety validation OK."


      # ============================================================
      # 18. CHECK VERSION
      # ============================================================
      - name: Check ARS POS version
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "ARS POS VERSION"
          echo "=========================================="

          grep -n \
            "versionCode\|versionName" \
            app/build.gradle.kts


      # ============================================================
      # 19. VALIDATE VERSION 1.0.4
      # ============================================================
      - name: Validate version 1.0.4
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "VERSION 1.0.4 CHECK"
          echo "=========================================="

          grep -q \
            "versionCode 103" \
            app/build.gradle.kts

          grep -q \
            'versionName = "1.0.4"' \
            app/build.gradle.kts

          echo ""
          echo "Version 1.0.4 validation PASSED."


      # ============================================================
      # 20. VALIDATE ARS BRANDING
      # ============================================================
      - name: Validate ARS branding
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "ARS BRANDING"
          echo "=========================================="

          test -f \
            app/src/main/res/drawable/ars_background.png

          test -f \
            app/src/main/res/drawable/ars_logo_master.png

          echo ""
          echo "Manifest icon:"

          grep -n \
            "android:icon\|android:roundIcon" \
            app/src/main/AndroidManifest.xml

          echo ""
          echo "Launcher files:"

          find app/src/main/res \
            -type f \
            \( -iname "ic_launcher*" -o -iname "*launcher*" \) \
            -print

          echo ""
          echo "ARS branding validation OK."


      # ============================================================
      # 21. BUILD ENVIRONMENT
      # ============================================================
      - name: Show build environment
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "JAVA"
          echo "=========================================="

          java -version

          echo ""
          echo "=========================================="
          echo "GRADLE"
          echo "=========================================="

          gradle --version

          echo ""
          echo "=========================================="
          echo "ANDROID HOME"
          echo "=========================================="

          echo "$ANDROID_HOME"


      # ============================================================
      # 22. CLEAN PROJECT
      # ============================================================
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle clean \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 23. BUILD RELEASE APK
      # ============================================================
      - name: Build Release APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      # ============================================================
      # 24. LOCATE APK
      # ============================================================
      - name: Locate APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          APK_DIR="app/build/outputs/apk/release"

          APK=$(find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then

            echo "ERROR: APK tidak ditemukan."

            echo ""
            echo "Build outputs:"

            find app/build/outputs \
              -type f \
              | sort

            exit 1
          fi

          echo ""
          echo "APK ditemukan:"
          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"


      # ============================================================
      # 25. VERIFY APK SIGNATURE
      # ============================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "APK SIGNATURE"
          echo "=========================================="

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK_PATH"

          echo ""
          echo "Signature verification PASSED."


      # ============================================================
      # 26. VERIFY APK ALIGNMENT
      # ============================================================
      - name: Verify APK alignment
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "APK ALIGNMENT"
          echo "=========================================="

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -c \
            -P 16 \
            -v 4 \
            "$APK_PATH"

          echo ""
          echo "Alignment verification PASSED."


      # ============================================================
      # 27. VERIFY PACKAGE AND VERSION
     
