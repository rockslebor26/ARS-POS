name: ARS POS Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ARS POS Signed Release APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v7


      # ============================================================
      # 2. SETUP JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. SETUP ANDROID COMMAND LINE TOOLS
      #
      # Package SDK tidak dipasang di sini.
      # Kita install secara manual pada step berikutnya.
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''


      # ============================================================
      # 4. INSTALL ANDROID SDK PACKAGES
      # ============================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID SDK"
          echo "=========================================="

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "sdkmanager:"
          sdkmanager --version

          echo ""
          echo "Installing required packages..."

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "=========================================="
          echo "VERIFY SDK"
          echo "=========================================="

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -f "$ANDROID_HOME/platform-tools/adb"

          echo "Android SDK 35 OK."
          echo "Build Tools 35.0.0 OK."
          echo "Platform Tools OK."


      # ============================================================
      # 5. SETUP GRADLE 8.9
      # ============================================================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'


      # ============================================================
      # 6. CHECK REPOSITORY
      # ============================================================
      - name: Check repository files
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "REPOSITORY ROOT"
          echo "=========================================="

          pwd

          echo ""
          echo "Files:"
          ls -lah

          echo ""
          echo "ZIP FILES:"
          find . \
            -maxdepth 2 \
            -type f \
            -iname "*.zip" \
            -print


      # ============================================================
      # 7. FIND PHASE 1 BRANDING ZIP
      # ============================================================
      - name: Find Phase 1 ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . \
            -type f \
            -iname "*PHASE1*BRANDING*.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP PHASE1 BRANDING tidak ditemukan."
            echo ""
            echo "ZIP yang tersedia:"
            find . \
              -type f \
              -iname "*.zip" \
              -print
            exit 1
          fi

          echo "ZIP ditemukan:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ============================================================
      # 8. EXTRACT PHASE 1 PROJECT
      # ============================================================
      - name: Extract Phase 1 project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "EXTRACT PHASE 1"
          echo "=========================================="

          echo "ZIP:"
          echo "$ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo ""
          echo "Extract selesai."

          echo ""
          echo "Project files:"
          find extracted \
            -maxdepth 4 \
            -type f \
            | head -n 150


      # ============================================================
      # 9. LOCATE GRADLE PROJECT
      # ============================================================
      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "LOCATE GRADLE PROJECT"
          echo "=========================================="

          SETTINGS_FILE=$(find extracted \
            -type f \
            -name "settings.gradle.kts" \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts tidak ditemukan."

            echo ""
            echo "Isi extracted:"
            find extracted \
              -maxdepth 6 \
              -type f \
              | sort

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo ""
          echo "settings.gradle.kts:"
          echo "$SETTINGS_FILE"

          echo ""
          echo "PROJECT_DIR:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 10. VALIDATE GRADLE PROJECT
      # ============================================================
      - name: Validate Gradle project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "VALIDATE PROJECT"
          echo "=========================================="

          pwd

          echo ""
          echo "Project files:"
          ls -lah

          echo ""
          echo "Checking required files..."

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo ""
          echo "Gradle project structure OK."


      # ============================================================
      # 11. CHECK ARS BRANDING
      # ============================================================
      - name: Check ARS branding
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "ARS BRANDING CHECK"
          echo "=========================================="

          echo ""
          echo "Launcher icons:"
          find app/src/main/res \
            -type f \
            \( \
              -iname "*launcher*" \
              -o \
              -iname "ic_launcher*" \
            \) \
            -print || true

          echo ""
          echo "ARS background:"
          find app/src/main/res \
            -type f \
            -iname "*ars_background*" \
            -print || true

          echo ""
          echo "Android Manifest icon:"
          grep -n \
            "android:icon\|android:roundIcon" \
            app/src/main/AndroidManifest.xml || true


      # ============================================================
      # 12. CHECK JAVA / GRADLE / ANDROID
      # ============================================================
      - name: Check build environment
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "JAVA"
          echo "=========================================="

          java -version

          echo ""
          echo "=========================================="
          echo "GRADLE"
          echo "=========================================="

          gradle --version

          echo ""
          echo "=========================================="
          echo "ANDROID SDK"
          echo "=========================================="

          sdkmanager --list_installed | head -n 100


      # ============================================================
      # 13. CLEAN PROJECT
      # ============================================================
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle clean \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 14. BUILD RELEASE APK
      # ============================================================
      - name: Build Release APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "BUILD RELEASE APK"
          echo "=========================================="

          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      # ============================================================
      # 15. CHECK APK OUTPUT
      # ============================================================
      - name: Check APK output
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "APK OUTPUT"
          echo "=========================================="

          find app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print

          echo ""
          echo "APK SIZE:"

          ls -lh \
            app/build/outputs/apk/release/*.apk


      # ============================================================
      # 16. VERIFY APK SIGNATURE
      # ============================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          APK=$(find app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          echo "APK:"
          echo "$APK"

          echo ""
          echo "=========================================="
          echo "APK SIGNATURE"
          echo "=========================================="

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"


      # ============================================================
      # 17. VERIFY APK ALIGNMENT
      # ============================================================
      - name: Verify APK alignment
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          APK=$(find app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | head -n 1)

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -c \
            -P 16 \
            -v 4 \
            "$APK"


      # ============================================================
      # 18. PREPARE FINAL APK
      # ============================================================
      - name: Prepare final APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          APK=$(find app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          FINAL_APK="app/build/outputs/apk/release/ARS-POS-1.0.0-signed.apk"

          cp "$APK" "$FINAL_APK"

          echo ""
          echo "=========================================="
          echo "FINAL APK"
          echo "=========================================="

          ls -lh "$FINAL_APK"


      # ============================================================
      # 19. GENERATE SHA-256
      # ============================================================
      - name: Generate APK checksum
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR/app/build/outputs/apk/release"

          sha256sum \
            ARS-POS-1.0.0-signed.apk \
            > ARS-POS-1.0.0-signed.apk.sha256

          echo ""
          echo "=========================================="
          echo "SHA-256"
          echo "=========================================="

          cat ARS-POS-1.0.0-signed.apk.sha256


      # ============================================================
      # 20. UPLOAD SIGNED APK
      # ============================================================
      - name: Upload signed APK
        uses: actions/upload-artifact@v7
        with:
          name: ARS-POS-1.0.0-SIGNED
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.0.0-signed.apk
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.0.0-signed.apk.sha256
          if-no-files-found: error
          retention-days: 30
