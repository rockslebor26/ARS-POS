name: ARS POS Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ARS POS Phase 4.2.2 Fresh Scan Session
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v7


      # ============================================================
      # 2. SETUP JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. SETUP ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # ============================================================
      # 4. INSTALL ANDROID SDK PACKAGES
      # ============================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

          test -f "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -f "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -f "$ANDROID_HOME/build-tools/35.0.0/aapt"


      # ============================================================
      # 5. SETUP GRADLE 8.9
      # ============================================================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'


      # ============================================================
      # 6. CHECK REPOSITORY FILES
      # ============================================================
      - name: Check repository files
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ARS POS PHASE 4.2.2"
          echo "=========================================="

          pwd

          echo ""
          echo "Repository contents:"
          ls -lah

          echo ""
          echo "ZIP FILES:"
          find . -maxdepth 2 -type f -iname "*.zip" -print


      # ============================================================
      # 7. REQUIRE PHASE 4.2.2 PROJECT ZIP
      # ============================================================
      - name: Require Phase 4.2.2 project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="./ARS_POS_PHASE4_2_2_SCAN_SESSION_RESET_FIXED.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR:"
            echo "$ZIP_FILE tidak ditemukan di ROOT repository."

            echo ""
            echo "Upload ZIP Phase 4.2.2 terbaru ke ROOT repository."

            echo ""
            echo "ZIP yang tersedia:"
            find . -type f -iname "*.zip" -print

            exit 1
          fi

          echo ""
          echo "ZIP ditemukan:"
          ls -lh "$ZIP_FILE"

          echo ""
          echo "Testing ZIP integrity..."

          unzip -t "$ZIP_FILE"

          echo ""
          echo "ZIP integrity OK."

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ============================================================
      # 8. EXTRACT ARS POS PROJECT
      # ============================================================
      - name: Extract ARS POS project
        shell: bash
        run: |
          set -e

          rm -rf extracted

          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo ""
          echo "Project extracted successfully."


      # ============================================================
      # 9. LOCATE GRADLE PROJECT
      # ============================================================
      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find extracted \
            -type f \
            -name "settings.gradle.kts" \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts tidak ditemukan."

            echo ""
            echo "Isi extracted project:"

            find extracted \
              -maxdepth 8 \
              -type f \
              | sort

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Gradle project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 10. VALIDATE PHASE 4.2.2 SOURCES
      # ============================================================
      - name: Validate Phase 4.2.2 sources
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "VALIDATE PHASE 4.2.2 SOURCES"
          echo "=========================================="

          FILES=(
            "settings.gradle.kts"
            "build.gradle.kts"
            "gradle.properties"
            "app/build.gradle.kts"
            "app/src/main/AndroidManifest.xml"
            "app/src/main/res/xml/file_paths.xml"
            "app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/PosViewModel.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/Money.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/ProductVisualMatcher.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/VisualProductMatch.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/data/db/ArsDao.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/data/db/ArsDatabase.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/data/db/ProductPhotoEntity.kt"
          )

          for FILE in "${FILES[@]}"; do
            test -f "$FILE" || {
              echo "MISSING: $FILE"
              exit 1
            }

            echo "OK: $FILE"
          done

          echo ""
          echo "PHASE 4.2.2 SOURCE STRUCTURE OK"


      # ============================================================
      # 11. VALIDATE FRESH SCAN SESSION RESET
      # ============================================================
      - name: Validate Fresh Scan Session Reset
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          MAIN="app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"

          echo "=========================================="
          echo "FRESH SCAN SESSION RESET"
          echo "=========================================="

          echo ""
          echo "Checking scanner function:"
          grep -n "fun openVisualScanner" "$MAIN"

          echo ""
          echo "Checking visual match reset:"
          grep -n "visualMatches = emptyList()" "$MAIN"

          echo ""
          echo "Checking preview reset:"
          grep -n "scanPreview = null" "$MAIN"

          echo ""
          echo "Checking scanning state reset:"
          grep -n "scanningVisual = false" "$MAIN"

          echo ""
          echo "Checking SCAN ULANG:"
          grep -n "SCAN ULANG" "$MAIN"

          echo ""
          echo "Verifying reset happens before camera launch..."

          awk '/fun openVisualScanner\(\)/,/^    }/' "$MAIN" \
            | grep -q "visualMatches = emptyList()"

          awk '/fun openVisualScanner\(\)/,/^    }/' "$MAIN" \
            | grep -q "scanPreview = null"

          awk '/fun openVisualScanner\(\)/,/^    }/' "$MAIN" \
            | grep -q "takePictureLauncher.launch"

          echo ""
          echo "Fresh scan session validation OK."


      # ============================================================
      # 12. VALIDATE CAMERA STABILITY
      # ============================================================
      - name: Validate Camera Stability
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          MAIN="app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"
          MANIFEST="app/src/main/AndroidManifest.xml"
          PATHS="app/src/main/res/xml/file_paths.xml"

          grep -q "ActivityResultContracts.TakePicture()" "$MAIN"

          grep -q "Manifest.permission.CAMERA" "$MAIN"

          grep -q "android.permission.CAMERA" "$MANIFEST"

          grep -q "FileProvider" "$MAIN"

          grep -q "androidx.core.content.FileProvider" "$MANIFEST"

          grep -q "FILE_PROVIDER_PATHS" "$MANIFEST"

          grep -q "camera_capture" "$PATHS"

          grep -q "createCameraUri" "$MAIN"

          grep -q "decodeCameraBitmap" "$MAIN"

          grep -q "pendingScanCameraFile" "$MAIN"

          if grep -q "TakePicturePreview" "$MAIN"; then
            echo "ERROR: TakePicturePreview masih digunakan."
            exit 1
          fi

          echo ""
          echo "Camera stability validation OK."


      # ============================================================
      # 13. VALIDATE VISUAL SCANNER + POS
      # ============================================================
      - name: Validate Visual Scanner and POS
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          MAIN="app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"
          VM="app/src/main/java/com/arspos/anglerriausyndicate/PosViewModel.kt"
          REPO="app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"

          grep -q "SCAN FOTO PRODUK" "$MAIN"

          grep -q "findVisualMatches" "$VM"

          grep -q "visualMatches" "$MAIN"

          grep -q "TAMBAH" "$MAIN"

          grep -q "ProductVisualMatcher" "$REPO"

          echo ""
          echo "Visual scanner + POS validation OK."


      # ============================================================
      # 14. VALIDATE OFFLINE + PHOTO DATABASE
      # ============================================================
      - name: Validate Offline and Photo Database
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          DAO="app/src/main/java/com/arspos/anglerriausyndicate/data/db/ArsDao.kt"
          DB="app/src/main/java/com/arspos/anglerriausyndicate/data/db/ArsDatabase.kt"
          MAIN="app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"

          grep -q "product_photos" "$DAO"

          grep -q "MIGRATION_3_4" "$DB"

          grep -q "filesDir" "$MAIN"

          grep -q "Bitmap.CompressFormat.JPEG" "$MAIN"

          echo ""
          echo "Offline/photo database validation OK."


      # ============================================================
      # 15. VALIDATE EXISTING POS FEATURES
      # ============================================================
      - name: Validate Existing POS Features
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          MAIN="app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"
          REPO="app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"
          MONEY="app/src/main/java/com/arspos/anglerriausyndicate/Money.kt"

          grep -q "CASH" "$MAIN"
          grep -q "QRIS" "$MAIN"
          grep -q "TRANSFER" "$MAIN"
          grep -q "DEBIT" "$MAIN"

          grep -q "processingPayment" "$MAIN"

          grep -q "formatRupiah" "$MAIN"

          grep -q 'Locale("id", "ID")' "$MONEY"

          grep -q "db.withTransaction" "$REPO"

          grep -q "dao.changeStock" "$REPO"

          echo ""
          echo "Existing POS feature validation OK."


      # ============================================================
      # 16. CHECK VERSION 1.0.7
      # ============================================================
      - name: Check ARS POS version
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          grep -q "versionCode = 107" \
            app/build.gradle.kts

          grep -q 'versionName = "1.0.7"' \
            app/build.gradle.kts

          echo ""
          echo "Version 1.0.7 validation PASSED."


      # ============================================================
      # 17. VALIDATE ARS BRANDING
      # ============================================================
      - name: Validate ARS branding
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          test -f \
            app/src/main/res/drawable/ars_background.png

          test -f \
            app/src/main/res/drawable/ars_logo_master.png

          test -f \
            app/src/main/res/mipmap-mdpi/ic_launcher.png

          test -f \
            app/src/main/res/mipmap-hdpi/ic_launcher.png

          test -f \
            app/src/main/res/mipmap-xhdpi/ic_launcher.png

          test -f \
            app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          test -f \
            app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          grep -q \
            "android:icon" \
            app/src/main/AndroidManifest.xml

          grep -q \
            "android:roundIcon" \
            app/src/main/AndroidManifest.xml

          echo ""
          echo "ARS branding validation OK."


      # ============================================================
      # 18. SHOW BUILD ENVIRONMENT
      # ============================================================
      - name: Show build environment
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "JAVA"
          echo "=========================================="

          java -version

          echo ""
          echo "=========================================="
          echo "GRADLE"
          echo "=========================================="

          gradle --version

          echo ""
          echo "=========================================="
          echo "ANDROID HOME"
          echo "=========================================="

          echo "ANDROID_HOME=$ANDROID_HOME"


      # ============================================================
      # 19. CLEAN PROJECT
      # ============================================================
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle clean \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 20. BUILD RELEASE APK
      # ============================================================
      - name: Build Release APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      # ============================================================
      # 21. LOCATE APK
      # ============================================================
      - name: Locate APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          APK_DIR="app/build/outputs/apk/release"

          APK=$(find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."

            find app/build/outputs \
              -type f \
              | sort

            exit 1
          fi

          echo ""
          echo "APK ditemukan:"
          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"


      # ============================================================
      # 22. VERIFY APK SIGNATURE
      # ============================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK_PATH"

          echo ""
          echo "Signature verification PASSED."


      # ============================================================
      # 23. VERIFY APK ALIGNMENT
      # ============================================================
      - name: Verify APK alignment
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -c \
            -P 16 \
            -v 4 \
            "$APK_PATH"

          echo ""
          echo "Alignment verification PASSED."


      # ============================================================
      # 24. VERIFY APK PACKAGE + VERSION
      # ============================================================
      - name: Verify APK package and version
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          BADGING=$(
            "$ANDROID_HOME/build-tools/35.0.0/aapt" \
              dump badging \
              "$APK_PATH"
          )

          echo "$BADGING" \
            | grep -E \
            "package: name=|versionCode=|versionName="

          echo "$BADGING" \
            | grep -q \
            "name='com.arspos.anglerriausyndicate'"

          echo "$BADGING" \
            | grep -q \
            "versionCode='107'"

          echo "$BADGING" \
            | grep -q \
            "versionName='1.0.7'"

          echo ""
          echo "Package/version verification PASSED."


      # ============================================================
      # 25. PREPARE FINAL APK
      # ============================================================
      - name: Prepare final APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          APK_DIR="app/build/outputs/apk/release"

          FINAL_APK="$APK_DIR/ARS-POS-1.0.7-PHASE4.2.2-SCAN-SESSION-RESET-SIGNED.apk"

          cp "$APK_PATH" "$FINAL_APK"

          test -f "$FINAL_APK"

          echo ""
          echo "Generating SHA-256..."

          sha256sum "$FINAL_APK" \
            > "$FINAL_APK.sha256"

          echo ""
          echo "Final APK:"
          ls -lh "$FINAL_APK"

          echo ""
          echo "SHA-256:"
          cat "$FINAL_APK.sha256"


      # ============================================================
      # 26. FINAL RELEASE CHECK
      # ============================================================
      - name: Final release check
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR/app/build/outputs/apk/release"

          test -f \
            ARS-POS-1.0.7-PHASE4.2.2-SCAN-SESSION-RESET-SIGNED.apk

          test -f \
            ARS-POS-1.0.7-PHASE4.2.2-SCAN-SESSION-RESET-SIGNED.apk.sha256

          echo ""
          echo "=========================================="
          echo "ARS POS PHASE 4.2.2 READY"
          echo "=========================================="

          ls -lh \
            ARS-POS-1.0.7-PHASE4.2.2-SCAN-SESSION-RESET-SIGNED.apk

          echo ""

          cat \
            ARS-POS-1.0.7-PHASE4.2.2-SCAN-SESSION-RESET-SIGNED.apk.sha256


      # ============================================================
      # 27. UPLOAD SIGNED APK
      # ============================================================
      - name: Upload signed APK
        uses: actions/upload-artifact@v7
        with:
          name: ARS-POS-1.0.7-PHASE4.2.2-SCAN-SESSION-RESET-SIGNED

          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.0.7-PHASE4.2.2-SCAN-SESSION-RESET-SIGNED.apk
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.0.7-PHASE4.2.2-SCAN-SESSION-RESET-SIGNED.apk.sha256

          if-no-files-found: error

          retention-days: 30
