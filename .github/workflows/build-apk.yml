name: ARS POS Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ARS POS Phase 4.3 Smart Product Recognition
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # 4. INSTALL ANDROID SDK
      # ============================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

          test -f "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -f "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -f "$ANDROID_HOME/build-tools/35.0.0/aapt"


      # ============================================================
      # 5. GRADLE 8.9
      # ============================================================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      # ============================================================
      # 6. CHECK REPOSITORY
      # ============================================================
      - name: Check repository files
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ARS POS PHASE 4.3"
          echo "SMART PRODUCT RECOGNITION"
          echo "=========================================="

          pwd

          echo ""
          echo "Repository:"
          ls -lah

          echo ""
          echo "ZIP files:"
          find . -maxdepth 2 -type f -iname "*.zip" -print


      # ============================================================
      # 7. REQUIRE PHASE 4.3 ZIP
      # ============================================================
      - name: Require Phase 4.3 project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="./ARS_POS_PHASE4_3_SMART_PRODUCT_RECOGNITION_FIXED.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "=========================================="
            echo "ERROR"
            echo "=========================================="
            echo "ZIP Phase 4.3 tidak ditemukan."

            echo ""
            echo "Nama file yang dicari:"
            echo "$ZIP_FILE"

            echo ""
            echo "ZIP yang tersedia:"
            find . -type f -iname "*.zip" -print

            exit 1
          fi

          echo "ZIP Phase 4.3 ditemukan:"
          ls -lh "$ZIP_FILE"

          echo ""
          echo "Testing ZIP:"
          unzip -t "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ============================================================
      # 8. EXTRACT PROJECT
      # ============================================================
      - name: Extract ARS POS project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted


      # ============================================================
      # 9. LOCATE GRADLE PROJECT
      # ============================================================
      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find extracted \
            -type f \
            -name "settings.gradle.kts" \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts tidak ditemukan."

            find extracted \
              -maxdepth 8 \
              -type f \
              | sort

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Gradle project:"
          echo "$PROJECT_DIR"


      # ============================================================
      # 10. VALIDATE PROJECT STRUCTURE
      # ============================================================
      - name: Validate Phase 4.3 sources
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "VALIDATE PHASE 4.3 SOURCES"
          echo "=========================================="

          FILES=(
            "settings.gradle.kts"
            "build.gradle.kts"
            "gradle.properties"
            "app/build.gradle.kts"

            "app/src/main/AndroidManifest.xml"

            "app/src/main/res/xml/file_paths.xml"

            "app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/PosViewModel.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/Money.kt"

            "app/src/main/java/com/arspos/anglerriausyndicate/ProductVisualMatcher.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/VisualProductMatch.kt"

            "app/src/main/java/com/arspos/anglerriausyndicate/SmartVisualScanner.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/VisualScanObject.kt"

            "app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"

            "app/src/main/java/com/arspos/anglerriausyndicate/data/db/ArsDao.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/data/db/ArsDatabase.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/data/db/ProductPhotoEntity.kt"
          )

          for FILE in "${FILES[@]}"; do

            if [ ! -f "$FILE" ]; then
              echo "MISSING: $FILE"
              exit 1
            fi

            echo "OK: $FILE"

          done

          echo ""
          echo "PHASE 4.3 SOURCE STRUCTURE OK"


      # ============================================================
      # 11. FRESH SCAN SESSION
      # ============================================================
      - name: Validate Fresh Scan Session Reset
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          MAIN="app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"

          echo "=========================================="
          echo "FRESH SCAN SESSION RESET"
          echo "=========================================="

          grep -n "fun openVisualScanner" "$MAIN"
          grep -n "visualMatches = emptyList()" "$MAIN"
          grep -n "scanPreview = null" "$MAIN"
          grep -n "scanningVisual = false" "$MAIN"
          grep -n "SCAN ULANG" "$MAIN"

          echo ""
          echo "Checking reset before camera launch..."

          awk '/fun openVisualScanner\(\)/,/^    }/' "$MAIN" \
            | grep -q "visualMatches = emptyList()"

          awk '/fun openVisualScanner\(\)/,/^    }/' "$MAIN" \
            | grep -q "scanPreview = null"

          awk '/fun openVisualScanner\(\)/,/^    }/' "$MAIN" \
            | grep -q "takePictureLauncher.launch"

          echo ""
          echo "Fresh scan session validation OK."


      # ============================================================
      # 12. CAMERA STABILITY
      # ============================================================
      - name: Validate Camera Stability
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          MAIN="app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"
          MANIFEST="app/src/main/AndroidManifest.xml"
          PATHS="app/src/main/res/xml/file_paths.xml"

          grep -q "ActivityResultContracts.TakePicture()" "$MAIN"

          grep -q "Manifest.permission.CAMERA" "$MAIN"

          grep -q "android.permission.CAMERA" "$MANIFEST"

          grep -q "FileProvider" "$MAIN"

          grep -q "androidx.core.content.FileProvider" "$MANIFEST"

          grep -q "FILE_PROVIDER_PATHS" "$MANIFEST"

          grep -q "camera_capture" "$PATHS"

          grep -q "createCameraUri" "$MAIN"

          grep -q "decodeCameraBitmap" "$MAIN"

          grep -q "pendingScanCameraFile" "$MAIN"

          if grep -q "TakePicturePreview" "$MAIN"; then
            echo "ERROR: TakePicturePreview masih digunakan."
            exit 1
          fi

          echo ""
          echo "Camera stability validation OK."


      # ============================================================
      # 13. SMART VISUAL SCANNER
      # ============================================================
      - name: Validate Phase 4.3 Smart Visual Scanner and POS
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          MAIN="app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"
          VM="app/src/main/java/com/arspos/anglerriausyndicate/PosViewModel.kt"
          REPO="app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"

          grep -q "SCAN FOTO PRODUK" "$MAIN"

          grep -q "smartVisualScan" "$VM"

          grep -q "smartScanObjects" "$MAIN"

          grep -q "VisualScanObject" "$MAIN"

          grep -q "TAMBAH" "$MAIN"

          grep -q "ProductVisualMatcher" "$REPO"

          grep -q "SmartVisualScanner" "$REPO"

          echo ""
          echo "Visual scanner + POS validation OK."


      # ============================================================
      # 14. OBJECT DETECTION
      # ============================================================
      - name: Validate Phase 4.3 Object Detection
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          SCANNER="app/src/main/java/com/arspos/anglerriausyndicate/SmartVisualScanner.kt"

          OBJECT="app/src/main/java/com/arspos/anglerriausyndicate/VisualScanObject.kt"

          REPO="app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"

          GRADLE="app/build.gradle.kts"

          test -f "$SCANNER"

          test -f "$OBJECT"

          grep -q 'com.google.mlkit:object-detection:17.0.2' "$GRADLE"

          grep -q "enableMultipleObjects" "$SCANNER"

          grep -q "SINGLE_IMAGE_MODE" "$SCANNER"

          grep -q "MIN_SCORE = 82" "$SCANNER"

          grep -q "MIN_MARGIN = 8" "$SCANNER"

          grep -q "take(MAX_OBJECTS)" "$SCANNER"

          grep -q "if(objects.isEmpty()) return emptyList()" "$REPO"

          echo ""
          echo "Object detection validation OK."


      # ============================================================
      # 15. STRICT MATCHING
      # ============================================================
      - name: Validate Strict Product Matching
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          MATCHER="app/src/main/java/com/arspos/anglerriausyndicate/ProductVisualMatcher.kt"

          REPO="app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"

          echo "=========================================="
          echo "STRICT PRODUCT MATCHING"
          echo "=========================================="

          test -f "$MATCHER"

          grep -q "82" "$MATCHER" || true

          grep -q "visualProductMatches" "$REPO"

          grep -q "score" "$REPO"

          echo ""
          echo "Strict matching source validation OK."


      # ============================================================
      # 16. MULTI OBJECT
      # ============================================================
      - name: Validate Multi Object Recognition
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          SCANNER="app/src/main/java/com/arspos/anglerriausyndicate/SmartVisualScanner.kt"

          grep -q "MAX_OBJECTS" "$SCANNER"

          grep -q "enableMultipleObjects" "$SCANNER"

          grep -q "take(MAX_OBJECTS)" "$SCANNER"

          echo ""
          echo "Multi-object recognition validation OK."


      # ============================================================
      # 17. EXISTING POS FEATURES
      # ============================================================
      - name: Validate Existing POS Features
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          MAIN="app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"

          REPO="app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"

          MONEY="app/src/main/java/com/arspos/anglerriausyndicate/Money.kt"

          grep -q "CASH" "$MAIN"

          grep -q "QRIS" "$MAIN"

          grep -q "TRANSFER" "$MAIN"

          grep -q "DEBIT" "$MAIN"

          grep -q "processingPayment" "$MAIN"

          grep -q "formatRupiah" "$MAIN"

          grep -q 'Locale("id", "ID")' "$MONEY"

          grep -q "db.withTransaction" "$REPO"

          grep -q "dao.changeStock" "$REPO"

          echo ""
          echo "Existing POS feature validation OK."


      # ============================================================
      # 18. VERSION
      # ============================================================
      - name: Check ARS POS version
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          grep -q "versionCode = 108" app/build.gradle.kts

          grep -q 'versionName = "1.0.8"' app/build.gradle.kts

          echo ""
          echo "ARS POS version 1.0.8 validation PASSED."


      # ============================================================
      # 19. BRANDING
      # ============================================================
      - name: Validate ARS branding
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          test -f app/src/main/res/drawable/ars_background.png

          test -f app/src/main/res/drawable/ars_logo_master.png

          test -f app/src/main/res/mipmap-mdpi/ic_launcher.png

          test -f app/src/main/res/mipmap-hdpi/ic_launcher.png

          test -f app/src/main/res/mipmap-xhdpi/ic_launcher.png

          test -f app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          test -f app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          grep -q "android:icon" app/src/main/AndroidManifest.xml

          grep -q "android:roundIcon" app/src/main/AndroidManifest.xml

          echo ""
          echo "ARS branding validation OK."


      # ============================================================
      # 20. BUILD ENVIRONMENT
      # ============================================================
      - name: Show build environment
        shell: bash
        run: |
          set -e

          java -version

          gradle --version

          echo ""
          echo "ANDROID_HOME=$ANDROID_HOME"


      # ============================================================
      # 21. CLEAN
      # ============================================================
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle clean \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 22. BUILD RELEASE APK
      # ============================================================
      - name: Build Release APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      # ============================================================
      # 23. LOCATE APK
      # ============================================================
      - name: Locate APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          APK_DIR="app/build/outputs/apk/release"

          APK=$(find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then

            echo "ERROR: APK tidak ditemukan."

            find app/build/outputs \
              -type f \
              | sort

            exit 1

          fi

          echo ""
          echo "APK ditemukan:"
          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"


      # ============================================================
      # 24. VERIFY SIGNATURE
      # ============================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK_PATH"

          echo ""
          echo "APK signature verification PASSED."


      # ============================================================
      # 25. VERIFY ALIGNMENT
      # ============================================================
      - name: Verify APK alignment
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -c \
            -P 16 \
            -v 4 \
            "$APK_PATH"

          echo ""
          echo "APK alignment verification PASSED."


      # ============================================================
      # 26. VERIFY PACKAGE + VERSION
      # ============================================================
      - name: Verify APK package and version
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          BADGING=$(
            "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging \
            "$APK_PATH"
          )

          echo "$BADGING" \
            | grep -E "package: name=|versionCode=|versionName="

          echo "$BADGING" \
            | grep -q "name='com.arspos.anglerriausyndicate'"

          echo "$BADGING" \
            | grep -q "versionCode='108'"

          echo "$BADGING" \
            | grep -q "versionName='1.0.8'"

          echo ""
          echo "Package/version verification PASSED."


      # ============================================================
      # 27. PREPARE FINAL APK
      # ============================================================
      - name: Prepare final APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          APK_DIR="app/build/outputs/apk/release"

          FINAL_APK="$APK_DIR/ARS-POS-1.0.8-PHASE4.3-SMART-PRODUCT-RECOGNITION-SIGNED.apk"

          cp "$APK_PATH" "$FINAL_APK"

          test -f "$FINAL_APK"

          sha256sum "$FINAL_APK" \
            > "$FINAL_APK.sha256"

          echo ""
          echo "FINAL APK:"
          ls -lh "$FINAL_APK"

          echo ""
          echo "SHA-256:"
          cat "$FINAL_APK.sha256"


      # ============================================================
      # 28. FINAL RELEASE CHECK
      # ============================================================
      - name: Final release check
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR/app/build/outputs/apk/release"

          test -f \
            ARS-POS-1.0.8-PHASE4.3-SMART-PRODUCT-RECOGNITION-SIGNED.apk

          test -f \
            ARS-POS-1.0.8-PHASE4.3-SMART-PRODUCT-RECOGNITION-SIGNED.apk.sha256

          echo ""
          echo "=========================================="
          echo "ARS POS PHASE 4.3 READY"
          echo "=========================================="

          echo ""
          ls -lh \
            ARS-POS-1.0.8-PHASE4.3-SMART-PRODUCT-RECOGNITION-SIGNED.apk

          echo ""
          echo "SHA-256:"

          cat \
            ARS-POS-1.0.8-PHASE4.3-SMART-PRODUCT-RECOGNITION-SIGNED.apk.sha256


      # ============================================================
      # 29. UPLOAD APK ARTIFACT
      # ============================================================
      - name: Upload signed APK
        uses: actions/upload-artifact@v4

        with:
          name: ARS-POS-1.0.8-PHASE4.3-SMART-PRODUCT-RECOGNITION-SIGNED

          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.0.8-PHASE4.3-SMART-PRODUCT-RECOGNITION-SIGNED.apk

            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.0.8-PHASE4.3-SMART-PRODUCT-RECOGNITION-SIGNED.apk.sha256

          if-no-files-found: error

          retention-days: 30
