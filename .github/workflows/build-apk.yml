name: ARS POS Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ARS POS Signed Release APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v7


      # ============================================================
      # 2. SETUP JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. SETUP ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # ============================================================
      # 4. INSTALL ANDROID SDK
      # ============================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -f "$ANDROID_HOME/platform-tools/adb"


      # ============================================================
      # 5. SETUP GRADLE 8.9
      # ============================================================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'


      # ============================================================
      # 6. CHECK REPOSITORY
      # ============================================================
      - name: Check repository files
        shell: bash
        run: |
          set -e

          pwd

          echo "=========================================="
          echo "REPOSITORY FILES"
          echo "=========================================="

          ls -lah

          echo ""
          echo "ZIP FILES:"

          find . -type f -iname "*.zip" -print


      # ============================================================
      # 7. FIND LATEST ARS POS ZIP
      # ============================================================
      - name: Find latest ARS POS ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=""

          for candidate in \
            "./ARS_POS_PHASE2_CART_V1_COMPLETE.zip" \
            "./ARS_POS_PHASE1_UI_FIX_V2_COMPLETE.zip" \
            "./ARS_POS_PHASE1_LOGIN_FIX_v1_COMPLETE.zip" \
            "./ARS_POS_PHASE1_COMPLETE_FIXED.zip"; do

            if [ -f "$candidate" ]; then
              ZIP_FILE="$candidate"
              break
            fi

          done

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . \
              -type f \
              -iname "*PHASE1*BRANDING*.zip" \
              | head -n 1)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP project ARS POS tidak ditemukan."

            echo ""
            echo "ZIP yang tersedia:"

            find . \
              -type f \
              -iname "*.zip" \
              -print

            exit 1
          fi

          echo ""
          echo "ZIP YANG AKAN DIGUNAKAN:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ============================================================
      # 8. EXTRACT PROJECT
      # ============================================================
      - name: Extract ARS POS project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          echo "Extracting:"
          echo "$ZIP_FILE"

          unzip -o "$ZIP_FILE" -d extracted

          echo ""
          echo "=========================================="
          echo "EXTRACTED PROJECT"
          echo "=========================================="

          find extracted \
            -maxdepth 5 \
            -type f \
            | head -n 200


      # ============================================================
      # 9. LOCATE GRADLE PROJECT
      # ============================================================
      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find extracted \
            -type f \
            -name "settings.gradle.kts" \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then

            echo "ERROR: settings.gradle.kts tidak ditemukan."

            echo ""
            echo "Isi extracted:"

            find extracted \
              -maxdepth 7 \
              -type f \
              | sort

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo ""
          echo "GRADLE PROJECT:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 10. VALIDATE PROJECT + CART V1
      # ============================================================
      - name: Validate project and UI sources
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "VALIDATE ARS POS PROJECT"
          echo "=========================================="

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          test -f \
            app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt

          echo ""
          echo "MainActivity.kt lines:"

          wc -l \
            app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt

          echo ""
          echo "CART V1 MARKERS:"

          grep -n \
            "KERANJANG\|JUMLAH BARANG\|Icons.Default.Remove\|Icons.Default.Add\|Icons.Default.Delete\|TRANSAKSI TERBARU" \
            app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt \
            || true

          echo ""
          echo "Gradle project structure OK."


      # ============================================================
      # 11. CHECK ARS BRANDING
      # ============================================================
      - name: Check ARS branding
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "ARS BRANDING"
          echo "=========================================="

          echo ""
          echo "LAUNCHER ICON:"

          find app/src/main/res \
            -type f \
            \( \
              -iname "ic_launcher*" \
              -o \
              -iname "*launcher*" \
            \) \
            -print \
            || true

          echo ""
          echo "ARS BACKGROUND:"

          find app/src/main/res \
            -type f \
            -iname "*ars_background*" \
            -print \
            || true

          echo ""
          echo "ANDROID MANIFEST:"

          grep -n \
            "android:icon\|android:roundIcon" \
            app/src/main/AndroidManifest.xml \
            || true


      # ============================================================
      # 12. CLEAN PROJECT
      # ============================================================
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle clean \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 13. BUILD RELEASE APK
      # ============================================================
      - name: Build Release APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      # ============================================================
      # 14. CHECK APK OUTPUT
      # ============================================================
      - name: Check APK output
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "APK OUTPUT"
          echo "=========================================="

          find app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print

          echo ""
          echo "APK SIZE:"

          ls -lh \
            app/build/outputs/apk/release/*.apk


      # ============================================================
      # 15. VERIFY APK SIGNATURE
      # ============================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          APK=$(find \
            app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | head -n 1)

          test -n "$APK"

          echo ""
          echo "APK:"
          echo "$APK"

          echo ""
          echo "=========================================="
          echo "APK SIGNATURE"
          echo "=========================================="

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"


      # ============================================================
      # 16. VERIFY APK ALIGNMENT
      # ============================================================
      - name: Verify APK alignment
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          APK=$(find \
            app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | head -n 1)

          test -n "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -c \
            -P 16 \
            -v 4 \
            "$APK"


      # ============================================================
      # 17. PREPARE FINAL APK
      # ============================================================
      - name: Prepare final APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          APK=$(find \
            app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | head -n 1)

          test -n "$APK"

          cp "$APK" \
            app/build/outputs/apk/release/ARS-POS-1.0.0-signed.apk

          echo ""
          echo "=========================================="
          echo "FINAL APK"
          echo "=========================================="

          ls -lh \
            app/build/outputs/apk/release/ARS-POS-1.0.0-signed.apk


      # ============================================================
      # 18. GENERATE SHA-256
      # ============================================================
      - name: Generate APK checksum
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR/app/build/outputs/apk/release"

          sha256sum \
            ARS-POS-1.0.0-signed.apk \
            > ARS-POS-1.0.0-signed.apk.sha256

          echo ""
          echo "=========================================="
          echo "SHA-256"
          echo "=========================================="

          cat ARS-POS-1.0.0-signed.apk.sha256


      # ============================================================
      # 19. UPLOAD SIGNED APK
      # ============================================================
      - name: Upload signed APK
        uses: actions/upload-artifact@v7
        with:
          name: ARS-POS-1.0.0-SIGNED

          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.0.0-signed.apk
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.0.0-signed.apk.sha256

          if-no-files-found: error

          retention-days: 30
