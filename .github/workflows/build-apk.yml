name: ARS POS Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ARS POS Phase 4.2 Visual Product Scanner
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v7


      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # ============================================================
      # 4. INSTALL ANDROID SDK PACKAGES
      # ============================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

          test -f "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -f "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -f "$ANDROID_HOME/build-tools/35.0.0/aapt"


      # ============================================================
      # 5. GRADLE 8.9
      # ============================================================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'


      # ============================================================
      # 6. CHECK REPOSITORY
      # ============================================================
      - name: Check repository files
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ARS POS PHASE 4.2"
          echo "=========================================="

          pwd

          echo ""
          echo "Repository contents:"
          ls -lah

          echo ""
          echo "ZIP FILES:"
          find . -type f -iname "*.zip" -print


      # ============================================================
      # 7. REQUIRE FIXED V2 ZIP
      # ============================================================
      - name: Require Phase 4.2 FIXED V2 project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="./ARS_POS_PHASE4_2_VISUAL_SCANNER_FIXED_V2.zip"

          echo "=========================================="
          echo "CHECK PHASE 4.2 FIXED V2 ZIP"
          echo "=========================================="

          if [ ! -f "$ZIP_FILE" ]; then

            echo "ERROR:"
            echo "$ZIP_FILE tidak ditemukan."

            echo ""
            echo "Upload file ZIP berikut ke ROOT repository:"
            echo ""
            echo "ARS_POS_PHASE4_2_VISUAL_SCANNER_FIXED_V2.zip"

            echo ""
            echo "ZIP yang tersedia:"
            find . -type f -iname "*.zip" -print

            exit 1
          fi

          echo ""
          echo "ZIP ditemukan:"
          ls -lh "$ZIP_FILE"

          echo ""
          echo "Testing ZIP integrity..."

          unzip -t "$ZIP_FILE"

          echo ""
          echo "ZIP integrity OK."

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ============================================================
      # 8. EXTRACT PROJECT
      # ============================================================
      - name: Extract ARS POS project
        shell: bash
        run: |
          set -e

          rm -rf extracted

          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo ""
          echo "Project extracted successfully."


      # ============================================================
      # 9. LOCATE GRADLE PROJECT
      # ============================================================
      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find extracted \
            -type f \
            -name "settings.gradle.kts" \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then

            echo "ERROR:"
            echo "settings.gradle.kts tidak ditemukan."

            echo ""
            echo "Isi extracted project:"

            find extracted \
              -maxdepth 8 \
              -type f \
              | sort

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo ""
          echo "Gradle project ditemukan:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 10. VALIDATE PHASE 4.2 SOURCES
      # ============================================================
      - name: Validate Phase 4.2 sources
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "VALIDATE PHASE 4.2 SOURCES"
          echo "=========================================="

          FILES=(

            "settings.gradle.kts"

            "build.gradle.kts"

            "gradle.properties"

            "app/build.gradle.kts"

            "app/src/main/AndroidManifest.xml"

            "app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"

            "app/src/main/java/com/arspos/anglerriausyndicate/PosViewModel.kt"

            "app/src/main/java/com/arspos/anglerriausyndicate/Money.kt"

            "app/src/main/java/com/arspos/anglerriausyndicate/ProductVisualMatcher.kt"

            "app/src/main/java/com/arspos/anglerriausyndicate/VisualProductMatch.kt"

            "app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"

            "app/src/main/java/com/arspos/anglerriausyndicate/data/db/ArsDao.kt"

            "app/src/main/java/com/arspos/anglerriausyndicate/data/db/ArsDatabase.kt"

            "app/src/main/java/com/arspos/anglerriausyndicate/data/db/ProductPhotoEntity.kt"

          )

          FAILED=0

          for FILE in "${FILES[@]}"; do

            if [ -f "$FILE" ]; then
              echo "OK   $FILE"
            else
              echo "MISS $FILE"
              FAILED=1
            fi

          done

          if [ "$FAILED" -ne 0 ]; then

            echo ""
            echo "ERROR: Ada source Phase 4.2 yang hilang."

            echo ""
            echo "Daftar file Kotlin aktual:"

            find app/src/main/java \
              -type f \
              -name "*.kt" \
              | sort

            exit 1

          fi

          echo ""
          echo "PHASE 4.2 SOURCE STRUCTURE OK"

          echo "=========================================="


      # ============================================================
      # 11. VALIDATE VISUAL SCANNER
      # ============================================================
      - name: Validate Visual Scanner
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          MAIN="app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"
          VM="app/src/main/java/com/arspos/anglerriausyndicate/PosViewModel.kt"
          REPO="app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"
          DAO="app/src/main/java/com/arspos/anglerriausyndicate/data/db/ArsDao.kt"
          MATCHER="app/src/main/java/com/arspos/anglerriausyndicate/ProductVisualMatcher.kt"
          MATCH_MODEL="app/src/main/java/com/arspos/anglerriausyndicate/VisualProductMatch.kt"
          MANIFEST="app/src/main/AndroidManifest.xml"

          echo "=========================================="
          echo "VISUAL SCANNER"
          echo "=========================================="

          grep -n "SCAN FOTO PRODUK" "$MAIN"

          grep -n "SCAN ULANG" "$MAIN"

          grep -n "TakePicturePreview" "$MAIN"

          grep -n "RequestPermission" "$MAIN"

          grep -n "Manifest.permission.CAMERA" "$MAIN"

          grep -n "findVisualMatches" "$VM"

          grep -n "visualProductMatches" "$REPO"

          grep -n "allProductPhotos" "$DAO"

          grep -n "ProductVisualMatcher.score" "$REPO"

          grep -n "Kecocokan visual" "$MAIN"

          grep -n "TAMBAH" "$MAIN"

          grep -n "android.permission.CAMERA" "$MANIFEST"

          echo ""
          echo "Matcher implementation:"

          grep -n \
            "fingerprint\|structuralSimilarity\|histogramSimilarity\|hashSimilarity" \
            "$MATCHER"

          echo ""
          echo "Visual match model:"

          grep -n \
            "data class VisualProductMatch" \
            "$MATCH_MODEL"

          grep -n \
            "val product: ProductEntity" \
            "$MATCH_MODEL"

          grep -n \
            "val photo: ProductPhotoEntity" \
            "$MATCH_MODEL"

          grep -n \
            "val score: Int" \
            "$MATCH_MODEL"

          echo ""
          echo "Visual scanner validation OK."


      # ============================================================
      # 12. VALIDATE OFFLINE PHOTO DATABASE
      # ============================================================
      - name: Validate Offline and Photo Database
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          MAIN="app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"
          DAO="app/src/main/java/com/arspos/anglerriausyndicate/data/db/ArsDao.kt"
          DB="app/src/main/java/com/arspos/anglerriausyndicate/data/db/ArsDatabase.kt"

          echo "=========================================="
          echo "OFFLINE PHOTO DATABASE"
          echo "=========================================="

          grep -n "product_photos" "$DAO"

          grep -n "version=4" "$DB"

          grep -n "MIGRATION_3_4" "$DB"

          grep -n "filesDir" "$MAIN"

          grep -n "Bitmap.CompressFormat.JPEG" "$MAIN"

          echo ""
          echo "Offline/photo database validation OK."


      # ============================================================
      # 13. VALIDATE EXISTING POS FEATURES
      # ============================================================
      - name: Validate Existing POS Features
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          MAIN="app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"

          REPO="app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"

          MONEY="app/src/main/java/com/arspos/anglerriausyndicate/Money.kt"

          echo "=========================================="
          echo "EXISTING POS FEATURES"
          echo "=========================================="

          echo ""
          echo "Payment:"

          grep -n "processingPayment" "$MAIN"

          grep -n "UANG PAS" "$MAIN"

          grep -n 'Rp 50.000' "$MAIN"

          grep -n 'Rp 100.000' "$MAIN"

          grep -n 'Rp 200.000' "$MAIN"

          grep -n 'Rp 500.000' "$MAIN"

          grep -n "QRIS" "$MAIN"

          grep -n "TRANSFER" "$MAIN"

          grep -n "DEBIT" "$MAIN"

          grep -n "UANG KURANG" "$MAIN"

          grep -n "KEMBALIAN" "$MAIN"

          echo ""
          echo "Transaction safety:"

          grep -n "db.withTransaction" "$REPO"

          grep -n "yyyyMMdd-HHmmssSSS" "$REPO"

          grep -n "dao.changeStock" "$REPO"

          echo ""
          echo "Rupiah:"

          grep -n "formatRupiah" "$MONEY"

          grep -n "formatRupiah" "$MAIN"

          echo ""
          echo "Existing POS feature preservation OK."


      # ============================================================
      # 14. CHECK VERSION
      # ============================================================
      - name: Check ARS POS version
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "ARS POS VERSION"
          echo "=========================================="

          grep -n \
            "versionCode\|versionName" \
            app/build.gradle.kts

          grep -q \
            "versionCode = 105" \
            app/build.gradle.kts

          grep -q \
            'versionName = "1.0.5"' \
            app/build.gradle.kts

          echo ""
          echo "Version 1.0.5 validation OK."


      # ============================================================
      # 15. VALIDATE BRANDING
      # ============================================================
      - name: Validate ARS branding
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "ARS BRANDING"
          echo "=========================================="

          test -f \
            app/src/main/res/drawable/ars_background.png

          test -f \
            app/src/main/res/drawable/ars_logo_master.png

          echo ""
          echo "Manifest icon:"

          grep -n \
            "android:icon\|android:roundIcon" \
            app/src/main/AndroidManifest.xml

          echo ""
          echo "Launcher files:"

          find app/src/main/res \
            -type f \
            \( -iname "ic_launcher*" -o -iname "*launcher*" \) \
            -print

          echo ""
          echo "ARS branding validation OK."


      # ============================================================
      # 16. BUILD ENVIRONMENT
      # ============================================================
      - name: Show build environment
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "JAVA"
          echo "=========================================="

          java -version

          echo ""
          echo "=========================================="
          echo "GRADLE"
          echo "=========================================="

          gradle --version

          echo ""
          echo "=========================================="
          echo "ANDROID HOME"
          echo "=========================================="

          echo "$ANDROID_HOME"


      # ============================================================
      # 17. CLEAN PROJECT
      # ============================================================
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle clean \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 18. BUILD RELEASE APK
      # ============================================================
      - name: Build Release APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      # ============================================================
      # 19. LOCATE APK
      # ============================================================
      - name: Locate APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          APK_DIR="app/build/outputs/apk/release"

          APK=$(find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then

            echo "ERROR: APK tidak ditemukan."

            find app/build/outputs \
              -type f \
              | sort

            exit 1

          fi

          echo ""
          echo "APK ditemukan:"

          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"


      # ============================================================
      # 20. VERIFY APK SIGNATURE
      # ============================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "APK SIGNATURE"
          echo "=========================================="

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK_PATH"

          echo ""
          echo "Signature verification PASSED."


      # ============================================================
      # 21. VERIFY APK ALIGNMENT
      # ============================================================
      - name: Verify APK alignment
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "APK ALIGNMENT"
          echo "=========================================="

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -c \
            -P 16 \
            -v 4 \
            "$APK_PATH"

          echo ""
          echo "Alignment verification PASSED."


      # ============================================================
      # 22. VERIFY PACKAGE / VERSION
      # ============================================================
      - name: Verify APK package and version
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "APK PACKAGE / VERSION"
          echo "=========================================="

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging \
            "$APK_PATH" \
            | grep -E \
            "package: name=|versionCode=|versionName="

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging \
            "$APK_PATH" \
            | grep -q \
            "versionCode='105'"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging \
            "$APK_PATH" \
            | grep -q \
            "versionName='1.0.5'"

          echo ""
          echo "Package/version verification PASSED."


      # ============================================================
      # 23. PREPARE FINAL APK
      # ============================================================
      - name: Prepare final APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          APK_DIR="app/build/outputs/apk/release"

          FINAL_APK="$APK_DIR/ARS-POS-1.0.5-PHASE4.2-VISUAL-SCANNER-SIGNED.apk"

          cp "$APK_PATH" "$FINAL_APK"

          test -f "$FINAL_APK"

          echo ""
          echo "Generating SHA-256..."

          sha256sum "$FINAL_APK" \
            > "$FINAL_APK.sha256"

          echo ""
          echo "Final APK:"

          ls -lh "$FINAL_APK"

          echo ""
          echo "SHA-256:"

          cat "$FINAL_APK.sha256"


      # ============================================================
      # 24. FINAL RELEASE CHECK
      # ============================================================
      - name: Final release check
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR/app/build/outputs/apk/release"

          test -f \
            ARS-POS-1.0.5-PHASE4.2-VISUAL-SCANNER-SIGNED.apk

          test -f \
            ARS-POS-1.0.5-PHASE4.2-VISUAL-SCANNER-SIGNED.apk.sha256

          echo ""
          echo "=========================================="
          echo "ARS POS PHASE 4.2 READY"
          echo "=========================================="

          ls -lh \
            ARS-POS-1.0.5-PHASE4.2-VISUAL-SCANNER-SIGNED.apk

          echo ""

          cat \
            ARS-POS-1.0.5-PHASE4.2-VISUAL-SCANNER-SIGNED.apk.sha256


      # ============================================================
      # 25. UPLOAD SIGNED APK
      # ============================================================
      - name: Upload signed APK
        uses: actions/upload-artifact@v7
        with:
          name: ARS-POS-1.0.5-PHASE4.2-VISUAL-SCANNER-SIGNED

          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.0.5-PHASE4.2-VISUAL-SCANNER-SIGNED.apk

            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.0.5-PHASE4.2-VISUAL-SCANNER-SIGNED.apk.sha256

          if-no-files-found: error

          retention-days: 30
