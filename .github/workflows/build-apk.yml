name: ARS POS Official Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build ARS POS Phase 4.3.2.37 V8.4.17 Evidence Integrity + Physical Track Truth + Rescue Gate V2 + Cashier Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          test -f "$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -f "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -f "$ANDROID_HOME/build-tools/35.0.0/zipalign"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Locate V8.4.17 source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=./ARS_POS_PHASE4_3_2_37_V8_4_17_EVIDENCE_TRACK_RESCUE_CASHIER_REVIEW.zip
          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Source ZIP tidak ditemukan: $ZIP_FILE"
            echo "ZIP yang tersedia di repository:"
            find . -maxdepth 3 -type f -iname '*.zip' -print || true
            exit 1
          fi
          unzip -t "$ZIP_FILE" >/dev/null
          unzip -Z1 "$ZIP_FILE" > "$RUNNER_TEMP/ars-pos-zip-list.txt"
          grep -Fq 'app/src/main/java/com/arspos/anglerriausyndicate/ScanProposal.kt' "$RUNNER_TEMP/ars-pos-zip-list.txt"
          grep -Fq 'app/src/main/java/com/arspos/anglerriausyndicate/LongObjectAnalyzer.kt' "$RUNNER_TEMP/ars-pos-zip-list.txt"
          grep -Fq 'app/src/main/java/com/arspos/anglerriausyndicate/data/SmartRecognitionEngine.kt' "$RUNNER_TEMP/ars-pos-zip-list.txt"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Source ZIP OK: $ZIP_FILE"

      - name: Extract ARS POS project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extracted
          mkdir -p extracted
          unzip -q -o "$ZIP_FILE" -d extracted

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS=$(find extracted -type f -name 'settings.gradle.kts' -print -quit)
          if [ -z "${SETTINGS:-}" ]; then
            echo "ERROR: settings.gradle.kts tidak ditemukan."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Gradle project: $PROJECT_DIR"

      - name: Validate V8.4.17 source and safety invariants
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          PKG=app/src/main/java/com/arspos/anglerriausyndicate

          REQUIRED=(
            settings.gradle.kts
            build.gradle.kts
            gradle.properties
            app/build.gradle.kts
            app/src/main/AndroidManifest.xml
            "$PKG/MainActivity.kt"
            "$PKG/PosViewModel.kt"
            "$PKG/ScanCartCommit.kt"
            "$PKG/ScanReviewUi.kt"
            "$PKG/ArsDevCenter.kt"
            "$PKG/ArsFlightRecorder.kt"
            "$PKG/ArsVisualEvidenceRecorder.kt"
            "$PKG/ArsUpdateChannel.kt"
            "$PKG/SmartVisualScanner.kt"
            "$PKG/LongObjectAnalyzer.kt"
            "$PKG/ScanProposal.kt"
            "$PKG/CrossCategorySceneFirewall.kt"
            "$PKG/RodPhysicalTrackResolver.kt"
            "$PKG/RodAuthenticityEvaluator.kt"
            "$PKG/RodAnchorExtractor.kt"
            "$PKG/ProductVisualMatcher.kt"
            "$PKG/data/ProductionRepository.kt"
            "$PKG/data/SmartRecognitionEngine.kt"
            "$PKG/data/RecognitionCandidate.kt"
            PHASE4_3_2_37_V8_4_17_EVIDENCE_TRACK_RESCUE_CASHIER_REVIEW.md
          )

          for FILE in "${REQUIRED[@]}"; do
            test -f "$FILE" || {
              echo "ERROR: Required file missing: $FILE"
              exit 1
            }
          done

          grep -Fq 'applicationId = "com.arspos.anglerriausyndicate"' app/build.gradle.kts
          grep -Fq 'versionCode = 152' app/build.gradle.kts
          grep -Fq 'versionName = "1.5.2"' app/build.gradle.kts
          grep -Fq 'create("arsOfficialRelease")' app/build.gradle.kts
          grep -Fq 'releaseSigningAvailable' app/build.gradle.kts

          if grep -Fq 'signingConfig = signingConfigs.getByName("debug")' app/build.gradle.kts; then
            echo "ERROR: Release APK masih menggunakan debug signing."
            exit 1
          fi

          grep -Fq 'snapshotBitmap(scene, mutable = true)' "$PKG/ArsVisualEvidenceRecorder.kt"
          grep -Fq 'artifactType" to "PHYSICAL_TRACK_OVERLAY' "$PKG/ArsVisualEvidenceRecorder.kt"
          grep -Fq 'artifactType" to "FINAL_PROPOSAL_OVERLAY' "$PKG/ArsVisualEvidenceRecorder.kt"
          grep -Fq 'buildSessionDiagnosticPackage' "$PKG/ArsVisualEvidenceRecorder.kt"
          grep -Fq 'Evidence recorder errors' "$PKG/ArsFlightRecorder.kt"

          grep -Fq 'REJECTED-${index + 1}-' "$PKG/RodPhysicalTrackResolver.kt"
          grep -Fq 'crossingContinuity' "$PKG/RodAuthenticityEvaluator.kt"
          grep -Fq 'crossThroughIntersections' "$PKG/RodAuthenticityEvaluator.kt"
          grep -Fq 'trueBranchIntersections' "$PKG/RodAuthenticityEvaluator.kt"

          grep -Fq 'rescueBlockingTrustedRodTracks' "$PKG/data/ProductionRepository.kt"
          grep -Fq 'TRUSTED_ROD_TRACK_PRESENT' "$PKG/data/ProductionRepository.kt"
          grep -Fq 'quantityEligible = false' "$PKG/data/ProductionRepository.kt"

          grep -Fq 'InteractiveScanPreview' "$PKG/MainActivity.kt"
          grep -Fq 'TINJAU JUMLAH & TAMBAH' "$PKG/MainActivity.kt"
          grep -Fq 'DETAIL DIAGNOSTIK' "$PKG/MainActivity.kt"
          grep -Fq 'LAPORKAN HASIL SCAN BERGAMBAR' "$PKG/MainActivity.kt"
          grep -Fq 'commitScanQuantities' "$PKG/PosViewModel.kt"
          grep -Fq 'committedScanSessions.contains(session)' "$PKG/PosViewModel.kt"
          grep -Fq 'SCAN_CART_COMMIT_BLOCKED' "$PKG/PosViewModel.kt"
          grep -Fq 'shareCurrentScanEvidence' "$PKG/ArsDevCenter.kt"

          grep -Fq 'ACCEPT_VISUAL_ONLY = 80' "$PKG/data/SmartRecognitionEngine.kt"
          grep -Fq 'ACCEPT_LONG_VISUAL_ONLY = 72' "$PKG/data/SmartRecognitionEngine.kt"
          grep -Fq 'MIN_VISUAL_MARGIN = 15' "$PKG/data/SmartRecognitionEngine.kt"
          grep -Fq 'MIN_LONG_VISUAL_MARGIN = 14' "$PKG/data/SmartRecognitionEngine.kt"
          grep -Fq 'MIN_TEXT_GATE = 58' "$PKG/data/SmartRecognitionEngine.kt"
          grep -Fq 'MIN_LONG_ANCHOR_SCORE = 55' "$PKG/data/SmartRecognitionEngine.kt"
          grep -Fq 'MIN_LONG_ANCHOR_MARGIN = 8' "$PKG/data/SmartRecognitionEngine.kt"
          grep -Fq 'REJECT_CROSS_CATEGORY_VISUAL_ONLY' "$PKG/data/SmartRecognitionEngine.kt"

          grep -Fq 'RodPhysicalTrackResolver.resolve' "$PKG/SmartVisualScanner.kt"
          grep -Fq 'RodAuthenticityEvaluator.apply' "$PKG/SmartVisualScanner.kt"
          grep -Fq 'CrossCategorySceneFirewall.apply' "$PKG/SmartVisualScanner.kt"
          grep -Fq 'applyCrossLaneSceneGate' "$PKG/SmartVisualScanner.kt"
          grep -Fq 'recordDecision' "$PKG/data/ProductionRepository.kt"
          grep -Fq 'recordTrackOverlay' "$PKG/data/ProductionRepository.kt"
          grep -Fq 'APP_UPDATE' "$PKG/ArsUpdateChannel.kt"
          grep -Fq 'IN_PLACE_UPDATE' "$PKG/ArsUpdateChannel.kt"

          echo "V8.4.17 source and safety validation OK."

      - name: Validate Kotlin source balance
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path

          pairs = {'{': '}', '(': ')', '[': ']'}
          reverse = {v: k for k, v in pairs.items()}

          def check(path):
              text = path.read_text(encoding='utf-8')
              stack=[]
              i=0
              line=1
              line_comment=False
              block_comment=False
              string=False
              char=False
              escaped=False

              while i < len(text):
                  c=text[i]

                  if c=='\n':
                      line += 1
                      line_comment=False
                      i += 1
                      continue

                  if line_comment:
                      i += 1
                      continue

                  if block_comment:
                      if c=='*' and i+1 < len(text) and text[i+1]=='/':
                          block_comment=False
                          i += 2
                      else:
                          i += 1
                      continue

                  if string:
                      if escaped:
                          escaped=False
                      elif c=='\\':
                          escaped=True
                      elif c=='"':
                          string=False
                      i += 1
                      continue

                  if char:
                      if escaped:
                          escaped=False
                      elif c=='\\':
                          escaped=True
                      elif c=="'":
                          char=False
                      i += 1
                      continue

                  if c=='/' and i+1 < len(text) and text[i+1]=='/':
                      line_comment=True
                      i += 2
                      continue

                  if c=='/' and i+1 < len(text) and text[i+1]=='*':
                      block_comment=True
                      i += 2
                      continue

                  if c=='"':
                      string=True
                      i += 1
                      continue

                  if c=="'":
                      char=True
                      i += 1
                      continue

                  if c in pairs:
                      stack.append((c,line))
                  elif c in reverse:
                      if not stack or stack[-1][0] != reverse[c]:
                          raise SystemExit(f"Mismatch in {path}:{line}")
                      stack.pop()

                  i += 1

              if string or char or block_comment or stack:
                  raise SystemExit(f"Unbalanced Kotlin: {path}")

          files=list(Path('app/src/main/java').rglob('*.kt'))

          for path in files:
              check(path)

          print(f"KOTLIN BALANCE OK: {len(files)} files")
          PY

      - name: Prepare ARS POS official release signing
        shell: bash
        env:
          ARS_RELEASE_KEYSTORE_BASE64: ${{ secrets.ARS_RELEASE_KEYSTORE_BASE64 }}
          ARS_RELEASE_STORE_PASSWORD: ${{ secrets.ARS_RELEASE_STORE_PASSWORD }}
          ARS_RELEASE_KEY_ALIAS: ${{ secrets.ARS_RELEASE_KEY_ALIAS }}
          ARS_RELEASE_KEY_PASSWORD: ${{ secrets.ARS_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$ARS_RELEASE_KEYSTORE_BASE64" || {
            echo "ERROR: ARS_RELEASE_KEYSTORE_BASE64 belum dibuat."
            exit 1
          }

          test -n "$ARS_RELEASE_STORE_PASSWORD" || {
            echo "ERROR: ARS_RELEASE_STORE_PASSWORD belum dibuat."
            exit 1
          }

          test -n "$ARS_RELEASE_KEY_ALIAS" || {
            echo "ERROR: ARS_RELEASE_KEY_ALIAS belum dibuat."
            exit 1
          }

          test -n "$ARS_RELEASE_KEY_PASSWORD" || {
            echo "ERROR: ARS_RELEASE_KEY_PASSWORD belum dibuat."
            exit 1
          }

          KEYSTORE=$RUNNER_TEMP/ars-pos-official-release.jks

          printf '%s' "$ARS_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"

          chmod 600 "$KEYSTORE"
          test -s "$KEYSTORE"

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass "$ARS_RELEASE_STORE_PASSWORD" \
            -alias "$ARS_RELEASE_KEY_ALIAS" >/dev/null

          echo "ARS_RELEASE_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "Official release keystore validated."

      - name: Clean project
        shell: bash
        env:
          ARS_RELEASE_STORE_PASSWORD: ${{ secrets.ARS_RELEASE_STORE_PASSWORD }}
          ARS_RELEASE_KEY_ALIAS: ${{ secrets.ARS_RELEASE_KEY_ALIAS }}
          ARS_RELEASE_KEY_PASSWORD: ${{ secrets.ARS_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle clean --no-daemon --stacktrace

      - name: Build official release APK
        shell: bash
        env:
          ARS_RELEASE_STORE_PASSWORD: ${{ secrets.ARS_RELEASE_STORE_PASSWORD }}
          ARS_RELEASE_KEY_ALIAS: ${{ secrets.ARS_RELEASE_KEY_ALIAS }}
          ARS_RELEASE_KEY_PASSWORD: ${{ secrets.ARS_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle \
            :app:testDebugUnitTest \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Verify official APK identity and signature
        shell: bash
        env:
          ARS_RELEASE_CERT_SHA256: ${{ secrets.ARS_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          APK=$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)

          test -n "${APK:-}" || {
            echo "ERROR: APK tidak ditemukan."
            exit 1
          }

          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")

          [[ "$BADGING" == *"name='com.arspos.anglerriausyndicate'"* ]] || {
            echo "ERROR: Package APK berubah."
            exit 1
          }

          [[ "$BADGING" == *"versionCode='152'"* ]] || {
            echo "ERROR: versionCode APK bukan 152."
            exit 1
          }

          [[ "$BADGING" == *"versionName='1.5.2'"* ]] || {
            echo "ERROR: versionName APK bukan 1.5.2."
            exit 1
          }

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            --print-certs \
            "$APK" | tee signer-info.txt

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -c -P 16 -v 4 "$APK"

          CERT_SHA=$(awk -F': ' \
            '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}' \
            signer-info.txt)

          test -n "${CERT_SHA:-}" || {
            echo "ERROR: Signer SHA-256 tidak dapat dibaca."
            exit 1
          }

          test -n "${ARS_RELEASE_CERT_SHA256:-}" || {
            echo "ERROR: ARS_RELEASE_CERT_SHA256 belum dibuat."
            exit 1
          }

          CURRENT_CERT=$(printf '%s' "$CERT_SHA" \
            | tr -d ':' \
            | tr '[:lower:]' '[:upper:]')

          EXPECTED_CERT=$(printf '%s' "$ARS_RELEASE_CERT_SHA256" \
            | tr -d ':' \
            | tr '[:lower:]' '[:upper:]')

          if [ "$CURRENT_CERT" != "$EXPECTED_CERT" ]; then
            echo "ERROR: PRIORITAS TINGGI DISTRIBUSI — signer berubah dibanding secret resmi."
            echo "Current signer: $CERT_SHA"
            exit 1
          fi

          OFFICIAL_CERT="AA2A8C6C885BA887577A2C2813AEA2F72E5FB51892FC486108B57F8389D56AEB"

          if [ "$CURRENT_CERT" != "$OFFICIAL_CERT" ]; then
            echo "ERROR: PRIORITAS TINGGI DISTRIBUSI — signer bukan ARS POS Official Release."
            echo "Current signer: $CERT_SHA"
            exit 1
          fi

          printf 'ARS POS OFFICIAL RELEASE\nVersion: 1.5.2 (152)\nPhase: 4.3.2.37 / V8.4.17\nPackage: com.arspos.anglerriausyndicate\nSigner SHA-256: %s\n' \
            "$CERT_SHA" > SIGNING_FINGERPRINT.txt

          echo "SIGNER_SHA256=$CERT_SHA" >> "$GITHUB_ENV"

          {
            echo "### ARS POS Official Release"
            echo "- Version: 1.5.2 (152)"
            echo "- Phase: 4.3.2.37 / V8.4.17"
            echo "- Package: com.arspos.anglerriausyndicate"
            echo "- Signer SHA-256: $CERT_SHA"
            echo "- Update target: install directly over V8.4.16 / 1.5.1 (151) Official (do not uninstall)"
            echo "- Recognition thresholds: unchanged"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package APK and SHA256
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          APK=$(find app/build/outputs/apk/release -type f -name '*.apk' -print -quit)

          test -n "${APK:-}" || {
            echo "ERROR: Release APK tidak ditemukan."
            exit 1
          }

          OUTPUT_DIR=app/build/outputs/apk/release
          OUTPUT_NAME=ARS-POS-1.5.2-V8.4.17-SIGNED.apk
          OUT=$OUTPUT_DIR/$OUTPUT_NAME

          cp "$APK" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"

          test -s SIGNING_FINGERPRINT.txt || {
            echo "ERROR: SIGNING_FINGERPRINT.txt tidak ditemukan."
            exit 1
          }

          cp SIGNING_FINGERPRINT.txt \
            "$OUTPUT_DIR/SIGNING_FINGERPRINT.txt"

          test -s "$OUT"
          test -s "$OUT.sha256"
          test -s "$OUTPUT_DIR/SIGNING_FINGERPRINT.txt"

          echo "APK package ready: $OUT"

          ls -lh \
            "$OUT" \
            "$OUT.sha256" \
            "$OUTPUT_DIR/SIGNING_FINGERPRINT.txt"

      - name: Upload official signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ARS-POS-1.5.2-PHASE4.3.2.37-V8.4.17-OFFICIAL
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.5.2-V8.4.17-SIGNED.apk
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.5.2-V8.4.17-SIGNED.apk.sha256
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/SIGNING_FINGERPRINT.txt
          if-no-files-found: error
