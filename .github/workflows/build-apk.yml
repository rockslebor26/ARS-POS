name: ARS POS V8.8.4 R3 Pure ROI Geometry Host-JVM Contract Recovery 206

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ARS_POS_V8_8_4_STICKY_PHYSICAL_LOCK_BEST_EVIDENCE_IDENTITY_CONVERGENCE_206_BUILD_FIX3_20260925.zip
      - .github/workflows/build-apk.yml

permissions:
  contents: read

concurrency:
  group: ars-pos-v884-r3-pure-roi-206-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_ZIP: ARS_POS_V8_8_4_STICKY_PHYSICAL_LOCK_BEST_EVIDENCE_IDENTITY_CONVERGENCE_206_BUILD_FIX3_20260925.zip
      SOURCE_SHA256: ca4afba9117a11c8a3500e47dbff23119eb3cd072f8b8debcdda8c77f580609e
      EXPECTED_PACKAGE: com.arspos.anglerriausyndicate
      EXPECTED_VERSION_CODE: '206'
      EXPECTED_VERSION_NAME: '1.10.6'
      PREVIOUS_VERSION_CODE: '205'
      OFFICIAL_CERT_SHA256: AA2A8C6C885BA887577A2C2813AEA2F72E5FB51892FC486108B57F8389D56AEB

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Verify exact source package
        shell: bash
        run: |
          set -euo pipefail

          test -f "$SOURCE_ZIP" || {
            echo "::error::Upload $SOURCE_ZIP ke root repository."
            exit 1
          }

          printf '%s  %s\n' "$SOURCE_SHA256" "$SOURCE_ZIP" | sha256sum -c -
          unzip -t "$SOURCE_ZIP" >/dev/null

          PROJECT_DIR=$(mktemp -d "$RUNNER_TEMP/ars-v884-r3-206.XXXXXX")
          unzip -q "$SOURCE_ZIP" -d "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          for f in \
            settings.gradle.kts \
            build.gradle.kts \
            app/build.gradle.kts \
            tools/validate_source.py \
            SOURCE_FILES_SHA256.txt \
            PHASE4_3_5_4_V8_8_4_STICKY_PHYSICAL_LOCK_BEST_EVIDENCE_IDENTITY_CONVERGENCE.md \
            RELEASE_206.md \
            BUILD_FIX3.md; do
            test -f "$PROJECT_DIR/$f" || {
              echo "::error::File release wajib tidak ditemukan: $f"
              exit 1
            }
          done

          python3 "$PROJECT_DIR/tools/validate_source.py" --root "$PROJECT_DIR"

          (
            cd "$PROJECT_DIR"
            sha256sum -c SOURCE_FILES_SHA256.txt > "$RUNNER_TEMP/ars-source-checks.txt"
          )

          python3 -m unittest discover \
            -s "$PROJECT_DIR/tools" \
            -p 'test_*.py'

          (
            cd "$PROJECT_DIR/ars-ai-gateway"
            node --check server.mjs
            node --check security.mjs
            node --check runtime-bundled.mjs
            node --test
          )

          grep -Fq 'applicationId = "com.arspos.anglerriausyndicate"' "$PROJECT_DIR/app/build.gradle.kts"
          grep -Fq 'versionCode = 206' "$PROJECT_DIR/app/build.gradle.kts"
          grep -Fq 'versionName = "1.10.6"' "$PROJECT_DIR/app/build.gradle.kts"
          grep -Fq 'const val PHASE = "4.3.5.4"' "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/ArsV850Config.kt"
          grep -Fq 'const val ENGINE = "V8.8.4"' "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/ArsV850Config.kt"
          grep -Fq 'const val RELEASE_REVISION = "STICKY_PHYSICAL_LOCK_BEST_EVIDENCE_IDENTITY_CONVERGENCE"' "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/ArsV850Config.kt"
          grep -Fq 'AI_ENGINEER_MODE = "DEV_CENTER_DIAGNOSTIC_ONLY"' "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/ArsV850Config.kt"
          grep -Fq 'FEATURE_AI_IN_CRITICAL_SCAN_PATH = false' "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/ArsV850Config.kt"
          grep -Fq 'LiveIdentityScheduler.choose' "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/LiveSmartScanCamera.kt"
          grep -Fq 'liveHighResolutionIdentity' "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/LiveSmartScanCamera.kt"
          grep -Fq 'FEATURE_LIVE_FINAL_DECISION_CONVERGENCE = true' "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/ArsV850Config.kt"
          grep -Fq 'FEATURE_SINGLE_FLIGHT_OCR = true' "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/ArsV850Config.kt"
          grep -Fq 'FEATURE_STICKY_PHYSICAL_LOCK_UI = true' "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/ArsV850Config.kt"
          grep -Fq 'FEATURE_USEFUL_HIGH_RES_GAIN = true' "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/ArsV850Config.kt"
          grep -Fq 'FEATURE_DISCRIMINATIVE_MICRO_OCR = true' "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/ArsV850Config.kt"
          grep -Fq 'enabled = cameraReady && lockUiState.canLock' "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/LiveSmartScanCamera.kt"
          grep -Fq 'hasUsefulResolutionGain' "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"
          grep -Fq 'analyzeDiscriminativeNormalIdentity' "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"
          grep -Fq 'CatalogCandidatePolicy.selectProductIds' "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"
          grep -Fq 'UnifiedRecoveryCoordinator.selectFinalEvidencePath' "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"
          grep -Fq 'UnifiedDecisionKernel.decide' "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"

          ROI_POLICY="$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/LiveIdentityRoiPolicy.kt"
          if grep -Fq 'LiveIdentityStage' "$ROI_POLICY"; then
            echo "::error::Obsolete undefined LiveIdentityStage reference detected in LiveIdentityRoiPolicy.kt."
            exit 1
          fi

          grep -Fq 'LiveEvidenceEscalationPolicy.HIGH_RES_REQUIRED' "$ROI_POLICY"
          grep -Fq 'LiveEvidenceEscalationPolicy.VIEW_CHANGE_REQUIRED' "$ROI_POLICY"
          grep -Fq 'LiveEvidenceEscalationPolicy.OCR' "$ROI_POLICY"

          ADAPTIVE_ROI="$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/AdaptiveIdentityRoi.kt"
          ADAPTIVE_GEOMETRY="$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/AdaptiveIdentityGeometry.kt"
          ADAPTIVE_ROI_TEST="$PROJECT_DIR/app/src/test/java/com/arspos/anglerriausyndicate/AdaptiveIdentityRoiTest.kt"

          test -f "$ADAPTIVE_GEOMETRY" || {
            echo "::error::AdaptiveIdentityGeometry.kt is missing."
            exit 1
          }

          if grep -Fq 'import android.graphics.Rect' "$ADAPTIVE_GEOMETRY"; then
            echo "::error::Pure ROI geometry must not depend on android.graphics.Rect."
            exit 1
          fi

          grep -Fq 'data class RoiBounds' "$ADAPTIVE_GEOMETRY"
          grep -Fq 'object AdaptiveIdentityGeometry' "$ADAPTIVE_GEOMETRY"
          grep -Fq 'AdaptiveIdentityGeometry' "$ADAPTIVE_ROI"
          grep -Fq 'toRoiBounds' "$ADAPTIVE_ROI"
          grep -Fq 'toAndroidRect' "$ADAPTIVE_ROI"

          if grep -Fq 'import android.graphics.Rect' "$ADAPTIVE_ROI_TEST"; then
            echo "::error::Host-JVM ROI regression test must not import android.graphics.Rect."
            exit 1
          fi

          grep -Fq 'AdaptiveIdentityGeometry.' "$ADAPTIVE_ROI_TEST"

          if grep -Fq 'AdaptiveIdentityRoi.' "$ADAPTIVE_ROI_TEST"; then
            echo "::error::Host-JVM ROI regression test must execute pure geometry, not the Android adapter."
            exit 1
          fi

          if grep -Fq 'AUTOMATIC_SCAN_FAILURE' "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/PosViewModel.kt"; then
            echo "::error::Automatic AI handoff masih berada di critical Smart Scan path."
            exit 1
          fi

          if test -f "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/TemporalIdentityHoldPolicy.kt"; then
            echo "::error::Legacy TemporalIdentityHoldPolicy belum digabung ke PhysicalObjectStateMachine."
            exit 1
          fi

          echo "Source V8.8.4 R3 hash + 207 static safety invariants + pure ROI compile/test contracts: PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve Android SDK manager
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          test -n "$SDK_ROOT" && test -d "$SDK_ROOT" || {
            echo "::error::Android SDK root tidak tersedia pada runner."
            exit 1
          }

          SDKMANAGER_BIN="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER_BIN" ]; then
            SDKMANAGER_BIN="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -111 2>/dev/null | sort -V | tail -n 1 || true)"
          fi

          test -n "$SDKMANAGER_BIN" && test -x "$SDKMANAGER_BIN" || {
            echo "::error::sdkmanager tidak ditemukan."
            exit 1
          }

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER_BIN=$SDKMANAGER_BIN" >> "$GITHUB_ENV"

          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "sdkmanager=$SDKMANAGER_BIN"
            "$SDKMANAGER_BIN" --version
          } > "$RUNNER_TEMP/ars-sdk-info.txt"

      - name: Install Android SDK 35 build tools
        shell: bash
        run: |
          set -euo pipefail

          yes | "$SDKMANAGER_BIN" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true

          "$SDKMANAGER_BIN" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -f "$ANDROID_SDK_ROOT/platforms/android-35/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Verify official ARS signer
        shell: bash
        env:
          ARS_RELEASE_KEYSTORE_BASE64: ${{ secrets.ARS_RELEASE_KEYSTORE_BASE64 }}
          ARS_RELEASE_STORE_PASSWORD: ${{ secrets.ARS_RELEASE_STORE_PASSWORD }}
          ARS_RELEASE_KEY_ALIAS: ${{ secrets.ARS_RELEASE_KEY_ALIAS }}
          ARS_RELEASE_KEY_PASSWORD: ${{ secrets.ARS_RELEASE_KEY_PASSWORD }}
          ARS_RELEASE_CERT_SHA256: ${{ secrets.ARS_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail

          : "${ARS_RELEASE_KEYSTORE_BASE64:?Missing ARS_RELEASE_KEYSTORE_BASE64}"
          : "${ARS_RELEASE_STORE_PASSWORD:?Missing ARS_RELEASE_STORE_PASSWORD}"
          : "${ARS_RELEASE_KEY_ALIAS:?Missing ARS_RELEASE_KEY_ALIAS}"
          : "${ARS_RELEASE_KEY_PASSWORD:?Missing ARS_RELEASE_KEY_PASSWORD}"
          : "${ARS_RELEASE_CERT_SHA256:?Missing ARS_RELEASE_CERT_SHA256}"

          EXPECTED="$(printf '%s' "$ARS_RELEASE_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"

          test "$EXPECTED" = "$OFFICIAL_CERT_SHA256" || {
            echo "::error::Secret certificate bukan signer resmi ARS POS."
            exit 1
          }

          KEYSTORE="$RUNNER_TEMP/ars-v884-206.jks"

          umask 077

          printf '%s' "$ARS_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"

          test -s "$KEYSTORE"

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass:env ARS_RELEASE_STORE_PASSWORD \
            -alias "$ARS_RELEASE_KEY_ALIAS" >/dev/null

          ACTUAL=$(
            keytool -exportcert -rfc \
              -keystore "$KEYSTORE" \
              -storepass:env ARS_RELEASE_STORE_PASSWORD \
              -alias "$ARS_RELEASE_KEY_ALIAS" \
            | openssl x509 -outform DER \
            | sha256sum \
            | awk '{print toupper($1)}'
          )

          test "$ACTUAL" = "$OFFICIAL_CERT_SHA256" || {
            echo "::error::Keystore signer mismatch: $ACTUAL"
            exit 1
          }

          echo "ARS_RELEASE_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "Official signer pre-build verification: PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Compile Android debug and release Kotlin
        shell: bash
        env:
          ARS_RELEASE_STORE_PASSWORD: ${{ secrets.ARS_RELEASE_STORE_PASSWORD }}
          ARS_RELEASE_KEY_ALIAS: ${{ secrets.ARS_RELEASE_KEY_ALIAS }}
          ARS_RELEASE_KEY_PASSWORD: ${{ secrets.ARS_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle \
            :app:compileDebugKotlin \
            :app:compileReleaseKotlin \
            --no-daemon \
            --stacktrace

      - name: Run regression tests and build signed release APK
        shell: bash
        env:
          ARS_RELEASE_STORE_PASSWORD: ${{ secrets.ARS_RELEASE_STORE_PASSWORD }}
          ARS_RELEASE_KEY_ALIAS: ${{ secrets.ARS_RELEASE_KEY_ALIAS }}
          ARS_RELEASE_KEY_PASSWORD: ${{ secrets.ARS_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle \
            :physicaltruth-jvm:test \
            :app:testDebugUnitTest \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify package version signer and alignment
        shell: bash
        env:
          ARS_RELEASE_CERT_SHA256: ${{ secrets.ARS_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          APK="app/build/outputs/apk/release/app-release.apk"

          test -s "$APK"

          SDK_BIN="$ANDROID_SDK_ROOT/build-tools/35.0.0"

          "$SDK_BIN/aapt" dump badging "$APK" > apk-badging.txt

          grep -Fq "name='$EXPECTED_PACKAGE'" apk-badging.txt
          grep -Fq "versionCode='$EXPECTED_VERSION_CODE'" apk-badging.txt
          grep -Fq "versionName='$EXPECTED_VERSION_NAME'" apk-badging.txt

          test "$EXPECTED_VERSION_CODE" -gt "$PREVIOUS_VERSION_CODE"

          "$SDK_BIN/apksigner" verify \
            --verbose \
            --print-certs \
            "$APK" > signer-info.txt

          "$SDK_BIN/zipalign" \
            -c \
            -P 16 \
            -v 4 \
            "$APK"

          ACTUAL="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}' signer-info.txt | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"

          EXPECTED="$(printf '%s' "$ARS_RELEASE_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"

          test -n "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          test "$ACTUAL" = "$OFFICIAL_CERT_SHA256"

          mkdir -p "$GITHUB_WORKSPACE/release-output"

          OUT_APK="$GITHUB_WORKSPACE/release-output/ARS-POS-1.10.6-V8.8.4-R3-PURE-ROI-GEOMETRY-206-20260925-SIGNED.apk"

          cp "$APK" "$OUT_APK"
          cp signer-info.txt "$GITHUB_WORKSPACE/release-output/SIGNING_FINGERPRINT.txt"
          cp apk-badging.txt "$GITHUB_WORKSPACE/release-output/APK_METADATA.txt"
          cp "$RUNNER_TEMP/ars-source-checks.txt" "$GITHUB_WORKSPACE/release-output/SOURCE_CHECKS.txt"
          cp "$RUNNER_TEMP/ars-sdk-info.txt" "$GITHUB_WORKSPACE/release-output/SDK_INFO.txt"
          cp validation/validation-status.json "$GITHUB_WORKSPACE/release-output/SOURCE_VALIDATION_STATUS.json"

          sha256sum "$OUT_APK" > "$GITHUB_WORKSPACE/release-output/APK_SHA256.txt"

          echo "Build 1.10.6 (206) / Phase 4.3.5.4 / V8.8.4: PASS." >> "$GITHUB_STEP_SUMMARY"
          echo "Sticky physical lock is analyzer-independent; useful high-resolution evidence reaches finalization; static ambiguity retry and discriminative micro-OCR are bounded; AI Engineer remains outside the critical scan path." >> "$GITHUB_STEP_SUMMARY"
          echo "Cloud Identity=SHADOW; Self Learning=ACTIVE_CONFIRMED_ONLY; all 14 thresholds unchanged." >> "$GITHUB_STEP_SUMMARY"
          echo "Install in-place only; do not uninstall the production app." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified official APK
        uses: actions/upload-artifact@v7
        with:
          name: ARS-POS-V8.8.4-R3-PURE-ROI-GEOMETRY-206-OFFICIAL
          path: release-output/
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: always() && env.PROJECT_DIR != ''
        uses: actions/upload-artifact@v7
        with:
          name: ARS-POS-V8.8.4-R3-206-TEST-REPORTS
          path: |
            ${{ env.PROJECT_DIR }}/physicaltruth-jvm/build/reports/tests/
            ${{ env.PROJECT_DIR }}/physicaltruth-jvm/build/test-results/
            ${{ env.PROJECT_DIR }}/app/build/reports/tests/
            ${{ env.PROJECT_DIR }}/app/build/test-results/
            ${{ env.PROJECT_DIR }}/validation/
          if-no-files-found: warn
          retention-days: 30

      - name: Remove runner copy of signing key
        if: always()
        shell: bash
        run: |
          KEYSTORE="$RUNNER_TEMP/ars-v884-206.jks"

          if [ -f "$KEYSTORE" ]; then
            if command -v shred >/dev/null 2>&1; then
              shred -u "$KEYSTORE" || rm -f -- "$KEYSTORE"
            else
              rm -f -- "$KEYSTORE"
            fi
          fi
