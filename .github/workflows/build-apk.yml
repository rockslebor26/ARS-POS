name: ARS POS Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ARS POS Signed Release APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT SOURCE CODE
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v7


      # ============================================================
      # 2. SETUP JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # ============================================================
      # 3. SETUP ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0


      # ============================================================
      # 4. SETUP GRADLE
      #
      # Project kita menggunakan:
      # Android Gradle Plugin 8.7.3
      #
      # Gradle 8.9 adalah versi yang kompatibel.
      # ============================================================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'


      # ============================================================
      # 5. CEK ENVIRONMENT
      # ============================================================
      - name: Check build environment
        run: |
          echo "=== JAVA ==="
          java -version

          echo ""
          echo "=== GRADLE ==="
          gradle --version

          echo ""
          echo "=== ANDROID SDK ==="
          echo "ANDROID_HOME=$ANDROID_HOME"

          echo ""
          echo "=== PROJECT ==="
          ls -la

          echo ""
          echo "=== APP SOURCE ==="
          find app/src/main -maxdepth 3 -type f | sort


      # ============================================================
      # 6. VALIDASI STRUKTUR PROJECT
      # ============================================================
      - name: Validate Gradle project
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "Gradle project structure OK."


      # ============================================================
      # 7. CLEAN BUILD
      # ============================================================
      - name: Clean project
        run: |
          gradle clean --no-daemon --stacktrace


      # ============================================================
      # 8. BUILD RELEASE APK
      # ============================================================
      - name: Build Release APK
        run: |
          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      # ============================================================
      # 9. CEK HASIL APK
      # ============================================================
      - name: Check APK output
        run: |
          echo "=== APK OUTPUT ==="

          find app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print

          echo ""
          echo "=== FILE SIZE ==="

          ls -lh app/build/outputs/apk/release/*.apk


      # ============================================================
      # 10. VERIFY APK
      # ============================================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK=$(find app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          echo "APK ditemukan:"
          echo "$APK"

          echo ""
          echo "=== APK SIGNATURE ==="

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"


      # ============================================================
      # 11. VERIFY APK ZIP ALIGNMENT
      # ============================================================
      - name: Verify APK alignment
        shell: bash
        run: |
          set -e

          APK=$(find app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | head -n 1)

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -c \
            -P 16 \
            -v 4 \
            "$APK"


      # ============================================================
      # 12. RENAME APK
      # ============================================================
      - name: Prepare final APK
        shell: bash
        run: |
          set -e

          APK=$(find app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          FINAL_APK="app/build/outputs/apk/release/ARS-POS-1.0.0-signed.apk"

          cp "$APK" "$FINAL_APK"

          echo "Final APK:"
          ls -lh "$FINAL_APK"


      # ============================================================
      # 13. SHA-256 CHECKSUM
      # ============================================================
      - name: Generate APK checksum
        shell: bash
        run: |
          set -e

          cd app/build/outputs/apk/release

          sha256sum ARS-POS-1.0.0-signed.apk \
            > ARS-POS-1.0.0-signed.apk.sha256

          echo "=== SHA-256 ==="
          cat ARS-POS-1.0.0-signed.apk.sha256


      # ============================================================
      # 14. UPLOAD APK
      # ============================================================
      - name: Upload signed APK
        uses: actions/upload-artifact@v7
        with:
          name: ARS-POS-1.0.0-SIGNED
          path: |
            app/build/outputs/apk/release/ARS-POS-1.0.0-signed.apk
            app/build/outputs/apk/release/ARS-POS-1.0.0-signed.apk.sha256
          if-no-files-found: error
          retention-days: 30
