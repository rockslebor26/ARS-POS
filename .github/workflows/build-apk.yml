name: ARS POS V8.4.18 Atomic Quantity 154

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ARS_POS_V8_4_18_ATOMIC_QUANTITY_154.zip
      - .github/workflows/build-apk.yml

permissions:
  contents: read

concurrency:
  group: ars-pos-v8418-154-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_ZIP: ARS_POS_V8_4_18_ATOMIC_QUANTITY_154.zip
      SOURCE_SHA256: 07652366e7f414888caa85306246a6e302c6be920767361e13bdadc97b2feab0
      ARS_VERSION_NAME: "1.5.4"
      ARS_VERSION_CODE: "154"
      ARS_PHASE: "4.3.2.38"
      ARS_ENGINE: "V8.4.18"
      ARS_PACKAGE: com.arspos.anglerriausyndicate
      ARS_SIGNER_SHA256: AA2A8C6C885BA887577A2C2813AEA2F72E5FB51892FC486108B57F8389D56AEB

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify exact V8.4.18 source package
        shell: bash
        run: |
          set -euo pipefail

          test -f "$SOURCE_ZIP" || {
            echo "::error::Upload $SOURCE_ZIP ke root repository."
            exit 1
          }

          printf '%s  %s\n' "$SOURCE_SHA256" "$SOURCE_ZIP" | sha256sum -c -
          unzip -t "$SOURCE_ZIP" >/dev/null

          PROJECT_DIR=$(mktemp -d "$RUNNER_TEMP/ars-v8418-154.XXXXXX")
          unzip -q "$SOURCE_ZIP" -d "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          python3 "$PROJECT_DIR/tools/validate_source.py" --root "$PROJECT_DIR" \
            | tee "$PROJECT_DIR/source-validation.json"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          SDK_BIN="$ANDROID_HOME/build-tools/35.0.0"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -f "$SDK_BIN/aapt"
          test -f "$SDK_BIN/apksigner"
          test -f "$SDK_BIN/zipalign"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Prepare existing official signer
        shell: bash
        env:
          ARS_RELEASE_KEYSTORE_BASE64: ${{ secrets.ARS_RELEASE_KEYSTORE_BASE64 }}
          ARS_RELEASE_STORE_PASSWORD: ${{ secrets.ARS_RELEASE_STORE_PASSWORD }}
          ARS_RELEASE_KEY_ALIAS: ${{ secrets.ARS_RELEASE_KEY_ALIAS }}
          ARS_RELEASE_KEY_PASSWORD: ${{ secrets.ARS_RELEASE_KEY_PASSWORD }}
          ARS_RELEASE_CERT_SHA256: ${{ secrets.ARS_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail

          : "${ARS_RELEASE_KEYSTORE_BASE64:?Missing official keystore secret}"
          : "${ARS_RELEASE_STORE_PASSWORD:?Missing store password secret}"
          : "${ARS_RELEASE_KEY_ALIAS:?Missing alias secret}"
          : "${ARS_RELEASE_KEY_PASSWORD:?Missing key password secret}"
          : "${ARS_RELEASE_CERT_SHA256:?Missing certificate secret}"

          EXPECTED=$(printf '%s' "$ARS_RELEASE_CERT_SHA256" \
            | tr -d ':[:space:]' \
            | tr '[:lower:]' '[:upper:]')

          test "$EXPECTED" = "$ARS_SIGNER_SHA256" || {
            echo "::error::ARS_RELEASE_CERT_SHA256 tidak sama dengan signer resmi ARS POS."
            exit 1
          }

          KEYSTORE="$RUNNER_TEMP/ars-v8418-154.jks"
          umask 077
          printf '%s' "$ARS_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass:env ARS_RELEASE_STORE_PASSWORD \
            -alias "$ARS_RELEASE_KEY_ALIAS" >/dev/null

          echo "ARS_RELEASE_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Compile, run JVM tests, build signed APK
        shell: bash
        env:
          ARS_RELEASE_STORE_PASSWORD: ${{ secrets.ARS_RELEASE_STORE_PASSWORD }}
          ARS_RELEASE_KEY_ALIAS: ${{ secrets.ARS_RELEASE_KEY_ALIAS }}
          ARS_RELEASE_KEY_PASSWORD: ${{ secrets.ARS_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace

      - name: Verify package, version, signature and alignment
        shell: bash
        env:
          ARS_RELEASE_CERT_SHA256: ${{ secrets.ARS_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"

          SDK_BIN="$ANDROID_HOME/build-tools/35.0.0"
          "$SDK_BIN/aapt" dump badging "$APK" > apk-badging.txt

          grep -Fq "name='$ARS_PACKAGE'" apk-badging.txt
          grep -Fq "versionCode='$ARS_VERSION_CODE'" apk-badging.txt
          grep -Fq "versionName='$ARS_VERSION_NAME'" apk-badging.txt

          "$SDK_BIN/apksigner" verify --verbose --print-certs "$APK" > signer-info.txt
          "$SDK_BIN/zipalign" -c -P 16 -v 4 "$APK"

          ACTUAL=$(awk -F': ' \
            '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}' \
            signer-info.txt \
            | tr -d ':[:space:]' \
            | tr '[:lower:]' '[:upper:]')

          EXPECTED=$(printf '%s' "$ARS_RELEASE_CERT_SHA256" \
            | tr -d ':[:space:]' \
            | tr '[:lower:]' '[:upper:]')

          test "$ACTUAL" = "$EXPECTED"
          test "$ACTUAL" = "$ARS_SIGNER_SHA256"

          mkdir -p "$GITHUB_WORKSPACE/release-output"
          OUTPUT_APK="ARS-POS-${ARS_VERSION_NAME}-${ARS_ENGINE}-ATOMIC-QUANTITY-SIGNED.apk"

          cp "$APK" "$GITHUB_WORKSPACE/release-output/$OUTPUT_APK"
          cp signer-info.txt "$GITHUB_WORKSPACE/release-output/SIGNING_FINGERPRINT.txt"
          cp apk-badging.txt "$GITHUB_WORKSPACE/release-output/APK_BADGING.txt"

          cd "$GITHUB_WORKSPACE/release-output"
          sha256sum "$OUTPUT_APK" > APK_SHA256.txt

          {
            echo "### ARS POS Official Release"
            echo "- Version: ${ARS_VERSION_NAME} (${ARS_VERSION_CODE})"
            echo "- Phase: ${ARS_PHASE} / ${ARS_ENGINE}"
            echo "- Package: ${ARS_PACKAGE}"
            echo "- Signer SHA-256: ${ACTUAL}"
            echo "- Update: IN_PLACE_UPDATE; install over official previous build, do not uninstall"
            echo "- Room DB: v5 unchanged"
            echo "- Recognition thresholds: unchanged"
            echo "- JVM tests: passed"
            echo "- Device scanner acceptance tests: still required"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate ARS Dev Center auto report
        if: always() && env.PROJECT_DIR != ''
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          REPORT=ARS_DEV_CENTER_REPORT.md
          NOW=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          {
            echo "### ARS Dev Center Auto Report"
            echo "- Generated: $NOW"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Version: ${ARS_VERSION_NAME} (${ARS_VERSION_CODE})"
            echo "- Phase: ${ARS_PHASE} / ${ARS_ENGINE}"
            echo "- Package: ${ARS_PACKAGE}"
            echo ""

            echo "#### Scan Safety Rules"
            echo "- Quantity source: eligible physical visual objects only"
            echo "  - match != null"
            echo "  - quantityEligible == true"
            echo "  - bridgeSuppressed == false"
            echo "  - proposalType != RESCUE"
            echo "- Initial requested quantity is clamped to remaining stock after current cart"
            echo ""

            echo "#### Quantity Commit Safety"
            echo "- Active session required"
            echo "- UI double-tap guard enabled"
            echo "- ViewModel duplicate-session guard retained"
            echo "- Duplicate product draft rejected"
            echo "- Stock validation includes current cart"
            echo "- Rejected review must not partially mutate cart"
            echo ""

            echo "#### Visual Evidence"
            echo "- Interactive object review retained"
            echo "- Visual Evidence Recorder retained"
            echo "- Diagnostic Scan Package retained"
            echo "- session/proposal/physicalObject/decision binding retained"
            echo ""

            echo "#### Build Integrity"
            echo "- Source ZIP SHA256 verified: ${SOURCE_SHA256}"
            echo "- Source safety invariants verified"
            echo "- Official signing required"
            echo "- Package identity must remain unchanged"
            echo "- versionCode must increase"
            echo "- Recognition thresholds unchanged"
          } > "$REPORT"

          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"

      - name: Collect CI evidence artifacts
        if: always() && env.PROJECT_DIR != ''
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          mkdir -p ci-evidence

          for f in \
            source-validation.json \
            apk-badging.txt \
            signer-info.txt; do
            if [ -f "$f" ]; then
              cp "$f" ci-evidence/
            fi
          done

          find app/build/reports/tests app/build/test-results \
            -type f -print 2>/dev/null \
            > ci-evidence/test-evidence-list.txt || true

          find . -type f \
            \( -name '*flight*record*' \
            -o -name '*evidence*' \
            -o -name '*.log' \
            -o -name '*.json' \) \
            -print > ci-evidence/evidence-list.txt || true

      - name: Upload verified official APK
        uses: actions/upload-artifact@v4
        with:
          name: ARS-POS-V8.4.18-ATOMIC-QUANTITY-154-OFFICIAL
          path: release-output/
          if-no-files-found: error

      - name: Upload ARS Dev Center report artifacts
        if: always() && env.PROJECT_DIR != ''
        uses: actions/upload-artifact@v4
        with:
          name: ARS-DEV-CENTER-V8.4.18-154-REPORT
          path: |
            ${{ env.PROJECT_DIR }}/ARS_DEV_CENTER_REPORT.md
            ${{ env.PROJECT_DIR }}/ci-evidence
          if-no-files-found: warn

      - name: Upload JVM test reports
        if: always() && env.PROJECT_DIR != ''
        uses: actions/upload-artifact@v4
        with:
          name: ARS-POS-V8.4.18-154-TEST-REPORTS
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/tests/
            ${{ env.PROJECT_DIR }}/app/build/test-results/
          if-no-files-found: warn

      - name: Remove runner copy of signing key
        if: always()
        shell: bash
        run: |
          rm -f -- "$RUNNER_TEMP/ars-v8418-154.jks"
