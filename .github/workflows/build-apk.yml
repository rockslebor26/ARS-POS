name: ARS POS Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ARS POS Phase 4.2.1 Camera Stability
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v7


      # ============================================================
      # 2. SETUP JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. SETUP ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # ============================================================
      # 4. INSTALL ANDROID SDK PACKAGES
      # ============================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

          test -f "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -f "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -f "$ANDROID_HOME/build-tools/35.0.0/aapt"


      # ============================================================
      # 5. SETUP GRADLE 8.9
      # ============================================================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'


      # ============================================================
      # 6. CHECK REPOSITORY
      # ============================================================
      - name: Check repository files
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ARS POS PHASE 4.2.1 CAMERA STABILITY"
          echo "=========================================="

          pwd

          ls -lah

          echo "ZIP FILES:"

          find . \
            -type f \
            -iname "*.zip" \
            -print


      # ============================================================
      # 7. REQUIRE PHASE 4.2.1 PROJECT ZIP
      # ============================================================
      - name: Require Phase 4.2.1 project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="./ARS_POS_PHASE4_2_1_CAMERA_STABILITY_FIXED.zip"

          if [ ! -f "$ZIP_FILE" ]; then

            echo "ERROR:"
            echo "$ZIP_FILE tidak ditemukan di ROOT repository."

            echo ""
            echo "Upload ZIP Phase 4.2.1 terbaru ke ROOT repository."

            echo ""
            echo "ZIP yang tersedia:"

            find . \
              -type f \
              -iname "*.zip" \
              -print

            exit 1

          fi

          echo "ZIP ditemukan:"

          ls -lh "$ZIP_FILE"

          echo ""

          echo "Testing ZIP integrity..."

          unzip -t "$ZIP_FILE"

          echo ""

          echo "ZIP integrity OK."

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ============================================================
      # 8. EXTRACT ARS POS PROJECT
      # ============================================================
      - name: Extract ARS POS project
        shell: bash
        run: |
          set -e

          rm -rf extracted

          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo ""
          echo "Project extracted successfully."


      # ============================================================
      # 9. LOCATE GRADLE PROJECT
      # ============================================================
      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find extracted \
            -type f \
            -name "settings.gradle.kts" \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then

            echo "ERROR:"
            echo "settings.gradle.kts tidak ditemukan."

            echo ""

            find extracted \
              -maxdepth 8 \
              -type f \
              | sort

            exit 1

          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Gradle project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 10. VALIDATE PHASE 4.2.1 SOURCES
      # ============================================================
      - name: Validate Phase 4.2.1 sources
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "VALIDATE PHASE 4.2.1 SOURCES"
          echo "=========================================="

          FILES=(

            "settings.gradle.kts"

            "build.gradle.kts"

            "gradle.properties"

            "app/build.gradle.kts"

            "app/src/main/AndroidManifest.xml"

            "app/src/main/res/xml/file_paths.xml"

            "app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"

            "app/src/main/java/com/arspos/anglerriausyndicate/PosViewModel.kt"

            "app/src/main/java/com/arspos/anglerriausyndicate/Money.kt"

            "app/src/main/java/com/arspos/anglerriausyndicate/ProductVisualMatcher.kt"

            "app/src/main/java/com/arspos/anglerriausyndicate/VisualProductMatch.kt"

            "app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"

            "app/src/main/java/com/arspos/anglerriausyndicate/data/db/ArsDao.kt"

            "app/src/main/java/com/arspos/anglerriausyndicate/data/db/ArsDatabase.kt"

            "app/src/main/java/com/arspos/anglerriausyndicate/data/db/ProductPhotoEntity.kt"

          )

          FAILED=0

          for FILE in "${FILES[@]}"; do

            if [ -f "$FILE" ]; then

              echo "OK   $FILE"

            else

              echo "MISS $FILE"

              FAILED=1

            fi

          done

          if [ "$FAILED" -ne 0 ]; then

            echo ""

            echo "ERROR: Ada source Phase 4.2.1 yang hilang."

            exit 1

          fi

          echo ""

          echo "PHASE 4.2.1 SOURCE STRUCTURE OK"


      # ============================================================
      # 11. VALIDATE CAMERA STABILITY
      # ============================================================
      - name: Validate Camera Stability
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          MAIN="app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"

          MANIFEST="app/src/main/AndroidManifest.xml"

          PATHS="app/src/main/res/xml/file_paths.xml"

          echo "=========================================="
          echo "CAMERA STABILITY CHECK"
          echo "=========================================="

          echo ""
          echo "TakePicture contract:"

          grep -n \
            "ActivityResultContracts.TakePicture()" \
            "$MAIN"

          echo ""
          echo "Camera permission:"

          grep -n \
            "Manifest.permission.CAMERA" \
            "$MAIN"

          grep -n \
            "android.permission.CAMERA" \
            "$MANIFEST"

          echo ""
          echo "FileProvider:"

          grep -n \
            "FileProvider" \
            "$MAIN"

          grep -n \
            "androidx.core.content.FileProvider" \
            "$MANIFEST"

          grep -n \
            "fileprovider" \
            "$MANIFEST"

          grep -n \
            "FILE_PROVIDER_PATHS" \
            "$MANIFEST"

          grep -n \
            "camera_capture" \
            "$PATHS"

          echo ""
          echo "Safe camera file handling:"

          grep -n \
            "createCameraUri" \
            "$MAIN"

          grep -n \
            "decodeCameraBitmap" \
            "$MAIN"

          grep -n \
            "runCatching" \
            "$MAIN"

          grep -n \
            "pending.*CameraFile" \
            "$MAIN"

          echo ""
          echo "Reject old preview contract:"

          if grep -q \
            "TakePicturePreview" \
            "$MAIN"; then

            echo "ERROR: Kontrak preview lama masih digunakan."

            exit 1

          fi

          echo ""

          echo "Camera stability validation OK."


      # ============================================================
      # 12. VALIDATE VISUAL SCANNER
      # ============================================================
      - name: Validate Visual Scanner and POS integration
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          MAIN="app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"

          VM="app/src/main/java/com/arspos/anglerriausyndicate/PosViewModel.kt"

          REPO="app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"

          DAO="app/src/main/java/com/arspos/anglerriausyndicate/data/db/ArsDao.kt"

          echo "=========================================="
          echo "VISUAL SCANNER + POS"
          echo "=========================================="

          grep -n \
            "SCAN FOTO PRODUK" \
            "$MAIN"

          grep -n \
            "findVisualMatches" \
            "$VM"

          grep -n \
            "visualProductMatches" \
            "$REPO"

          grep -n \
            "allProductPhotos" \
            "$DAO"

          grep -n \
            "ProductVisualMatcher.score" \
            "$REPO"

          grep -n \
            "Kecocokan visual" \
            "$MAIN"

          grep -n \
            "TAMBAH" \
            "$MAIN"

          echo ""

          echo "Visual scanner + POS validation OK."


      # ============================================================
      # 13. VALIDATE OFFLINE PHOTO DATABASE
      # ============================================================
      - name: Validate Offline and Photo Database
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          MAIN="app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"

          DAO="app/src/main/java/com/arspos/anglerriausyndicate/data/db/ArsDao.kt"

          DB="app/src/main/java/com/arspos/anglerriausyndicate/data/db/ArsDatabase.kt"

          echo "=========================================="
          echo "OFFLINE PHOTO DATABASE"
          echo "=========================================="

          grep -n \
            "product_photos" \
            "$DAO"

          grep -n \
            "version=4" \
            "$DB"

          grep -n \
            "MIGRATION_3_4" \
            "$DB"

          grep -n \
            "filesDir" \
            "$MAIN"

          grep -n \
            "Bitmap.CompressFormat.JPEG" \
            "$MAIN"

          echo ""

          echo "Offline/photo database validation OK."


      # ============================================================
      # 14. VALIDATE EXISTING POS FEATURES
      # ============================================================
      - name: Validate Existing POS Features
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          MAIN="app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"

          REPO="app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"

          echo "=========================================="
          echo "EXISTING POS FEATURES"
          echo "=========================================="

          echo ""
          echo "Payment methods:"

          grep -n "CASH" "$MAIN"

          grep -n "QRIS" "$MAIN"

          grep -n "TRANSFER" "$MAIN"

          grep -n "DEBIT" "$MAIN"

          echo ""
          echo "Payment protection:"

          grep -n \
            "processingPayment" \
            "$MAIN"

          grep -n \
            "MEMPROSES" \
            "$MAIN"

          echo ""
          echo "Rupiah formatter:"

          grep -n \
            "formatRupiah" \
            "$MAIN"

          grep -n \
            "formatRupiah" \
            app/src/main/java/com/arspos/anglerriausyndicate/Money.kt

          grep -n \
            'Locale("id", "ID")' \
            app/src/main/java/com/arspos/anglerriausyndicate/Money.kt

          echo ""
          echo "Transaction safety:"

          grep -n \
            "db.withTransaction" \
            "$REPO"

          grep -n \
            "dao.changeStock" \
            "$REPO"

          echo ""

          echo "Existing POS feature validation OK."


      # ============================================================
      # 15. CHECK VERSION
      # ============================================================
      - name: Check ARS POS version
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "VERSION 1.0.6 CHECK"
          echo "=========================================="

          grep -q \
            "versionCode = 106" \
            app/build.gradle.kts

          grep -q \
            'versionName = "1.0.6"' \
            app/build.gradle.kts

          echo ""

          echo "Version 1.0.6 validation PASSED."


      # ============================================================
      # 16. VALIDATE ARS BRANDING
      # ============================================================
      - name: Validate ARS branding
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          test -f \
            app/src/main/res/drawable/ars_background.png

          test -f \
            app/src/main/res/drawable/ars_logo_master.png

          test -f \
            app/src/main/res/mipmap-mdpi/ic_launcher.png

          test -f \
            app/src/main/res/mipmap-hdpi/ic_launcher.png

          test -f \
            app/src/main/res/mipmap-xhdpi/ic_launcher.png

          test -f \
            app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          test -f \
            app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          grep -n \
            "android:icon" \
            app/src/main/AndroidManifest.xml

          grep -n \
            "android:roundIcon" \
            app/src/main/AndroidManifest.xml

          echo ""

          echo "ARS branding validation OK."


      # ============================================================
      # 17. SHOW BUILD ENVIRONMENT
      # ============================================================
      - name: Show build environment
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "JAVA"
          echo "=========================================="

          java -version

          echo ""

          echo "=========================================="
          echo "GRADLE"
          echo "=========================================="

          gradle --version

          echo ""

          echo "=========================================="
          echo "ANDROID HOME"
          echo "=========================================="

          echo "$ANDROID_HOME"


      # ============================================================
      # 18. CLEAN PROJECT
      # ============================================================
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle clean \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 19. BUILD RELEASE APK
      # ============================================================
      - name: Build Release APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      # ============================================================
      # 20. LOCATE APK
      # ============================================================
      - name: Locate APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          APK_DIR="app/build/outputs/apk/release"

          APK=$(find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then

            echo "ERROR: APK tidak ditemukan."

            find app/build/outputs \
              -type f \
              | sort

            exit 1

          fi

          echo ""

          echo "APK ditemukan:"

          ls -lh "$APK"

          echo ""

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"


      # ============================================================
      # 21. VERIFY APK SIGNATURE
      # ============================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK_PATH"

          echo ""

          echo "Signature verification PASSED."


      # ============================================================
      # 22. VERIFY APK ALIGNMENT
      # ============================================================
      - name: Verify APK alignment
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -c \
            -P 16 \
            -v 4 \
            "$APK_PATH"

          echo ""

          echo "Alignment verification PASSED."


      # ============================================================
      # 23. VERIFY PACKAGE AND VERSION
      # ============================================================
      - name: Verify APK package and version
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "APK PACKAGE / VERSION"
          echo "=========================================="

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging \
            "$APK_PATH" \
            | grep -E \
            "package: name=|versionCode=|versionName="

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging \
            "$APK_PATH" \
            | grep -q \
            "name='com.arspos.anglerriausyndicate'"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging \
            "$APK_PATH" \
            | grep -q \
            "versionCode='106'"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging \
            "$APK_PATH" \
            | grep -q \
            "versionName='1.0.6'"

          echo ""

          echo "Package/version verification PASSED."


      # ============================================================
      # 24. PREPARE FINAL APK
      # ============================================================
      - name: Prepare final APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          APK_DIR="app/build/outputs/apk/release"

          FINAL_APK="$APK_DIR/ARS-POS-1.0.6-PHASE4.2.1-CAMERA-STABILITY-SIGNED.apk"

          cp \
            "$APK_PATH" \
            "$FINAL_APK"

          test -f "$FINAL_APK"

          echo ""

          echo "Generating SHA-256..."

          sha256sum \
            "$FINAL_APK" \
            > "$FINAL_APK.sha256"

          echo ""

          echo "Final APK:"

          ls -lh \
            "$FINAL_APK"

          echo ""

          echo "SHA-256:"

          cat \
            "$FINAL_APK.sha256"


      # ============================================================
      # 25. FINAL RELEASE CHECK
      # ============================================================
      - name: Final release check
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR/app/build/outputs/apk/release"

          test -f \
            ARS-POS-1.0.6-PHASE4.2.1-CAMERA-STABILITY-SIGNED.apk

          test -f \
            ARS-POS-1.0.6-PHASE4.2.1-CAMERA-STABILITY-SIGNED.apk.sha256

          echo ""

          echo "=========================================="
          echo "ARS POS PHASE 4.2.1 READY"
          echo "=========================================="

          echo ""

          ls -lh \
            ARS-POS-1.0.6-PHASE4.2.1-CAMERA-STABILITY-SIGNED.apk

          echo ""

          cat \
            ARS-POS-1.0.6-PHASE4.2.1-CAMERA-STABILITY-SIGNED.apk.sha256


      # ============================================================
      # 26. UPLOAD SIGNED APK
      # ============================================================
      - name: Upload signed APK
        uses: actions/upload-artifact@v7
        with:

          name: ARS-POS-1.0.6-PHASE4.2.1-CAMERA-STABILITY-SIGNED

          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.0.6-PHASE4.2.1-CAMERA-STABILITY-SIGNED.apk

            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.0.6-PHASE4.2.1-CAMERA-STABILITY-SIGNED.apk.sha256

          if-no-files-found: error

          retention-days: 30
