name: ARS POS Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ARS POS Signed Release APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v7


      # ============================================================
      # 2. SETUP JAVA 17
      #
      # CACHE GRADLE DIHAPUS
      # karena project Gradle masih berada di dalam ZIP.
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. SETUP ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0


      # ============================================================
      # 4. SETUP GRADLE 8.9
      # ============================================================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'


      # ============================================================
      # 5. CHECK REPOSITORY
      # ============================================================
      - name: Check repository files
        shell: bash
        run: |
          echo "=========================================="
          echo "REPOSITORY ROOT"
          echo "=========================================="

          pwd

          echo ""
          echo "Files:"
          ls -lah

          echo ""
          echo "ZIP FILES:"
          find . -maxdepth 2 -type f -iname "*.zip" -print


      # ============================================================
      # 6. FIND PHASE 1 BRANDING ZIP
      # ============================================================
      - name: Find Phase 1 ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . \
            -type f \
            -iname "*PHASE1*BRANDING*.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP PHASE1 BRANDING tidak ditemukan."
            echo ""
            echo "ZIP yang tersedia:"
            find . -type f -iname "*.zip" -print
            exit 1
          fi

          echo "ZIP ditemukan:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ============================================================
      # 7. EXTRACT PHASE 1 PROJECT
      # ============================================================
      - name: Extract Phase 1 project
        shell: bash
        run: |
          set -e

          echo "Extracting:"
          echo "$ZIP_FILE"

          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo ""
          echo "=========================================="
          echo "EXTRACTED FILES"
          echo "=========================================="

          find extracted -maxdepth 4 -type f | head -n 150


      # ============================================================
      # 8. LOCATE GRADLE PROJECT
      # ============================================================
      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          echo "Mencari settings.gradle.kts..."

          SETTINGS_FILE=$(find extracted \
            -type f \
            -name "settings.gradle.kts" \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts tidak ditemukan."
            echo ""
            echo "Isi extracted:"
            find extracted -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo ""
          echo "Gradle project ditemukan:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 9. VALIDATE PROJECT STRUCTURE
      # ============================================================
      - name: Validate Gradle project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "PROJECT DIRECTORY"
          echo "=========================================="

          pwd

          echo ""
          echo "Project files:"
          ls -lah

          echo ""
          echo "Validating..."

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo ""
          echo "Gradle project structure OK."


      # ============================================================
      # 10. CHECK ARS BRANDING
      # ============================================================
      - name: Check ARS branding
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "ARS BRANDING FILES"
          echo "=========================================="

          echo ""
          echo "Launcher icons:"
          find app/src/main/res \
            -type f \
            \( \
              -iname "*launcher*" \
              -o \
              -iname "ic_launcher*" \
            \) \
            -print || true

          echo ""
          echo "ARS background:"
          find app/src/main/res \
            -type f \
            -iname "*ars_background*" \
            -print || true

          echo ""
          echo "Android Manifest:"
          grep -n \
            "android:icon\|android:roundIcon" \
            app/src/main/AndroidManifest.xml || true


      # ============================================================
      # 11. CLEAN BUILD
      # ============================================================
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle clean \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 12. BUILD RELEASE APK
      # ============================================================
      - name: Build Release APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      # ============================================================
      # 13. CHECK APK OUTPUT
      # ============================================================
      - name: Check APK output
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "APK OUTPUT"
          echo "=========================================="

          find app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print

          echo ""
          echo "APK SIZE:"

          ls -lh app/build/outputs/apk/release/*.apk


      # ============================================================
      # 14. VERIFY APK SIGNATURE
      # ============================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          APK=$(find app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          echo "APK:"
          echo "$APK"

          echo ""
          echo "=========================================="
          echo "APK SIGNATURE"
          echo "=========================================="

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"


      # ============================================================
      # 15. VERIFY APK ALIGNMENT
      # ============================================================
      - name: Verify APK alignment
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          APK=$(find app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | head -n 1)

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -c \
            -P 16 \
            -v 4 \
            "$APK"


      # ============================================================
      # 16. PREPARE FINAL APK
      # ============================================================
      - name: Prepare final APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          APK=$(find app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          FINAL_APK="app/build/outputs/apk/release/ARS-POS-1.0.0-signed.apk"

          cp "$APK" "$FINAL_APK"

          echo ""
          echo "=========================================="
          echo "FINAL APK"
          echo "=========================================="

          ls -lh "$FINAL_APK"


      # ============================================================
      # 17. GENERATE SHA-256
      # ============================================================
      - name: Generate APK checksum
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR/app/build/outputs/apk/release"

          sha256sum ARS-POS-1.0.0-signed.apk \
            > ARS-POS-1.0.0-signed.apk.sha256

          echo ""
          echo "=========================================="
          echo "SHA-256"
          echo "=========================================="

          cat ARS-POS-1.0.0-signed.apk.sha256


      # ============================================================
      # 18. UPLOAD SIGNED APK
      # ============================================================
      - name: Upload signed APK
        uses: actions/upload-artifact@v7
        with:
          name: ARS-POS-1.0.0-SIGNED
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.0.0-signed.apk
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.0.0-signed.apk.sha256
          if-no-files-found: error
          retention-days: 30
