name: ARS POS Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build ARS POS Phase 4.3.2.17 Product Identity Engine V8 FIXED
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Locate Phase 4.3.2.17 V8 FIXED ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="./ARS_POS_PHASE4_3_2_17_PRODUCT_IDENTITY_ENGINE_V8_FIXED.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP V8 FIXED tidak ditemukan."
            echo "Daftar ZIP:"
            find . -maxdepth 3 -type f -iname '*.zip' -print
            exit 1
          fi

          echo "ZIP ditemukan:"
          ls -lh "$ZIP_FILE"

          unzip -t "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ARS POS project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=$(find extracted -type f -name "settings.gradle.kts" | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts tidak ditemukan."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Gradle project: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Validate V8 source files
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "VALIDASI ARS POS V8 FIXED"
          echo "========================================"

          test -f app/src/main/java/com/arspos/anglerriausyndicate/data/SmartRecognitionEngine.kt
          test -f app/src/main/java/com/arspos/anglerriausyndicate/data/RecognitionCandidate.kt
          test -f app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt
          test -f app/src/main/java/com/arspos/anglerriausyndicate/data/db/ArsDao.kt
          test -f app/src/main/java/com/arspos/anglerriausyndicate/ProductVisualMatcher.kt
          test -f app/src/main/java/com/arspos/anglerriausyndicate/SmartVisualScanner.kt
          test -f app/src/main/java/com/arspos/anglerriausyndicate/VisualScanObject.kt
          test -f app/src/main/java/com/arspos/anglerriausyndicate/data/ProductIdentityProfile.kt
          test -f app/src/main/java/com/arspos/anglerriausyndicate/data/ProductIdentityProfileCodec.kt
          test -f app/src/main/java/com/arspos/anglerriausyndicate/ProductMasterStudio.kt
          test -f app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt

          grep -q "MIN_TEXT_GATE" \
            app/src/main/java/com/arspos/anglerriausyndicate/data/SmartRecognitionEngine.kt

          grep -q "MIN_VISUAL_MARGIN" \
            app/src/main/java/com/arspos/anglerriausyndicate/data/SmartRecognitionEngine.kt

          grep -q "MIN_LONG_VISUAL_MARGIN" \
            app/src/main/java/com/arspos/anglerriausyndicate/data/SmartRecognitionEngine.kt

          grep -q "ACCEPT_VISUAL_ONLY" \
            app/src/main/java/com/arspos/anglerriausyndicate/data/SmartRecognitionEngine.kt

          grep -q "center82" \
            app/src/main/java/com/arspos/anglerriausyndicate/ProductVisualMatcher.kt

          grep -q "center68" \
            app/src/main/java/com/arspos/anglerriausyndicate/ProductVisualMatcher.kt

          grep -q "centerAgreement" \
            app/src/main/java/com/arspos/anglerriausyndicate/ProductVisualMatcher.kt

          grep -q "masterVerificationSettings" \
            app/src/main/java/com/arspos/anglerriausyndicate/data/db/ArsDao.kt

          grep -q "verifiedProductIds" \
            app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt

          grep -q "versionCode = 130" \
            app/build.gradle.kts

          grep -q 'versionName = "1.3.0"' \
            app/build.gradle.kts

          grep -q "isLongObject" \
            app/src/main/java/com/arspos/anglerriausyndicate/data/ProductIdentityProfile.kt

          grep -q "LONG_OBJECT" \
            PHASE4_3_2_17_PRODUCT_IDENTITY_ENGINE_V8.md

          grep -q "MAX_OBJECTS = 12" \
            app/src/main/java/com/arspos/anglerriausyndicate/SmartVisualScanner.kt

          grep -q "TAMBAH SEMUA KE KERANJANG" \
            app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt

          echo "V8 SOURCE VALIDATION OK"

      - name: Validate Kotlin source balance
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path

          pairs = {
              '{': '}',
              '(': ')',
              '[': ']'
          }

          reverse = {
              v: k for k, v in pairs.items()
          }

          def check(path):
              text = path.read_text(encoding="utf-8")

              stack = []
              i = 0
              line = 1

              line_comment = False
              block_comment = False
              string = False
              char = False
              escaped = False

              while i < len(text):
                  c = text[i]

                  if c == '\n':
                      line += 1
                      line_comment = False
                      i += 1
                      continue

                  if line_comment:
                      i += 1
                      continue

                  if block_comment:
                      if (
                          c == '*'
                          and i + 1 < len(text)
                          and text[i + 1] == '/'
                      ):
                          block_comment = False
                          i += 2
                      else:
                          i += 1
                      continue

                  if string:
                      if escaped:
                          escaped = False
                      elif c == '\\':
                          escaped = True
                      elif c == '"':
                          string = False

                      i += 1
                      continue

                  if char:
                      if escaped:
                          escaped = False
                      elif c == '\\':
                          escaped = True
                      elif c == "'":
                          char = False

                      i += 1
                      continue

                  if (
                      c == '/'
                      and i + 1 < len(text)
                      and text[i + 1] == '/'
                  ):
                      line_comment = True
                      i += 2
                      continue

                  if (
                      c == '/'
                      and i + 1 < len(text)
                      and text[i + 1] == '*'
                  ):
                      block_comment = True
                      i += 2
                      continue

                  if c == '"':
                      string = True
                      i += 1
                      continue

                  if c == "'":
                      char = True
                      i += 1
                      continue

                  if c in pairs:
                      stack.append((c, line))

                  elif c in reverse:
                      if (
                          not stack
                          or stack[-1][0] != reverse[c]
                      ):
                          raise SystemExit(
                              f"Mismatch in {path}:{line}"
                          )

                      stack.pop()

                  i += 1

              if (
                  string
                  or char
                  or block_comment
                  or stack
              ):
                  raise SystemExit(
                      f"Unbalanced Kotlin: {path}"
                  )

          files = list(
              Path("app/src/main/java").rglob("*.kt")
          )

          for path in files:
              check(path)

          print(
              f"KOTLIN BALANCE OK: {len(files)} files"
          )
          PY

      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle clean \
            --no-daemon \
            --stacktrace

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          APK=$(find \
            app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          echo "APK ditemukan:"
          ls -lh "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging "$APK" \
            | grep -q "package: name="

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -c \
            -P 16 \
            -v 4 \
            "$APK"

          echo "APK VERIFIED"

      - name: Rename APK and SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          APK=$(find \
            app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          OUT="app/build/outputs/apk/release/ARS-POS-1.3.0-PHASE4.3.2.17-PRODUCT-IDENTITY-ENGINE-V8-SIGNED.apk"

          cp "$APK" "$OUT"

          sha256sum "$OUT" > "$OUT.sha256"

          ls -lh \
            "$OUT" \
            "$OUT.sha256"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ARS-POS-1.3.0-PHASE4.3.2.17-V8

          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.3.0-PHASE4.3.2.17-PRODUCT-IDENTITY-ENGINE-V8-SIGNED.apk
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.3.0-PHASE4.3.2.17-PRODUCT-IDENTITY-ENGINE-V8-SIGNED.apk.sha256

          if-no-files-found: error
