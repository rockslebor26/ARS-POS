name: ARS POS Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ARS POS Phase 3.1 Rupiah
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v7


      # ============================================================
      # 2. SETUP JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. SETUP ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # ============================================================
      # 4. INSTALL ANDROID SDK
      # ============================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -f "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -f "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -f "$ANDROID_HOME/build-tools/35.0.0/aapt"

          echo "Android SDK OK."


      # ============================================================
      # 5. SETUP GRADLE 8.9
      # ============================================================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'


      # ============================================================
      # 6. SHOW REPOSITORY CONTENTS
      # ============================================================
      - name: Show repository contents
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "REPOSITORY"
          echo "=========================================="

          echo "Working directory:"
          pwd

          echo ""
          echo "Repository files:"
          ls -lah

          echo ""
          echo "ZIP files:"

          find . \
            -type f \
            -iname "*.zip" \
            -print


      # ============================================================
      # 7. REQUIRE LATEST PHASE 3.1 PROJECT ZIP
      # ============================================================
      - name: Require latest Phase 3.1 project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="./ARS_POS_PHASE3_1_RUPIAH_COMPLETE.zip"

          echo "=========================================="
          echo "ARS POS PHASE 3.1"
          echo "=========================================="

          if [ ! -f "$ZIP_FILE" ]; then

            echo "ERROR:"
            echo "$ZIP_FILE tidak ditemukan."

            echo ""
            echo "Upload ZIP Phase 3.1 terbaru ke root repository."

            echo ""
            echo "ZIP yang tersedia:"

            find . \
              -type f \
              -iname "*.zip" \
              -print

            exit 1
          fi

          echo ""
          echo "ZIP ditemukan:"
          echo "$ZIP_FILE"

          echo ""
          echo "Ukuran ZIP:"
          ls -lh "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ============================================================
      # 8. VERIFY ZIP INTEGRITY
      # ============================================================
      - name: Verify ZIP integrity
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFY ZIP"
          echo "=========================================="

          unzip -t "$ZIP_FILE"

          echo ""
          echo "ZIP integrity OK."


      # ============================================================
      # 9. EXTRACT ARS POS PROJECT
      # ============================================================
      - name: Extract ARS POS project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "EXTRACT ARS POS"
          echo "=========================================="

          rm -rf extracted

          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo ""
          echo "Project extracted successfully."

          echo ""
          echo "Project files:"

          find extracted \
            -maxdepth 5 \
            -type f \
            | sort \
            | head -n 250


      # ============================================================
      # 10. LOCATE GRADLE PROJECT
      # ============================================================
      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find extracted \
            -type f \
            -name "settings.gradle.kts" \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then

            echo "ERROR:"
            echo "settings.gradle.kts tidak ditemukan."

            echo ""
            echo "Isi extracted:"

            find extracted \
              -maxdepth 8 \
              -type f \
              | sort

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo ""
          echo "settings.gradle.kts:"
          echo "$SETTINGS_FILE"

          echo ""
          echo "Gradle project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 11. VALIDATE PROJECT STRUCTURE
      # ============================================================
      - name: Validate project structure
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "VALIDATE PROJECT"
          echo "=========================================="

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties

          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          test -f \
            app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt

          test -f \
            app/src/main/java/com/arspos/anglerriausyndicate/PosViewModel.kt

          test -f \
            app/src/main/java/com/arspos/anglerriausyndicate/Money.kt

          test -f \
            app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt

          test -f \
            app/src/main/java/com/arspos/anglerriausyndicate/data/PosRepository.kt

          echo ""
          echo "Project structure OK."


      # ============================================================
      # 12. VALIDATE RUPIAH FORMATTER
      # ============================================================
      - name: Validate Rupiah formatter
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          MONEY="app/src/main/java/com/arspos/anglerriausyndicate/Money.kt"
          MAIN="app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"
          RECEIPT="app/src/main/java/com/arspos/anglerriausyndicate/printer/EscPosReceipt.kt"

          echo "=========================================="
          echo "RUPIAH FORMATTER"
          echo "=========================================="

          echo ""
          echo "Checking Money.kt..."

          grep -n "formatRupiah" "$MONEY"

          grep -n \
            'Locale("id", "ID")' \
            "$MONEY"

          echo ""
          echo "Checking MainActivity..."

          grep -n \
            "formatRupiah" \
            "$MAIN"

          echo ""
          echo "Checking receipt..."

          grep -n \
            "formatRupiah" \
            "$RECEIPT"

          echo ""
          echo "Rupiah formatter validation OK."


      # ============================================================
      # 13. VALIDATE IMPORTANT RUPIAH FIELDS
      # ============================================================
      - name: Validate formatted money fields
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          MAIN="app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"

          echo "=========================================="
          echo "MONEY DISPLAY VALIDATION"
          echo "=========================================="

          echo ""
          echo "Dashboard / Report fields:"

          grep -n \
            "Omzet bersih.*formatRupiah" \
            "$MAIN"

          grep -n \
            "Saldo kas.*formatRupiah" \
            "$MAIN"

          grep -n \
            "Laba kotor.*formatRupiah" \
            "$MAIN"

          grep -n \
            "Modal.*formatRupiah" \
            "$MAIN"

          echo ""
          echo "Payment fields:"

          grep -n \
            "KEMBALIAN.*formatRupiah" \
            "$MAIN"

          grep -n \
            "UANG KURANG.*formatRupiah" \
            "$MAIN"

          grep -n \
            "Total:.*formatRupiah" \
            "$MAIN"

          grep -n \
            "Dibayar:.*formatRupiah" \
            "$MAIN"

          echo ""
          echo "Money display validation OK."


      # ============================================================
      # 14. VALIDATE PAYMENT + CART
      # ============================================================
      - name: Validate Phase 3 payment and cart
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          MAIN="app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"

          echo "=========================================="
          echo "PAYMENT VALIDATION"
          echo "=========================================="

          echo ""
          echo "Payment methods:"

          grep -n "CASH" "$MAIN"
          grep -n "QRIS" "$MAIN"
          grep -n "TRANSFER" "$MAIN"
          grep -n "DEBIT" "$MAIN"

          echo ""
          echo "Payment calculation:"

          grep -n "KEMBALIAN" "$MAIN"
          grep -n "UANG KURANG" "$MAIN"

          echo ""
          echo "Cart:"

          grep -n "KERANJANG" "$MAIN"
          grep -n "JUMLAH BARANG" "$MAIN"

          grep -n \
            "Icons.Default.Add" \
            "$MAIN"

          grep -n \
            "Icons.Default.Remove" \
            "$MAIN"

          grep -n \
            "Icons.Default.Delete" \
            "$MAIN"

          echo ""
          echo "Phase 3 payment + cart validation OK."


      # ============================================================
      # 15. VALIDATE ARS BRANDING
      # ============================================================
      - name: Validate ARS branding
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "ARS BRANDING"
          echo "=========================================="

          test -f \
            app/src/main/res/drawable/ars_background.png

          test -f \
            app/src/main/res/drawable/ars_logo_master.png

          echo "ARS background OK."
          echo "ARS logo OK."

          echo ""
          echo "Manifest icons:"

          grep -n \
            "android:icon\|android:roundIcon" \
            app/src/main/AndroidManifest.xml

          echo ""
          echo "Launcher files:"

          find app/src/main/res \
            -type f \
            \( \
              -iname "ic_launcher*" \
              -o \
              -iname "*launcher*" \
            \) \
            -print

          echo ""
          echo "ARS branding validation OK."


      # ============================================================
      # 16. VALIDATE RELEASE CONFIGURATION
      # ============================================================
      - name: Validate release configuration
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "RELEASE CONFIGURATION"
          echo "=========================================="

          echo ""
          echo "Version:"

          grep -n \
            "versionCode\|versionName" \
            app/build.gradle.kts

          echo ""
          echo "Signing:"

          grep -n \
            "signingConfig" \
            app/build.gradle.kts

          grep -n \
            'signingConfigs.getByName("debug")' \
            app/build.gradle.kts

          echo ""
          echo "Release configuration OK."


      # ============================================================
      # 17. SHOW BUILD ENVIRONMENT
      # ============================================================
      - name: Show build environment
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILD ENVIRONMENT"
          echo "=========================================="

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          gradle --version

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_HOME"


      # ============================================================
      # 18. CLEAN PROJECT
      # ============================================================
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "GRADLE CLEAN"
          echo "=========================================="

          gradle clean \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 19. BUILD RELEASE APK
      # ============================================================
      - name: Build Release APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "BUILD ARS POS 1.0.1"
          echo "=========================================="

          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

          echo ""
          echo "Build completed successfully."


      # ============================================================
      # 20. LOCATE APK
      # ============================================================
      - name: Locate APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          APK_DIR="app/build/outputs/apk/release"

          APK=$(find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          echo ""
          echo "APK ditemukan:"
          echo "$APK"

          echo ""
          echo "APK size:"
          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"


      # ============================================================
      # 21. VERIFY APK SIGNATURE
      # ============================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "VERIFY APK SIGNATURE"
          echo "=========================================="

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK_PATH"

          echo ""
          echo "Signature verification PASSED."


      # ============================================================
      # 22. VERIFY APK ALIGNMENT
      # ============================================================
      - name: Verify APK alignment
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "VERIFY APK ALIGNMENT"
          echo "=========================================="

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -c \
            -P 16 \
            -v 4 \
            "$APK_PATH"

          echo ""
          echo "Alignment verification PASSED."


      # ============================================================
      # 23. VERIFY APK PACKAGE + VERSION
      # ============================================================
      - name: Verify APK package and version
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "VERIFY APK PACKAGE"
          echo "=========================================="

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging \
            "$APK_PATH" \
            | grep -E \
              "package: name=|versionCode=|versionName="

          echo ""
          echo "Package verification PASSED."


      # ============================================================
      # 24. PREPARE FINAL APK
      # ============================================================
      - name: Prepare final APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          APK_DIR="app/build/outputs/apk/release"

          FINAL_APK="$APK_DIR/ARS-POS-1.0.1-RUPIAH-SIGNED.apk"

          cp "$APK_PATH" "$FINAL_APK"

          test -f "$FINAL_APK"

          echo ""
          echo "=========================================="
          echo "FINAL APK"
          echo "=========================================="

          ls -lh "$FINAL_APK"

          echo "FINAL_APK=$FINAL_APK" >> "$GITHUB_ENV"


      # ============================================================
      # 25. GENERATE SHA-256 CHECKSUM
      # ============================================================
      - name: Generate SHA-256 checksum
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR/app/build/outputs/apk/release"

          sha256sum \
            ARS-POS-1.0.1-RUPIAH-SIGNED.apk \
            > ARS-POS-1.0.1-RUPIAH-SIGNED.apk.sha256

          echo ""
          echo "=========================================="
          echo "SHA-256"
          echo "=========================================="

          cat \
            ARS-POS-1.0.1-RUPIAH-SIGNED.apk.sha256


      # ============================================================
      # 26. FINAL RELEASE CHECK
      # ============================================================
      - name: Final release check
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR/app/build/outputs/apk/release"

          test -f \
            ARS-POS-1.0.1-RUPIAH-SIGNED.apk

          test -f \
            ARS-POS-1.0.1-RUPIAH-SIGNED.apk.sha256

          echo ""
          echo "=========================================="
          echo "ARS POS PHASE 3.1 READY"
          echo "=========================================="

          echo ""
          echo "APK:"
          ls -lh \
            ARS-POS-1.0.1-RUPIAH-SIGNED.apk

          echo ""
          echo "SHA-256:"

          cat \
            ARS-POS-1.0.1-RUPIAH-SIGNED.apk.sha256

          echo ""
          echo "BUILD STATUS: READY"


      # ============================================================
      # 27. UPLOAD SIGNED APK
      # ============================================================
      - name: Upload signed APK
        uses: actions/upload-artifact@v7
        with:
          name: ARS-POS-1.0.1-RUPIAH-SIGNED

          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.0.1-RUPIAH-SIGNED.apk
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.0.1-RUPIAH-SIGNED.apk.sha256

          if-no-files-found: error

          retention-days: 30
