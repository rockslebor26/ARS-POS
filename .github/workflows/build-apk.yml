name: ARS POS Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build ARS POS Phase 4.3.2.17 Product Identity Engine V8
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v5


      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ============================================================
      # 4. GRADLE 8.9
      # ============================================================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'


      # ============================================================
      # 5. LOCATE V8 ZIP
      # ============================================================
      - name: Locate Phase 4.3.2.17 V8 ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="./ARS_POS_PHASE4_3_2_17_PRODUCT_IDENTITY_ENGINE_V8.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP V8 tidak ditemukan."
            echo "Daftar ZIP yang tersedia:"
            find . -maxdepth 3 -type f -iname '*.zip' -print
            exit 1
          fi

          echo "ZIP ditemukan:"
          ls -lh "$ZIP_FILE"

          unzip -t "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ============================================================
      # 6. EXTRACT PROJECT
      # ============================================================
      - name: Extract ARS POS project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "Isi hasil extract:"
          find extracted -maxdepth 3 -type f | head -100


      # ============================================================
      # 7. LOCATE GRADLE PROJECT
      # ============================================================
      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=$(find extracted -type f -name "settings.gradle.kts" | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts tidak ditemukan."
            find extracted -maxdepth 5 -type f -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Gradle project ditemukan:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 8. VALIDATE V8 SOURCE FILES
      # ============================================================
      - name: Validate V8 source files
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "VALIDASI FILE PHASE 4.3.2.17 V8"
          echo "========================================"

          # Core recognition engine
          test -f app/src/main/java/com/arspos/anglerriausyndicate/data/SmartRecognitionEngine.kt

          test -f app/src/main/java/com/arspos/anglerriausyndicate/data/RecognitionCandidate.kt

          test -f app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt

          # Database
          test -f app/src/main/java/com/arspos/anglerriausyndicate/data/db/ArsDao.kt

          # Visual recognition
          test -f app/src/main/java/com/arspos/anglerriausyndicate/ProductVisualMatcher.kt

          test -f app/src/main/java/com/arspos/anglerriausyndicate/SmartVisualScanner.kt

          test -f app/src/main/java/com/arspos/anglerriausyndicate/VisualScanObject.kt

          # Product identity
          test -f app/src/main/java/com/arspos/anglerriausyndicate/data/ProductIdentityProfile.kt

          test -f app/src/main/java/com/arspos/anglerriausyndicate/data/ProductIdentityProfileCodec.kt

          # Product master
          test -f app/src/main/java/com/arspos/anglerriausyndicate/ProductMasterStudio.kt

          # Main application
          test -f app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt

          echo "Semua file utama ditemukan."


          # ========================================================
          # CHECK RECOGNITION ENGINE
          # ========================================================

          grep -q "MIN_TEXT_GATE" \
            app/src/main/java/com/arspos/anglerriausyndicate/data/SmartRecognitionEngine.kt

          grep -q "MIN_VISUAL_MARGIN" \
            app/src/main/java/com/arspos/anglerriausyndicate/data/SmartRecognitionEngine.kt

          grep -q "MIN_LONG_VISUAL_MARGIN" \
            app/src/main/java/com/arspos/anglerriausyndicate/data/SmartRecognitionEngine.kt

          grep -q "ACCEPT_VISUAL_ONLY" \
            app/src/main/java/com/arspos/anglerriausyndicate/data/SmartRecognitionEngine.kt


          # ========================================================
          # CHECK VISUAL MATCHER
          # ========================================================

          grep -q "center82" \
            app/src/main/java/com/arspos/anglerriausyndicate/ProductVisualMatcher.kt

          grep -q "center68" \
            app/src/main/java/com/arspos/anglerriausyndicate/ProductVisualMatcher.kt

          grep -q "centerAgreement" \
            app/src/main/java/com/arspos/anglerriausyndicate/ProductVisualMatcher.kt


          # ========================================================
          # CHECK DATABASE
          # ========================================================

          grep -q "masterVerificationSettings" \
            app/src/main/java/com/arspos/anglerriausyndicate/data/db/ArsDao.kt

          grep -q "verifiedProductIds" \
            app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt


          # ========================================================
          # CHECK VERSION
          # ========================================================

          grep -q "versionCode = 130" \
            app/build.gradle.kts

          grep -q 'versionName = "1.3.0"' \
            app/build.gradle.kts


          # ========================================================
          # CHECK LONG OBJECT
          # ========================================================

          grep -q "isLongObject" \
            app/src/main/java/com/arspos/anglerriausyndicate/data/ProductIdentityProfile.kt

          grep -q "LONG_OBJECT" \
            PHASE4_3_2_17_PRODUCT_IDENTITY_ENGINE_V8.md


          # ========================================================
          # CHECK MULTI OBJECT SCANNER
          # ========================================================

          grep -q "MAX_OBJECTS = 12" \
            app/src/main/java/com/arspos/anglerriausyndicate/SmartVisualScanner.kt


          # ========================================================
          # CHECK SHOPPING CART
          # ========================================================

          grep -q "TAMBAH SEMUA KE KERANJANG" \
            app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt


          echo ""
          echo "========================================"
          echo "V8 SOURCE VALIDATION OK"
          echo "========================================"


      # ============================================================
      # 9. VALIDATE KOTLIN BALANCE
      # ============================================================
      - name: Validate Kotlin source balance
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path

          pairs = {
              '{': '}',
              '(': ')',
              '[': ']'
          }

          reverse = {
              v: k for k, v in pairs.items()
          }

          def check(path):

              text = path.read_text(encoding="utf-8")

              stack = []

              i = 0
              line = 1

              line_comment = False
              block_comment = False
              string = False
              char = False
              escaped = False

              while i < len(text):

                  c = text[i]

                  if c == '\n':
                      line += 1
                      line_comment = False
                      i += 1
                      continue

                  if line_comment:
                      i += 1
                      continue

                  if block_comment:

                      if (
                          c == '*'
                          and i + 1 < len(text)
                          and text[i + 1] == '/'
                      ):
                          block_comment = False
                          i += 2
                      else:
                          i += 1

                      continue

                  if string:

                      if escaped:
                          escaped = False

                      elif c == '\\':
                          escaped = True

                      elif c == '"':
                          string = False

                      i += 1
                      continue

                  if char:

                      if escaped:
                          escaped = False

                      elif c == '\\':
                          escaped = True

                      elif c == "'":
                          char = False

                      i += 1
                      continue

                  if (
                      c == '/'
                      and i + 1 < len(text)
                      and text[i + 1] == '/'
                  ):
                      line_comment = True
                      i += 2
                      continue

                  if (
                      c == '/'
                      and i + 1 < len(text)
                      and text[i + 1] == '*'
                  ):
                      block_comment = True
                      i += 2
                      continue

                  if c == '"':
                      string = True
                      i += 1
                      continue

                  if c == "'":
                      char = True
                      i += 1
                      continue

                  if c in pairs:
                      stack.append((c, line))

                  elif c in reverse:

                      if (
                          not stack
                          or stack[-1][0] != reverse[c]
                      ):
                          raise SystemExit(
                              f"Mismatch in {path}:{line}"
                          )

                      stack.pop()

                  i += 1

              if (
                  string
                  or char
                  or block_comment
                  or stack
              ):
                  raise SystemExit(
                      f"Unbalanced Kotlin: {path}"
                  )

          files = list(
              Path("app/src/main/java").rglob("*.kt")
          )

          for path in files:
              check(path)

          print(
              f"KOTLIN BALANCE OK: {len(files)} files"
          )

          PY


      # ============================================================
      # 10. CLEAN
      # ============================================================
      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle clean \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 11. BUILD RELEASE APK
      # ============================================================
      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      # ============================================================
      # 12. VERIFY APK
      # ============================================================
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          APK=$(find \
            app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            find app/build/outputs -type f -print || true
            exit 1
          fi

          echo "APK ditemukan:"
          ls -lh "$APK"


          # Android package check
          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging "$APK" \
            | grep -q "package: name="


          # Signature check
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"


          # Zip alignment check
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -c \
            -P 16 \
            -v 4 \
            "$APK"


          echo ""
          echo "========================================"
          echo "APK VERIFIED"
          echo "========================================"


      # ============================================================
      # 13. RENAME + SHA256
      # ============================================================
      - name: Rename APK and SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          APK=$(find \
            app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          OUT="app/build/outputs/apk/release/ARS-POS-1.3.0-PHASE4.3.2.17-PRODUCT-IDENTITY-ENGINE-V8-SIGNED.apk"

          cp "$APK" "$OUT"

          sha256sum "$OUT" > "$OUT.sha256"

          echo ""
          echo "========================================"
          echo "FINAL APK"
          echo "========================================"

          ls -lh \
            "$OUT" \
            "$OUT.sha256"


      # ============================================================
      # 14. UPLOAD ARTIFACT
      # ============================================================
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ARS-POS-1.3.0-PHASE4.3.2.17-V8

          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.3.0-PHASE4.3.2.17-PRODUCT-IDENTITY-ENGINE-V8-SIGNED.apk
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.3.0-PHASE4.3.2.17-PRODUCT-IDENTITY-ENGINE-V8-SIGNED.apk.sha256

          if-no-files-found: error
