name: ARS POS Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build ARS POS Phase 4.3.2.24 V8.4.4 FIX1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -f "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -f "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -f "$ANDROID_HOME/build-tools/35.0.0/aapt"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Locate V8.4.4 source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="./ARS_POS_PHASE4_3_2_24_V8_4_4_CRASH_SHIELD_FLIGHT_RECORDER.zip"

          test -f "$ZIP_FILE" || {
            echo "ERROR: ZIP V8.4.4 tidak ditemukan: $ZIP_FILE"
            find . -maxdepth 3 -type f -iname '*.zip' -print
            exit 1
          }

          unzip -t "$ZIP_FILE"

          unzip -l "$ZIP_FILE" | grep -q \
            'app/src/main/java/com/arspos/anglerriausyndicate/data/ProductIdentityProfile.kt'

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ARS POS project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=$(find extracted -type f -name 'settings.gradle.kts' | head -n 1)

          test -n "$SETTINGS" || {
            echo "ERROR: settings.gradle.kts tidak ditemukan"
            exit 1
          }

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Gradle project: $PROJECT_DIR"

      - name: Validate V8.4.4 source files
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          PKG="app/src/main/java/com/arspos/anglerriausyndicate"

          REQUIRED=(
            "settings.gradle.kts"
            "build.gradle.kts"
            "gradle.properties"
            "app/build.gradle.kts"

            "app/src/main/AndroidManifest.xml"
            "app/src/main/res/xml/file_paths.xml"

            "$PKG/MainActivity.kt"
            "$PKG/PosViewModel.kt"
            "$PKG/ArsFlightRecorder.kt"
            "$PKG/ArsDevCenter.kt"
            "$PKG/BitmapSafety.kt"
            "$PKG/ProductMasterStudio.kt"
            "$PKG/FullscreenMasterCamera.kt"
            "$PKG/RodFocusProcessor.kt"
            "$PKG/SmartVisualScanner.kt"
            "$PKG/LongObjectAnalyzer.kt"
            "$PKG/ProductVisualMatcher.kt"
            "$PKG/VisualScanObject.kt"

            "$PKG/data/ProductionRepository.kt"
            "$PKG/data/SmartRecognitionEngine.kt"
            "$PKG/data/RecognitionCandidate.kt"
            "$PKG/data/ProductIdentityProfile.kt"
            "$PKG/data/ProductIdentityProfileCodec.kt"
            "$PKG/data/MasterVerificationResult.kt"

            "$PKG/data/db/ArsDao.kt"
            "$PKG/data/db/ArsDatabase.kt"
            "$PKG/data/db/ProductEntity.kt"
            "$PKG/data/db/ProductPhotoEntity.kt"

            "PHASE4_3_2_24_V8_4_4_CRASH_SHIELD_FLIGHT_RECORDER.md"
          )

          for FILE in "${REQUIRED[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "MISSING: $FILE"

              echo ""
              echo "ISI PACKAGE DIRECTORY:"
              find "$PKG" -maxdepth 3 -type f | sort || true

              exit 1
            fi
          done

          grep -q 'versionCode = 139' \
            app/build.gradle.kts

          grep -q 'versionName = "1.3.9"' \
            app/build.gradle.kts

          MAIN="$PKG/MainActivity.kt"
          VM="$PKG/PosViewModel.kt"
          REPO="$PKG/data/ProductionRepository.kt"
          MATCHER="$PKG/ProductVisualMatcher.kt"
          FLIGHT="$PKG/ArsFlightRecorder.kt"
          DEV="$PKG/ArsDevCenter.kt"
          BITMAP="$PKG/BitmapSafety.kt"

          grep -q 'ArsFlightRecorder.install' "$MAIN"

          grep -q 'BitmapSafety.scaledForScan' "$MAIN"

          grep -q 'catch (oom: OutOfMemoryError)' "$MAIN"

          grep -q 'ARS DEV CENTER' "$MAIN"

          grep -q 'Phase 4.3.2.24 V8.4.4' "$MAIN"

          grep -q 'diagnosticSession' "$VM"

          grep -q 'selectRecognitionReferences' "$REPO"

          grep -q 'SCAN_PIPELINE' "$REPO"

          grep -q 'SCAN_OBJECT' "$REPO"

          grep -q 'MASTER_VERIFY' "$REPO"

          grep -q 'existing.take(8)' "$REPO"

          grep -q 'loadReferenceBank' "$MATCHER"

          grep -q 'BitmapSafety.MATCH_MAX_DIMENSION' "$MATCHER"

          grep -q 'bitmap.recycle' "$MATCHER"

          grep -q 'UNCAUGHT_CRASH' "$FLIGHT"

          grep -q 'flight_recorder.jsonl' "$FLIGHT"

          grep -q 'MAX_REPORT_LINES' "$FLIGHT"

          grep -q 'CHATGPT REPORT' "$DEV"

          grep -q 'com.openai.chatgpt' "$DEV"

          grep -q 'SCAN_MAX_DIMENSION = 1024' "$BITMAP"

          grep -q 'MATCH_MAX_DIMENSION = 720' "$BITMAP"

          grep -q 'TAMBAH SEMUA KE KERANJANG' "$MAIN"

          echo ""
          echo "========================================"
          echo "V8.4.4 FIX1 SOURCE VALIDATION OK"
          echo "========================================"

      - name: Validate Kotlin source balance
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path

          pairs = {
              '{': '}',
              '(': ')',
              '[': ']'
          }

          reverse = {
              v: k for k, v in pairs.items()
          }

          def check(path):
              text = path.read_text(encoding='utf-8')

              stack = []
              i = 0
              line = 1

              line_comment = False
              block_comment = False
              string = False
              char = False
              escaped = False

              while i < len(text):
                  c = text[i]

                  if c == '\n':
                      line += 1
                      line_comment = False
                      i += 1
                      continue

                  if line_comment:
                      i += 1
                      continue

                  if block_comment:
                      if (
                          c == '*'
                          and i + 1 < len(text)
                          and text[i + 1] == '/'
                      ):
                          block_comment = False
                          i += 2
                      else:
                          i += 1
                      continue

                  if string:
                      if escaped:
                          escaped = False
                      elif c == '\\':
                          escaped = True
                      elif c == '"':
                          string = False

                      i += 1
                      continue

                  if char:
                      if escaped:
                          escaped = False
                      elif c == '\\':
                          escaped = True
                      elif c == "'":
                          char = False

                      i += 1
                      continue

                  if (
                      c == '/'
                      and i + 1 < len(text)
                      and text[i + 1] == '/'
                  ):
                      line_comment = True
                      i += 2
                      continue

                  if (
                      c == '/'
                      and i + 1 < len(text)
                      and text[i + 1] == '*'
                  ):
                      block_comment = True
                      i += 2
                      continue

                  if c == '"':
                      string = True
                      i += 1
                      continue

                  if c == "'":
                      char = True
                      i += 1
                      continue

                  if c in pairs:
                      stack.append((c, line))

                  elif c in reverse:
                      if (
                          not stack
                          or stack[-1][0] != reverse[c]
                      ):
                          raise SystemExit(
                              f"Mismatch in {path}:{line}"
                          )

                      stack.pop()

                  i += 1

              if (
                  string
                  or char
                  or block_comment
                  or stack
              ):
                  raise SystemExit(
                      f"Unbalanced Kotlin: {path}"
                  )

          files = list(
              Path('app/src/main/java').rglob('*.kt')
          )

          for path in files:
              check(path)

          print(
              f"KOTLIN BALANCE OK: {len(files)} files"
          )
          PY

      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle clean \
            --no-daemon \
            --stacktrace

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          APK=$(find \
            app/build/outputs/apk/release \
            -type f \
            -name '*.apk' \
            | head -n 1)

          test -n "$APK" || {
            echo "ERROR: APK tidak ditemukan"
            exit 1
          }

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging "$APK" \
            | grep -q 'package: name='

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -c \
            -P 16 \
            -v 4 \
            "$APK"

          echo ""
          echo "========================================"
          echo "APK VERIFIED"
          echo "========================================"

      - name: Rename APK and SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          APK=$(find \
            app/build/outputs/apk/release \
            -type f \
            -name '*.apk' \
            | head -n 1)

          test -n "$APK"

          OUT="app/build/outputs/apk/release/ARS-POS-1.3.9-PHASE4.3.2.24-V8.4.4-FIX1-SIGNED.apk"

          cp "$APK" "$OUT"

          sha256sum "$OUT" > "$OUT.sha256"

          ls -lh \
            "$OUT" \
            "$OUT.sha256"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4

        with:
          name: ARS-POS-1.3.9-PHASE4.3.2.24-V8.4.4-FIX1

          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.3.9-PHASE4.3.2.24-V8.4.4-FIX1-SIGNED.apk
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.3.9-PHASE4.3.2.24-V8.4.4-FIX1-SIGNED.apk.sha256

          if-no-files-found: error
