name: ARS POS Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ARS POS Phase 3.2 Payment
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v7


      # ============================================================
      # 2. SETUP JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. SETUP ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # ============================================================
      # 4. INSTALL ANDROID SDK PACKAGES
      # ============================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

          test -f "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -f "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -f "$ANDROID_HOME/build-tools/35.0.0/aapt"


      # ============================================================
      # 5. SETUP GRADLE 8.9
      # ============================================================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'


      # ============================================================
      # 6. CHECK REPOSITORY
      # ============================================================
      - name: Check repository files
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ARS POS REPOSITORY"
          echo "=========================================="

          pwd

          echo ""
          echo "Repository contents:"
          ls -lah

          echo ""
          echo "ZIP FILES:"
          find . -type f -iname "*.zip" -print


      # ============================================================
      # 7. REQUIRE PHASE 3.2 PROJECT ZIP
      # ============================================================
      - name: Require Phase 3.2 project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="./ARS_POS_PHASE3_2_PAYMENT_COMPLETE.zip"

          echo "=========================================="
          echo "CHECK PHASE 3.2 ZIP"
          echo "=========================================="

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR:"
            echo "$ZIP_FILE tidak ditemukan."

            echo ""
            echo "Upload ZIP Phase 3.2 terbaru ke ROOT repository."

            echo ""
            echo "ZIP yang tersedia:"
            find . -type f -iname "*.zip" -print

            exit 1
          fi

          echo "ZIP ditemukan:"
          ls -lh "$ZIP_FILE"

          echo ""
          echo "Testing ZIP integrity..."

          unzip -t "$ZIP_FILE"

          echo ""
          echo "ZIP integrity OK."

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ============================================================
      # 8. EXTRACT ARS POS PROJECT
      # ============================================================
      - name: Extract ARS POS project
        shell: bash
        run: |
          set -e

          rm -rf extracted

          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo ""
          echo "Project extracted successfully."


      # ============================================================
      # 9. LOCATE GRADLE PROJECT
      # ============================================================
      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find extracted \
            -type f \
            -name "settings.gradle.kts" \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then

            echo "ERROR:"
            echo "settings.gradle.kts tidak ditemukan."

            echo ""
            echo "Isi extracted project:"

            find extracted \
              -maxdepth 8 \
              -type f \
              | sort

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Gradle project ditemukan:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 10. VALIDATE PHASE 3.2 SOURCES
      # ============================================================
      - name: Validate Phase 3.2 sources
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "VALIDATE PROJECT STRUCTURE"
          echo "=========================================="

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties

          test -f app/build.gradle.kts

          test -f app/src/main/AndroidManifest.xml

          test -f \
            app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt

          test -f \
            app/src/main/java/com/arspos/anglerriausyndicate/PosViewModel.kt

          test -f \
            app/src/main/java/com/arspos/anglerriausyndicate/Money.kt

          test -f \
            app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt

          test -f \
            app/src/main/java/com/arspos/anglerriausyndicate/printer/EscPosReceipt.kt

          echo ""
          echo "Project structure OK."


      # ============================================================
      # 11. VALIDATE PAYMENT FEATURES
      # ============================================================
      - name: Validate Phase 3.2 payment features
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          MAIN="app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"
          REPO="app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"
          MONEY="app/src/main/java/com/arspos/anglerriausyndicate/Money.kt"

          echo "=========================================="
          echo "PAYMENT FEATURES"
          echo "=========================================="

          echo ""
          echo "Processing protection:"
          grep -n "processingPayment" "$MAIN"

          echo ""
          echo "UANG PAS:"
          grep -n "UANG PAS" "$MAIN"

          echo ""
          echo "Quick payment:"
          grep -n 'Rp 50.000' "$MAIN"
          grep -n 'Rp 100.000' "$MAIN"
          grep -n 'Rp 200.000' "$MAIN"
          grep -n 'Rp 500.000' "$MAIN"

          echo ""
          echo "Payment processing:"
          grep -n "MEMPROSES" "$MAIN"

          echo ""
          echo "Payment methods:"
          grep -n "CASH" "$MAIN"
          grep -n "QRIS" "$MAIN"
          grep -n "TRANSFER" "$MAIN"
          grep -n "DEBIT" "$MAIN"

          echo ""
          echo "Payment calculation:"
          grep -n "UANG KURANG" "$MAIN"
          grep -n "KEMBALIAN" "$MAIN"

          echo ""
          echo "Payment feature validation OK."


      # ============================================================
      # 12. VALIDATE RUPIAH FORMATTER
      # ============================================================
      - name: Validate Rupiah formatter
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          MONEY="app/src/main/java/com/arspos/anglerriausyndicate/Money.kt"
          MAIN="app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"

          echo "=========================================="
          echo "RUPIAH FORMATTER"
          echo "=========================================="

          echo ""
          echo "Money.kt:"
          grep -n "formatRupiah" "$MONEY"

          echo ""
          echo "MainActivity.kt:"
          grep -n "formatRupiah" "$MAIN"

          echo ""
          echo "Checking Indonesian locale:"
          grep -n 'Locale("id", "ID")' "$MONEY"

          echo ""
          echo "Rupiah formatter validation OK."


      # ============================================================
      # 13. VALIDATE TRANSACTION SAFETY
      # ============================================================
      - name: Validate transaction safety
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          REPO="app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"

          echo "=========================================="
          echo "TRANSACTION SAFETY"
          echo "=========================================="

          echo ""
          echo "Database transaction:"
          grep -n "db.withTransaction" "$REPO"

          echo ""
          echo "Invoice timestamp:"
          grep -n "yyyyMMdd-HHmmssSSS" "$REPO"

          echo ""
          echo "Stock change:"
          grep -n "dao.changeStock" "$REPO"

          echo ""
          echo "Transaction safety validation OK."


      # ============================================================
      # 14. CHECK VERSION
      # ============================================================
      - name: Check ARS POS version
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "ARS POS VERSION"
          echo "=========================================="

          grep -n \
            "versionCode\|versionName" \
            app/build.gradle.kts


      # ============================================================
      # 15. CHECK ARS BRANDING
      # ============================================================
      - name: Validate ARS branding
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "ARS BRANDING"
          echo "=========================================="

          test -f \
            app/src/main/res/drawable/ars_background.png

          test -f \
            app/src/main/res/drawable/ars_logo_master.png

          echo ""
          echo "Manifest icon:"
          grep -n \
            "android:icon\|android:roundIcon" \
            app/src/main/AndroidManifest.xml

          echo ""
          echo "Launcher files:"
          find app/src/main/res \
            -type f \
            \( -iname "ic_launcher*" -o -iname "*launcher*" \) \
            -print

          echo ""
          echo "ARS branding validation OK."


      # ============================================================
      # 16. BUILD ENVIRONMENT
      # ============================================================
      - name: Show build environment
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "JAVA"
          echo "=========================================="

          java -version

          echo ""
          echo "=========================================="
          echo "GRADLE"
          echo "=========================================="

          gradle --version

          echo ""
          echo "=========================================="
          echo "ANDROID HOME"
          echo "=========================================="

          echo "$ANDROID_HOME"


      # ============================================================
      # 17. CLEAN PROJECT
      # ============================================================
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle clean \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 18. BUILD RELEASE APK
      # ============================================================
      - name: Build Release APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      # ============================================================
      # 19. LOCATE APK
      # ============================================================
      - name: Locate APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          APK_DIR="app/build/outputs/apk/release"

          APK=$(find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."

            find app/build/outputs \
              -type f \
              | sort

            exit 1
          fi

          echo ""
          echo "APK ditemukan:"
          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"


      # ============================================================
      # 20. VERIFY APK SIGNATURE
      # ============================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "APK SIGNATURE"
          echo "=========================================="

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK_PATH"

          echo ""
          echo "Signature verification PASSED."


      # ============================================================
      # 21. VERIFY APK ALIGNMENT
      # ============================================================
      - name: Verify APK alignment
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "APK ALIGNMENT"
          echo "=========================================="

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -c \
            -P 16 \
            -v 4 \
            "$APK_PATH"

          echo ""
          echo "Alignment verification PASSED."


      # ============================================================
      # 22. VERIFY PACKAGE AND VERSION
      # ============================================================
      - name: Verify APK package and version
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "APK PACKAGE / VERSION"
          echo "=========================================="

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging \
            "$APK_PATH" \
            | grep -E \
            "package: name=|versionCode=|versionName="

          echo ""
          echo "Package verification PASSED."


      # ============================================================
      # 23. PREPARE FINAL APK
      # ============================================================
      - name: Prepare final APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          APK_DIR="app/build/outputs/apk/release"

          FINAL_APK="$APK_DIR/ARS-POS-1.0.2-PAYMENT-SIGNED.apk"

          cp "$APK_PATH" "$FINAL_APK"

          test -f "$FINAL_APK"

          echo ""
          echo "Final APK:"
          ls -lh "$FINAL_APK"

          echo ""
          echo "Generating SHA-256..."

          sha256sum "$FINAL_APK" \
            > "$FINAL_APK.sha256"

          echo ""
          cat "$FINAL_APK.sha256"


      # ============================================================
      # 24. FINAL RELEASE CHECK
      # ============================================================
      - name: Final release check
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR/app/build/outputs/apk/release"

          test -f \
            ARS-POS-1.0.2-PAYMENT-SIGNED.apk

          test -f \
            ARS-POS-1.0.2-PAYMENT-SIGNED.apk.sha256

          echo ""
          echo "=========================================="
          echo "ARS POS PHASE 3.2 READY"
          echo "=========================================="

          ls -lh \
            ARS-POS-1.0.2-PAYMENT-SIGNED.apk

          echo ""

          cat \
            ARS-POS-1.0.2-PAYMENT-SIGNED.apk.sha256


      # ============================================================
      # 25. UPLOAD SIGNED APK
      # ============================================================
      - name: Upload signed APK
        uses: actions/upload-artifact@v7
        with:
          name: ARS-POS-1.0.2-PAYMENT-SIGNED

          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.0.2-PAYMENT-SIGNED.apk
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.0.2-PAYMENT-SIGNED.apk.sha256

          if-no-files-found: error

          retention-days: 30
