name: ARS POS Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ARS POS Phase 4.3.1
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # 4. ANDROID SDK 35
      # ============================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

          test -f "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -f "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -f "$ANDROID_HOME/build-tools/35.0.0/aapt"


      # ============================================================
      # 5. GRADLE 8.9
      # ============================================================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      # ============================================================
      # 6. SHOW BUILD ENVIRONMENT
      # ============================================================
      - name: Show build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "ARS POS PHASE 4.3.1"
          echo "SMART RECOGNITION + OCR"
          echo "=========================================="

          java -version
          gradle --version

          echo ""
          echo "ANDROID_HOME=$ANDROID_HOME"

          echo ""
          echo "Repository:"
          pwd
          ls -lah


      # ============================================================
      # 7. CHECK ZIP PHASE 4.3.1
      # ============================================================
      - name: Check Phase 4.3.1 ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="./ARS_POS_PHASE4_3_1_SMART_RECOGNITION_OCR_FIXED.zip"

          echo "Checking:"
          echo "$ZIP_FILE"

          if [ ! -f "$ZIP_FILE" ]; then
            echo ""
            echo "ERROR:"
            echo "ZIP Phase 4.3.1 tidak ditemukan."

            echo ""
            echo "ZIP yang tersedia:"
            find . -maxdepth 2 -type f -iname "*.zip" -print

            exit 1
          fi

          echo ""
          echo "ZIP ditemukan:"
          ls -lh "$ZIP_FILE"

          echo ""
          echo "Testing ZIP:"
          unzip -t "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ============================================================
      # 8. EXTRACT PROJECT
      # ============================================================
      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo ""
          echo "Project extracted."


      # ============================================================
      # 9. LOCATE GRADLE PROJECT
      # ============================================================
      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=$(find extracted \
            -type f \
            -name "settings.gradle.kts" \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts tidak ditemukan."

            find extracted \
              -maxdepth 8 \
              -type f \
              | sort

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Gradle project:"
          echo "$PROJECT_DIR"


      # ============================================================
      # 10. VALIDATE PHASE 4.3.1 SOURCES
      # ============================================================
      - name: Validate Phase 4.3.1 sources
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "VALIDATE PHASE 4.3.1 SOURCES"
          echo "=========================================="

          REQUIRED=(
            "settings.gradle.kts"
            "build.gradle.kts"
            "gradle.properties"
            "app/build.gradle.kts"

            "app/src/main/AndroidManifest.xml"

            "app/src/main/res/xml/file_paths.xml"

            "app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/PosViewModel.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/Money.kt"

            "app/src/main/java/com/arspos/anglerriausyndicate/ProductVisualMatcher.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/VisualProductMatch.kt"

            "app/src/main/java/com/arspos/anglerriausyndicate/VisualScanObject.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/SmartVisualScanner.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/SmartProductInput.kt"

            "app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"

            "app/src/main/java/com/arspos/anglerriausyndicate/data/db/ArsDatabase.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/data/db/ArsDao.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/data/db/ProductEntity.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/data/db/ProductPhotoEntity.kt"
          )

          for f in "${REQUIRED[@]}"; do
            if [ ! -f "$f" ]; then
              echo "MISSING: $f"
              exit 1
            fi

            echo "OK: $f"
          done

          echo ""
          echo "Source structure OK."


      # ============================================================
      # 11. CAMERA + FRESH SCAN
      # ============================================================
      - name: Validate camera and fresh scan
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          MAIN="app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"
          MANIFEST="app/src/main/AndroidManifest.xml"
          PATHS="app/src/main/res/xml/file_paths.xml"

          echo "=========================================="
          echo "CAMERA + FRESH SCAN VALIDATION"
          echo "=========================================="

          grep -q 'ActivityResultContracts.TakePicture()' "$MAIN"

          grep -q 'Manifest.permission.CAMERA' "$MAIN"

          grep -q 'FileProvider' "$MANIFEST"

          grep -q 'file_paths' "$MANIFEST"

          grep -q 'camera_capture' "$PATHS"

          grep -q 'fun openVisualScanner' "$MAIN"

          grep -q 'visualMatches = emptyList()' "$MAIN"

          grep -q 'smartScanObjects = emptyList()' "$MAIN"

          grep -q 'scanPreview = null' "$MAIN"

          if grep -q 'TakePicturePreview' "$MAIN"; then
            echo "ERROR: TakePicturePreview masih digunakan."
            exit 1
          fi

          echo ""
          echo "Camera + fresh scan validation OK."


      # ============================================================
      # 12. SMART RECOGNITION + OCR + BARCODE
      # ============================================================
      - name: Validate smart recognition and OCR
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          MAIN="app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"
          SCANNER="app/src/main/java/com/arspos/anglerriausyndicate/SmartVisualScanner.kt"
          INPUT="app/src/main/java/com/arspos/anglerriausyndicate/SmartProductInput.kt"
          REPO="app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"
          GRADLE="app/build.gradle.kts"

          echo "=========================================="
          echo "SMART RECOGNITION + OCR + BARCODE"
          echo "=========================================="

          # ML Kit Object Detection
          grep -q \
            'com.google.mlkit:object-detection:17.0.2' \
            "$GRADLE"

          # ML Kit Text Recognition
          grep -q \
            'com.google.mlkit:text-recognition:16.0.1' \
            "$GRADLE"

          # ML Kit Barcode
          grep -q \
            'com.google.mlkit:barcode-scanning:17.3.0' \
            "$GRADLE"

          # Multi-object detection
          grep -q \
            'enableMultipleObjects' \
            "$SCANNER"

          # Single image mode
          grep -q \
            'SINGLE_IMAGE_MODE' \
            "$SCANNER"

          # Strict recognition threshold
          grep -q \
            'MIN_SCORE = 82' \
            "$SCANNER"

          # Minimum score margin
          grep -q \
            'MIN_MARGIN = 8' \
            "$SCANNER"

          # Maximum five objects
          grep -q \
            'take(MAX_OBJECTS)' \
            "$SCANNER"

          # Smart product input
          grep -q \
            'SmartProductInput.analyze' \
            "$MAIN"

          # Automatic SKU
          grep -q \
            'SmartProductInput.generateSku' \
            "$MAIN"

          # OCR
          grep -q \
            'TextRecognition' \
            "$INPUT"

          # Barcode
          grep -q \
            'BarcodeScanning' \
            "$INPUT"

          # Repository integration
          grep -q \
            'smartVisualScan' \
            "$REPO"

          echo ""
          echo "Smart recognition + OCR/barcode validation OK."


      # ============================================================
      # 13. PRODUCT FORM IMPROVEMENTS
      # ============================================================
      - name: Validate product form improvements
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          MAIN="app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"

          echo "=========================================="
          echo "PRODUCT FORM VALIDATION"
          echo "=========================================="

          # Scrollable product form
          grep -q \
            'heightIn(max = 560.dp)' \
            "$MAIN"

          # OCR result section
          grep -q \
            'HASIL BACA FOTO' \
            "$MAIN"

          # Brand field
          grep -q \
            'Merek' \
            "$MAIN"

          # Variant/model field
          grep -q \
            'Varian / Model' \
            "$MAIN"

          # OCR button
          grep -q \
            'BACA FOTO' \
            "$MAIN"

          # Save button
          grep -q \
            'SIMPAN' \
            "$MAIN"

          echo ""
          echo "Product form UI validation OK."


      # ============================================================
      # 14. EXISTING POS FEATURES
      # ============================================================
      - name: Validate existing POS features
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          MAIN="app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"

          REPO="app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"

          MONEY="app/src/main/java/com/arspos/anglerriausyndicate/Money.kt"

          echo "=========================================="
          echo "EXISTING POS VALIDATION"
          echo "=========================================="

          grep -q 'CASH' "$MAIN"

          grep -q 'QRIS' "$MAIN"

          grep -q 'TRANSFER' "$MAIN"

          grep -q 'DEBIT' "$MAIN"

          grep -q 'processingPayment' "$MAIN"

          grep -q 'formatRupiah' "$MAIN"

          grep -q 'Locale("id", "ID")' "$MONEY"

          grep -q 'db.withTransaction' "$REPO"

          grep -q 'dao.changeStock' "$REPO"

          echo ""
          echo "Existing POS validation OK."


      # ============================================================
      # 15. VERSION 1.0.9
      # ============================================================
      - name: Validate version 1.0.9
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          grep -q \
            'versionCode = 109' \
            app/build.gradle.kts

          grep -q \
            'versionName = "1.0.9"' \
            app/build.gradle.kts

          echo ""
          echo "Version 1.0.9 OK."


      # ============================================================
      # 16. BRANDING ARS
      # ============================================================
      - name: Validate branding
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "ARS BRANDING VALIDATION"
          echo "=========================================="

          test -f \
            app/src/main/res/drawable/ars_background.png

          test -f \
            app/src/main/res/drawable/ars_logo_master.png

          test -f \
            app/src/main/res/mipmap-mdpi/ic_launcher.png

          test -f \
            app/src/main/res/mipmap-hdpi/ic_launcher.png

          test -f \
            app/src/main/res/mipmap-xhdpi/ic_launcher.png

          test -f \
            app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          test -f \
            app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          grep -q \
            'android:icon' \
            app/src/main/AndroidManifest.xml

          grep -q \
            'android:roundIcon' \
            app/src/main/AndroidManifest.xml

          echo ""
          echo "Branding validation OK."


      # ============================================================
      # 17. CLEAN PROJECT
      # ============================================================
      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle clean \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 18. BUILD RELEASE APK
      # ============================================================
      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      # ============================================================
      # 19. FIND + VERIFY APK
      # ============================================================
      - name: Verify and prepare APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          APK=$(find \
            app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."

            find \
              app/build/outputs \
              -type f \
              | sort

            exit 1
          fi

          echo ""
          echo "APK ditemukan:"
          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"


          # --------------------------------------------------------
          # APK SIGNATURE
          # --------------------------------------------------------
          echo ""
          echo "Verifying APK signature..."

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"


          # --------------------------------------------------------
          # APK ALIGNMENT
          # --------------------------------------------------------
          echo ""
          echo "Verifying APK alignment..."

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -c \
            -P 16 \
            -v 4 \
            "$APK"


          # --------------------------------------------------------
          # PACKAGE + VERSION
          # --------------------------------------------------------
          echo ""
          echo "Verifying package and version..."

          BADGING=$(
            "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging \
            "$APK"
          )

          echo "$BADGING" \
            | grep -E \
            'package: name=|versionCode=|versionName='

          echo "$BADGING" \
            | grep -q \
            "name='com.arspos.anglerriausyndicate'"

          echo "$BADGING" \
            | grep -q \
            "versionCode='109'"

          echo "$BADGING" \
            | grep -q \
            "versionName='1.0.9'"


          # --------------------------------------------------------
          # FINAL APK NAME
          # --------------------------------------------------------
          FINAL="app/build/outputs/apk/release/ARS-POS-1.0.9-PHASE4.3.1-SMART-PRODUCT-RECOGNITION-OCR-SIGNED.apk"

          cp "$APK" "$FINAL"


          # --------------------------------------------------------
          # SHA-256
          # --------------------------------------------------------
          sha256sum "$FINAL" \
            > "$FINAL.sha256"

          echo "FINAL_APK=$FINAL" >> "$GITHUB_ENV"

          echo ""
          echo "=========================================="
          echo "FINAL APK"
          echo "=========================================="

          ls -lh \
            "$FINAL" \
            "$FINAL.sha256"

          echo ""
          echo "SHA-256:"

          cat "$FINAL.sha256"


      # ============================================================
      # 20. FINAL RELEASE CHECK
      # ============================================================
      - name: Final release check
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR/app/build/outputs/apk/release"

          APK="ARS-POS-1.0.9-PHASE4.3.1-SMART-PRODUCT-RECOGNITION-OCR-SIGNED.apk"

          SHA="$APK.sha256"

          test -s "$APK"

          test -s "$SHA"

          echo ""
          echo "=========================================="
          echo "ARS POS PHASE 4.3.1 READY"
          echo "=========================================="

          echo ""
          echo "APK:"
          ls -lh "$APK"

          echo ""
          echo "SHA-256:"
          cat "$SHA"


      # ============================================================
      # 21. UPLOAD ARTIFACT
      # ============================================================
      - name: Upload signed APK
        uses: actions/upload-artifact@v4

        with:
          name: ARS-POS-1.0.9-PHASE4.3.1-SMART-PRODUCT-RECOGNITION-OCR-SIGNED

          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.0.9-PHASE4.3.1-SMART-PRODUCT-RECOGNITION-OCR-SIGNED.apk

            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.0.9-PHASE4.3.1-SMART-PRODUCT-RECOGNITION-OCR-SIGNED.apk.sha256

          if-no-files-found: error

          retention-days: 30
