name: ARS POS Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build ARS POS Phase 4.3.2.14 Product Identity Engine V5
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Locate Phase 4.3.2.14 ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="./ARS_POS_PHASE4_3_2_14_PRODUCT_IDENTITY_ENGINE_V5_MAX_FIXED.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP Phase 4.3.2.14 tidak ditemukan."
            echo ""
            echo "ZIP yang tersedia:"
            find . -maxdepth 2 -type f -iname "*.zip" -print
            exit 1
          fi

          echo "ZIP ditemukan:"
          ls -lh "$ZIP_FILE"

          unzip -t "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ARS POS project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "Project berhasil diekstrak."

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=$(find extracted \
            -type f \
            -name "settings.gradle.kts" \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts tidak ditemukan."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Gradle project:"
          echo "$PROJECT_DIR"

      - name: Validate V5 source files
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          test -f app/src/main/java/com/arspos/anglerriausyndicate/ProductVisualMatcher.kt

          test -f app/src/main/java/com/arspos/anglerriausyndicate/SmartVisualScanner.kt

          test -f app/src/main/java/com/arspos/anglerriausyndicate/data/SmartRecognitionEngine.kt

          grep -q "Phase 4.3.2.14" \
            app/src/main/java/com/arspos/anglerriausyndicate/data/SmartRecognitionEngine.kt

          grep -q "canonicalNameTokens" \
            app/src/main/java/com/arspos/anglerriausyndicate/data/SmartRecognitionEngine.kt

          grep -q "MAX_BOX_IOU" \
            app/src/main/java/com/arspos/anglerriausyndicate/SmartVisualScanner.kt

          grep -q "shapeDescriptor" \
            app/src/main/java/com/arspos/anglerriausyndicate/ProductVisualMatcher.kt

          grep -q "gradientDescriptor" \
            app/src/main/java/com/arspos/anglerriausyndicate/ProductVisualMatcher.kt

          grep -q "versionCode = 127" \
            app/build.gradle.kts

          grep -q 'versionName = "1.2.7"' \
            app/build.gradle.kts

          echo "V5 SOURCE OK"

      - name: Validate Kotlin source balance
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path

          pairs = {
              "{": "}",
              "(": ")",
              "[": "]"
          }

          reverse = {
              v: k
              for k, v in pairs.items()
          }

          def check(path):

              text = path.read_text(
                  encoding="utf-8"
              )

              stack = []

              i = 0
              line = 1

              line_comment = False
              block_comment = False
              string = False
              char = False
              escaped = False

              while i < len(text):

                  c = text[i]

                  if c == "\n":
                      line += 1
                      line_comment = False
                      i += 1
                      continue

                  if line_comment:
                      i += 1
                      continue

                  if block_comment:

                      if (
                          c == "*"
                          and i + 1 < len(text)
                          and text[i + 1] == "/"
                      ):
                          block_comment = False
                          i += 2
                      else:
                          i += 1

                      continue

                  if string:

                      if escaped:
                          escaped = False

                      elif c == "\\":
                          escaped = True

                      elif c == '"':
                          string = False

                      i += 1
                      continue

                  if char:

                      if escaped:
                          escaped = False

                      elif c == "\\":
                          escaped = True

                      elif c == "'":
                          char = False

                      i += 1
                      continue

                  if (
                      c == "/"
                      and i + 1 < len(text)
                      and text[i + 1] == "/"
                  ):
                      line_comment = True
                      i += 2
                      continue

                  if (
                      c == "/"
                      and i + 1 < len(text)
                      and text[i + 1] == "*"
                  ):
                      block_comment = True
                      i += 2
                      continue

                  if c == '"':
                      string = True
                      i += 1
                      continue

                  if c == "'":
                      char = True
                      i += 1
                      continue

                  if c in pairs:

                      stack.append(
                          (c, line)
                      )

                  elif c in reverse:

                      if (
                          not stack
                          or stack[-1][0] != reverse[c]
                      ):
                          raise SystemExit(
                              f"Mismatch in {path}:{line}"
                          )

                      stack.pop()

                  i += 1

              if string:
                  raise SystemExit(
                      f"Unclosed string: {path}"
                  )

              if char:
                  raise SystemExit(
                      f"Unclosed char: {path}"
                  )

              if block_comment:
                  raise SystemExit(
                      f"Unclosed comment: {path}"
                  )

              if stack:
                  raise SystemExit(
                      f"Unbalanced Kotlin: {path}"
                  )

          files = list(
              Path(
                  "app/src/main/java"
              ).rglob("*.kt")
          )

          if not files:
              raise SystemExit(
                  "Tidak ada Kotlin source."
              )

          for path in files:
              check(path)

          print(
              f"KOTLIN BALANCE OK: {len(files)} files"
          )
          PY

      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle clean \
            --no-daemon \
            --stacktrace

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          APK=$(find \
            app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          echo "APK:"
          echo "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging "$APK" \
            | grep -q "package: name="

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -c \
            -P 16 \
            -v 4 \
            "$APK"

          echo "APK VERIFIED"

      - name: Rename APK and SHA256
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          APK=$(find \
            app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          OUT="app/build/outputs/apk/release/ARS-POS-1.2.7-PHASE4.3.2.14-PRODUCT-IDENTITY-ENGINE-V5-SIGNED.apk"

          cp "$APK" "$OUT"

          sha256sum "$OUT" \
            > "$OUT.sha256"

          echo "FINAL APK:"
          ls -lh \
            "$OUT" \
            "$OUT.sha256"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4

        with:
          name: ARS-POS-1.2.7-PHASE4.3.2.14

          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.2.7-PHASE4.3.2.14-PRODUCT-IDENTITY-ENGINE-V5-SIGNED.apk

            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.2.7-PHASE4.3.2.14-PRODUCT-IDENTITY-ENGINE-V5-SIGNED.apk.sha256

          if-no-files-found: error
