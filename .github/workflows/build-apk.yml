name: ARS POS V8.9.0-F Physical Authority Ledger APVD Query Canvas CI R1 217

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.zip'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'app/**'
      - 'physicaltruth-jvm/**'
      - 'tools/**'
      - 'ars-ai-gateway/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

concurrency:
  group: ars-pos-v890f-physical-authority-ledger-217-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      EXPECTED_SOURCE_SHA256: 8b56b1bb22df346e5aa5bfc72ae5e8361d21148a99bbfc75b5186bb31d11dbcc
      EXPECTED_PACKAGE: com.arspos.anglerriausyndicate
      EXPECTED_VERSION_CODE: '217'
      EXPECTED_VERSION_NAME: '1.12.5'
      PREVIOUS_VERSION_CODE: '216'
      OFFICIAL_CERT_SHA256: AA2A8C6C885BA887577A2C2813AEA2F72E5FB51892FC486108B57F8389D56AEB

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Resolve source tree or verified archive fallback
        shell: bash
        run: |
          set -euo pipefail

          use_project_dir() {
            local dir="$1"
            test -f "$dir/settings.gradle.kts"
            test -f "$dir/app/build.gradle.kts"
            echo "PROJECT_DIR=$dir" >> "$GITHUB_ENV"
          }

          # Preferred production CI: ordinary checked-out Gradle source tree.
          if [ -f "$GITHUB_WORKSPACE/settings.gradle.kts" ] && \
             [ -f "$GITHUB_WORKSPACE/app/build.gradle.kts" ]; then
            use_project_dir "$GITHUB_WORKSPACE"
            echo "SOURCE_MODE=REPOSITORY_TREE" >> "$GITHUB_ENV"
            echo "Source mode: repository tree" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Mobile-friendly fallback 1:
          # filename tidak penting; SHA-256 yang menjadi authority.
          FOUND_SOURCE=""
          while IFS= read -r -d '' candidate; do
            actual="$(sha256sum "$candidate" | awk '{print $1}')"
            if [ "$actual" = "$EXPECTED_SOURCE_SHA256" ]; then
              FOUND_SOURCE="$candidate"
              break
            fi
          done < <(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 1 \
              -type f \
              -iname '*.zip' \
              -print0
          )

          if [ -n "$FOUND_SOURCE" ]; then
            PROJECT_DIR="$(
              mktemp -d \
                "$RUNNER_TEMP/ars-v890f-source.XXXXXX"
            )"

            unzip -q \
              "$FOUND_SOURCE" \
              -d "$PROJECT_DIR"

            use_project_dir "$PROJECT_DIR"

            echo \
              "SOURCE_MODE=VERIFIED_SOURCE_ZIP" \
              >> "$GITHUB_ENV"

            echo \
              "Resolved verified source ZIP: $(basename "$FOUND_SOURCE")" \
              >> "$GITHUB_STEP_SUMMARY"

            exit 0
          fi

          # Mobile-friendly fallback 2:
          # release pack juga dapat menjadi input.
          while IFS= read -r -d '' pack; do
            PACK_DIR="$(
              mktemp -d \
                "$RUNNER_TEMP/ars-v890f-pack.XXXXXX"
            )"

            if unzip -q \
              "$pack" \
              -d "$PACK_DIR" \
              2>/dev/null; then

              while IFS= read -r -d '' nested; do
                actual="$(
                  sha256sum "$nested" \
                  | awk '{print $1}'
                )"

                if [ "$actual" = "$EXPECTED_SOURCE_SHA256" ]; then
                  PROJECT_DIR="$(
                    mktemp -d \
                      "$RUNNER_TEMP/ars-v890f-nested.XXXXXX"
                  )"

                  unzip -q \
                    "$nested" \
                    -d "$PROJECT_DIR"

                  use_project_dir "$PROJECT_DIR"

                  echo \
                    "SOURCE_MODE=VERIFIED_RELEASE_PACK" \
                    >> "$GITHUB_ENV"

                  echo \
                    "Resolved source from release pack: $(basename "$pack")" \
                    >> "$GITHUB_STEP_SUMMARY"

                  exit 0
                fi
              done < <(
                find "$PACK_DIR" \
                  -type f \
                  -iname '*.zip' \
                  -print0
              )
            fi
          done < <(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 1 \
              -type f \
              -iname '*.zip' \
              -print0
          )

          echo "::error::ARS POS source tidak ditemukan."
          echo "::error::Workflow menerima salah satu dari:"
          echo "::error::(1) source tree Gradle di repository root,"
          echo "::error::(2) V8.9.0-F source ZIP resmi dengan SHA-256 benar,"
          echo "::error::(3) release pack yang berisi source ZIP resmi."

          echo "::error::File ZIP yang saat ini ada di root:"

          find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -iname '*.zip' \
            -printf '  %f\n' \
            || true

          exit 1

      - name: Verify V8.9.0-F source invariants
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          for f in \
            settings.gradle.kts \
            build.gradle.kts \
            app/build.gradle.kts \
            tools/validate_source.py \
            SOURCE_FILES_SHA256.txt \
            PHASE4_3_6_3_V8_9_0_F_PHYSICAL_AUTHORITY_LEDGER_APVD_QUERY_CANVAS_REPRODUCIBLE_CI_R1.md \
            RELEASE_217.md \
            BUILD_V890F.md \
            ARS_POS_V8_9_0_F_RELEASE_MANIFEST_217.txt \
            V8_9_0_F_VALIDATION_STATUS.txt \
            app/src/main/java/com/arspos/anglerriausyndicate/PhysicalIdentityAuthority.kt \
            app/src/main/java/com/arspos/anglerriausyndicate/PhysicalIdentityFragmentPolicy.kt \
            app/src/main/java/com/arspos/anglerriausyndicate/PhysicalIdentityJobLedger.kt \
            app/src/main/java/com/arspos/anglerriausyndicate/LongAuthenticityInstanceMask.kt \
            app/src/main/java/com/arspos/anglerriausyndicate/CandidateSpecificOcrRoi.kt \
            app/src/main/java/com/arspos/anglerriausyndicate/visualdna/PrivateVisualDnaRuntime.kt
          do
            test -f "$f" || {
              echo "::error::File release wajib tidak ditemukan: $f"
              exit 1
            }
          done

          sha256sum \
            -c SOURCE_FILES_SHA256.txt \
            > "$RUNNER_TEMP/ars-source-checks.txt"

          python3 \
            tools/validate_source.py \
            --root . \
            | tee validation/ci-static-validation.json

          python3 \
            -m unittest discover \
            -s tools \
            -p 'test_*.py'

          (
            cd ars-ai-gateway

            node --check server.mjs
            node --check security.mjs
            node --check runtime-bundled.mjs
            node --test
          )

          grep -Fq \
            'applicationId = "com.arspos.anglerriausyndicate"' \
            app/build.gradle.kts

          grep -Fq \
            'versionCode = 217' \
            app/build.gradle.kts

          grep -Fq \
            'versionName = "1.12.5"' \
            app/build.gradle.kts

          grep -Fq \
            'const val PHASE = "4.3.6.3"' \
            app/src/main/java/com/arspos/anglerriausyndicate/ArsV850Config.kt

          grep -Fq \
            'const val ENGINE = "V8.9.0-F"' \
            app/src/main/java/com/arspos/anglerriausyndicate/ArsV850Config.kt

          grep -Fq \
            'FEATURE_PHYSICAL_IDENTITY_JOB_LEDGER = true' \
            app/src/main/java/com/arspos/anglerriausyndicate/ArsV850Config.kt

          grep -Fq \
            'FEATURE_APVD_BOUNDED_QUERY_CANVAS = true' \
            app/src/main/java/com/arspos/anglerriausyndicate/ArsV850Config.kt

          grep -Fq \
            'APVD_NORMAL_MAX_EDGE_PX = 720' \
            app/src/main/java/com/arspos/anglerriausyndicate/ArsV850Config.kt

          grep -Fq \
            'IDENTITY_JOB_DUPLICATE_SUPPRESSED' \
            app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt

          grep -Fq \
            'COLLINEAR_EVIDENCE_FRAGMENT' \
            app/src/main/java/com/arspos/anglerriausyndicate/PhysicalIdentityFragmentPolicy.kt

          grep -Fq \
            'val histogram = IntArray(256)' \
            app/src/main/java/com/arspos/anglerriausyndicate/visualdna/PrivateVisualDnaRuntime.kt

          echo \
            "Source mode: ${SOURCE_MODE:-UNKNOWN}" \
            >> "$GITHUB_STEP_SUMMARY"

          echo \
            "V8.9.0-F source invariants: PASS" \
            >> "$GITHUB_STEP_SUMMARY"

          echo \
            "Recognition thresholds: UNCHANGED" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35 build tools
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          test -n "$SDK_ROOT" && \
          test -d "$SDK_ROOT" || {
            echo "::error::Android SDK root tidak tersedia setelah setup-android."
            exit 1
          }

          echo \
            "ANDROID_HOME=$SDK_ROOT" \
            >> "$GITHUB_ENV"

          echo \
            "ANDROID_SDK_ROOT=$SDK_ROOT" \
            >> "$GITHUB_ENV"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -f \
            "$SDK_ROOT/platforms/android-35/android.jar"

          test -x \
            "$SDK_ROOT/build-tools/35.0.0/aapt"

          test -x \
            "$SDK_ROOT/build-tools/35.0.0/apksigner"

          test -x \
            "$SDK_ROOT/build-tools/35.0.0/zipalign"

          {
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            sdkmanager --version
          } > "$RUNNER_TEMP/ars-sdk-info.txt"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Verify official ARS signer
        shell: bash
        env:
          ARS_RELEASE_KEYSTORE_BASE64: ${{ secrets.ARS_RELEASE_KEYSTORE_BASE64 }}
          ARS_RELEASE_STORE_PASSWORD: ${{ secrets.ARS_RELEASE_STORE_PASSWORD }}
          ARS_RELEASE_KEY_ALIAS: ${{ secrets.ARS_RELEASE_KEY_ALIAS }}
          ARS_RELEASE_KEY_PASSWORD: ${{ secrets.ARS_RELEASE_KEY_PASSWORD }}
          ARS_RELEASE_CERT_SHA256: ${{ secrets.ARS_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail

          : "${ARS_RELEASE_KEYSTORE_BASE64:?Missing ARS_RELEASE_KEYSTORE_BASE64}"
          : "${ARS_RELEASE_STORE_PASSWORD:?Missing ARS_RELEASE_STORE_PASSWORD}"
          : "${ARS_RELEASE_KEY_ALIAS:?Missing ARS_RELEASE_KEY_ALIAS}"
          : "${ARS_RELEASE_KEY_PASSWORD:?Missing ARS_RELEASE_KEY_PASSWORD}"
          : "${ARS_RELEASE_CERT_SHA256:?Missing ARS_RELEASE_CERT_SHA256}"

          EXPECTED="$(
            printf '%s' \
              "$ARS_RELEASE_CERT_SHA256" \
            | tr -d ':[:space:]' \
            | tr '[:lower:]' '[:upper:]'
          )"

          test \
            "$EXPECTED" = "$OFFICIAL_CERT_SHA256" || {
              echo "::error::Secret ARS_RELEASE_CERT_SHA256 bukan signer resmi ARS POS."
              exit 1
            }

          KEYSTORE="$RUNNER_TEMP/ars-v890f-217.jks"

          umask 077

          printf '%s' \
            "$ARS_RELEASE_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$KEYSTORE"

          test -s "$KEYSTORE"

          keytool \
            -list \
            -keystore "$KEYSTORE" \
            -storepass:env ARS_RELEASE_STORE_PASSWORD \
            -alias "$ARS_RELEASE_KEY_ALIAS" \
            >/dev/null

          ACTUAL=$(
            keytool \
              -exportcert \
              -rfc \
              -keystore "$KEYSTORE" \
              -storepass:env ARS_RELEASE_STORE_PASSWORD \
              -alias "$ARS_RELEASE_KEY_ALIAS" \
            | openssl x509 \
              -outform DER \
            | sha256sum \
            | awk '{print toupper($1)}'
          )

          test \
            "$ACTUAL" = "$OFFICIAL_CERT_SHA256" || {
              echo "::error::Keystore signer mismatch: $ACTUAL"
              exit 1
            }

          echo \
            "ARS_RELEASE_STORE_FILE=$KEYSTORE" \
            >> "$GITHUB_ENV"

          echo \
            "Official signer pre-build verification: PASS" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Compile Kotlin and run regression tests
        shell: bash
        env:
          ARS_RELEASE_STORE_PASSWORD: ${{ secrets.ARS_RELEASE_STORE_PASSWORD }}
          ARS_RELEASE_KEY_ALIAS: ${{ secrets.ARS_RELEASE_KEY_ALIAS }}
          ARS_RELEASE_KEY_PASSWORD: ${{ secrets.ARS_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle \
            :app:compileDebugKotlin \
            :app:compileReleaseKotlin \
            :physicaltruth-jvm:test \
            :app:testDebugUnitTest \
            --no-daemon \
            --stacktrace

      - name: Build signed official release APK
        shell: bash
        env:
          ARS_RELEASE_STORE_PASSWORD: ${{ secrets.ARS_RELEASE_STORE_PASSWORD }}
          ARS_RELEASE_KEY_ALIAS: ${{ secrets.ARS_RELEASE_KEY_ALIAS }}
          ARS_RELEASE_KEY_PASSWORD: ${{ secrets.ARS_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify package version signer and alignment
        shell: bash
        env:
          ARS_RELEASE_CERT_SHA256: ${{ secrets.ARS_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          APK="app/build/outputs/apk/release/app-release.apk"

          test -s "$APK"

          SDK_BIN="$ANDROID_SDK_ROOT/build-tools/35.0.0"

          "$SDK_BIN/aapt" \
            dump badging \
            "$APK" \
            > apk-badging.txt

          grep -Fq \
            "name='$EXPECTED_PACKAGE'" \
            apk-badging.txt

          grep -Fq \
            "versionCode='$EXPECTED_VERSION_CODE'" \
            apk-badging.txt

          grep -Fq \
            "versionName='$EXPECTED_VERSION_NAME'" \
            apk-badging.txt

          test \
            "$EXPECTED_VERSION_CODE" \
            -gt \
            "$PREVIOUS_VERSION_CODE"

          "$SDK_BIN/apksigner" \
            verify \
            --verbose \
            --print-certs \
            "$APK" \
            > signer-info.txt

          "$SDK_BIN/zipalign" \
            -c \
            -P 16 \
            -v 4 \
            "$APK"

          ACTUAL="$(
            awk \
              -F': ' \
              '/Signer #1 certificate SHA-256 digest:/ {
                print $2
                exit
              }' \
              signer-info.txt \
            | tr -d ':[:space:]' \
            | tr '[:lower:]' '[:upper:]'
          )"

          EXPECTED="$(
            printf '%s' \
              "$ARS_RELEASE_CERT_SHA256" \
            | tr -d ':[:space:]' \
            | tr '[:lower:]' '[:upper:]'
          )"

          test -n "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          test "$ACTUAL" = "$OFFICIAL_CERT_SHA256"

          mkdir -p \
            "$GITHUB_WORKSPACE/release-output"

          OUT_APK="$GITHUB_WORKSPACE/release-output/ARS-POS-1.12.5-V8.9.0-F-PHYSICAL-AUTHORITY-APVD-CANVAS-217-SIGNED.apk"

          cp \
            "$APK" \
            "$OUT_APK"

          cp \
            signer-info.txt \
            "$GITHUB_WORKSPACE/release-output/SIGNING_FINGERPRINT.txt"

          cp \
            apk-badging.txt \
            "$GITHUB_WORKSPACE/release-output/APK_METADATA.txt"

          cp \
            "$RUNNER_TEMP/ars-source-checks.txt" \
            "$GITHUB_WORKSPACE/release-output/SOURCE_CHECKS.txt"

          cp \
            "$RUNNER_TEMP/ars-sdk-info.txt" \
            "$GITHUB_WORKSPACE/release-output/SDK_INFO.txt"

          cp \
            validation/validation-status.json \
            "$GITHUB_WORKSPACE/release-output/SOURCE_VALIDATION_STATUS.json"

          sha256sum \
            "$OUT_APK" \
            > "$GITHUB_WORKSPACE/release-output/APK_SHA256.txt"

          echo \
            "Build 1.12.5 (217) / Phase 4.3.6.3 / V8.9.0-F: PASS." \
            >> "$GITHUB_STEP_SUMMARY"

          echo \
            "Physical authority ledger + bounded APVD query canvas + reproducible CI: ACTIVE." \
            >> "$GITHUB_STEP_SUMMARY"

          echo \
            "Cloud Identity=SHADOW; Self Learning=ACTIVE_CONFIRMED_ONLY; recognition thresholds unchanged." \
            >> "$GITHUB_STEP_SUMMARY"

          echo \
            "Install in-place only; do not uninstall production app." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified official APK
        uses: actions/upload-artifact@v7
        with:
          name: ARS-POS-V8.9.0-F-PHYSICAL-AUTHORITY-APVD-CANVAS-217-OFFICIAL
          path: release-output/
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: always() && env.PROJECT_DIR != ''
        uses: actions/upload-artifact@v7
        with:
          name: ARS-POS-V8.9.0-F-217-TEST-REPORTS
          path: |
            ${{ env.PROJECT_DIR }}/physicaltruth-jvm/build/reports/tests/
            ${{ env.PROJECT_DIR }}/physicaltruth-jvm/build/test-results/
            ${{ env.PROJECT_DIR }}/app/build/reports/tests/
            ${{ env.PROJECT_DIR }}/app/build/test-results/
            ${{ env.PROJECT_DIR }}/validation/
          if-no-files-found: warn
          retention-days: 30

      - name: Remove runner copy of signing key
        if: always()
        shell: bash
        run: |
          KEYSTORE="$RUNNER_TEMP/ars-v890f-217.jks"

          if [ -f "$KEYSTORE" ]; then
            if command -v shred >/dev/null 2>&1; then
              shred -u "$KEYSTORE" || \
                rm -f -- "$KEYSTORE"
            else
              rm -f -- "$KEYSTORE"
            fi
          fi
