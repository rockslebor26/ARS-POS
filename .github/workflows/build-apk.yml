name: ARS POS Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ARS POS Signed Release APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT SOURCE
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ============================================================
      # 4. INSTALL ANDROID SDK COMPONENTS
      # ============================================================
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"


      # ============================================================
      # 5. FIND / EXTRACT ARS POS PROJECT
      # ============================================================
      - name: Prepare ARS POS source
        shell: bash
        run: |

          echo "=========================================="
          echo " MENCARI PROJECT ARS POS"
          echo "=========================================="

          PROJECT_DIR=""

          # --------------------------------------------------------
          # Jika settings.gradle.kts sudah ada di root repository
          # --------------------------------------------------------
          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then

            echo "Project Gradle ditemukan langsung di root repository."

            PROJECT_DIR="$GITHUB_WORKSPACE"

          else

            echo "Project belum berada di root."
            echo "Mencari file ZIP ARS POS..."

            ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
              -maxdepth 2 \
              -type f \
              -name "*.zip" \
              | head -n 1)

            if [ -z "$ZIP_FILE" ]; then

              echo ""
              echo "ERROR: File ZIP ARS POS tidak ditemukan."
              echo ""
              echo "Isi repository:"
              find "$GITHUB_WORKSPACE" -maxdepth 3 -type f | head -100

              exit 1

            fi

            echo "ZIP ditemukan:"
            echo "$ZIP_FILE"

            mkdir -p "$GITHUB_WORKSPACE/build-source"

            unzip -q "$ZIP_FILE" \
              -d "$GITHUB_WORKSPACE/build-source"

            echo ""
            echo "ZIP berhasil diekstrak."
            echo "Mencari settings.gradle..."

            SETTINGS_FILE=$(find \
              "$GITHUB_WORKSPACE/build-source" \
              -type f \
              \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
              | head -n 1)

            if [ -z "$SETTINGS_FILE" ]; then

              echo ""
              echo "ERROR: settings.gradle tidak ditemukan."
              echo ""

              find "$GITHUB_WORKSPACE/build-source" \
                -maxdepth 5 \
                -type f \
                | head -200

              exit 1

            fi

            PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          fi


          # --------------------------------------------------------
          # Validasi project
          # --------------------------------------------------------

          echo ""
          echo "=========================================="
          echo " PROJECT ARS POS"
          echo "=========================================="

          echo "PROJECT_DIR:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Isi project:"
          ls -la "$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ] &&
             [ ! -f "$PROJECT_DIR/settings.gradle" ]; then

            echo ""
            echo "ERROR: settings.gradle tidak ditemukan."
            exit 1

          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] &&
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then

            echo ""
            echo "ERROR: app/build.gradle tidak ditemukan."
            exit 1

          fi


          # --------------------------------------------------------
          # Simpan lokasi project untuk step berikutnya
          # --------------------------------------------------------

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Project ARS POS siap dibuild."


      # ============================================================
      # 6. CHECK GRADLE PROJECT
      # ============================================================
      - name: Check Gradle project
        shell: bash
        run: |

          echo "=========================================="
          echo " CHECK GRADLE PROJECT"
          echo "=========================================="

          cd "$PROJECT_DIR"

          echo "Lokasi:"
          pwd

          echo ""
          echo "Gradle files:"

          find . \
            -maxdepth 3 \
            -type f \
            \( \
              -name "settings.gradle*" \
              -o \
              -name "build.gradle*" \
              -o \
              -name "gradlew" \
            \) \
            -print


      # ============================================================
      # 7. BUILD RELEASE APK
      # ============================================================
      - name: Build Release APK
        shell: bash
        run: |

          echo "=========================================="
          echo " BUILD ARS POS RELEASE APK"
          echo "=========================================="

          cd "$PROJECT_DIR"

          echo "Project:"
          pwd

          echo ""
          echo "Menjalankan Gradle..."

          gradle clean :app:assembleRelease --stacktrace


      # ============================================================
      # 8. CHECK APK
      # ============================================================
      - name: Check APK
        shell: bash
        run: |

          echo "=========================================="
          echo " HASIL BUILD APK"
          echo "=========================================="

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/release"

          if [ ! -d "$APK_DIR" ]; then

            echo "ERROR: Folder APK tidak ditemukan."

            find "$PROJECT_DIR/app/build" \
              -maxdepth 6 \
              -type f \
              | head -200

            exit 1

          fi

          echo ""
          echo "File APK:"

          find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -ls


      # ============================================================
      # 9. VERIFY APK SIGNATURE
      # ============================================================
      - name: Verify APK signature
        shell: bash
        run: |

          echo "=========================================="
          echo " VERIFIKASI SIGNATURE APK"
          echo "=========================================="

          APK=$(find \
            "$PROJECT_DIR/app/build/outputs/apk/release" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then

            echo "ERROR: APK tidak ditemukan."
            exit 1

          fi

          echo ""
          echo "APK:"
          echo "$APK"

          echo ""
          echo "Menjalankan apksigner..."

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"


      # ============================================================
      # 10. COPY / RENAME APK
      # ============================================================
      - name: Prepare final APK
        shell: bash
        run: |

          echo "=========================================="
          echo " MENYIAPKAN APK FINAL"
          echo "=========================================="

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/release"

          APK=$(find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            ! -name "ARS-POS-1.0.0-signed.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then

            echo "ERROR: APK release tidak ditemukan."
            exit 1

          fi

          cp "$APK" \
            "$APK_DIR/ARS-POS-1.0.0-signed.apk"

          echo ""
          echo "APK FINAL:"
          ls -lh "$APK_DIR/ARS-POS-1.0.0-signed.apk"


      # ============================================================
      # 11. UPLOAD APK KE GITHUB ACTIONS
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARS-POS-1.0.0-SIGNED
          path: "**/app/build/outputs/apk/release/ARS-POS-1.0.0-signed.apk"
          if-no-files-found: error
