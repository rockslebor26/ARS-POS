name: ARS POS Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ARS POS Phase 4.3.2.12 Product Identity Engine V3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -f "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -f "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -f "$ANDROID_HOME/build-tools/35.0.0/aapt"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Locate Phase 4.3.2.12 ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="./ARS_POS_PHASE4_3_2_12_PRODUCT_IDENTITY_ENGINE_V3.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP tidak ditemukan: $ZIP_FILE"
            find . -maxdepth 2 -type f -iname '*.zip' -print
            exit 1
          fi

          unzip -t "$ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ARS POS project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extracted
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=$(find extracted -type f -name 'settings.gradle.kts' | head -n 1)

          test -n "$SETTINGS" || {
            echo "ERROR: settings.gradle.kts tidak ditemukan"
            exit 1
          }

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Gradle project: $PROJECT_DIR"

      - name: Validate project structure
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          REQUIRED=(
            "settings.gradle.kts"
            "build.gradle.kts"
            "gradle.properties"
            "app/build.gradle.kts"
            "app/src/main/AndroidManifest.xml"
            "app/src/main/res/xml/file_paths.xml"

            "app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/PosViewModel.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/Money.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/SmartProductInput.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/SmartVisualScanner.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/ProductVisualMatcher.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/VisualProductMatch.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/VisualScanObject.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/ProductMasterStudio.kt"

            "app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/data/SmartRecognitionEngine.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/data/RecognitionCandidate.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/data/ProductIdentityProfile.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/data/ProductIdentityProfileCodec.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/data/MasterVerificationResult.kt"

            "app/src/main/java/com/arspos/anglerriausyndicate/data/db/ArsDao.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/data/db/ArsDatabase.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/data/db/ProductEntity.kt"
            "app/src/main/java/com/arspos/anglerriausyndicate/data/db/ProductPhotoEntity.kt"
          )

          for FILE in "${REQUIRED[@]}"; do
            test -f "$FILE" || {
              echo "MISSING: $FILE"
              exit 1
            }
          done

          echo "PROJECT STRUCTURE OK"

      - name: Validate Phase 4.3.2.12 no-barcode product input
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          MAIN="app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"
          VM="app/src/main/java/com/arspos/anglerriausyndicate/PosViewModel.kt"
          REPO="app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"
          INPUT="app/src/main/java/com/arspos/anglerriausyndicate/SmartProductInput.kt"

          grep -q 'Barcode (opsional)' "$MAIN"
          grep -q 'Barcode tidak wajib' "$MAIN"
          grep -q 'Nama \*' "$MAIN"
          grep -q 'SKU ARS' "$MAIN"
          grep -q 'Tidak ada barcode/teks yang terbaca' "$MAIN"
          grep -q 'generateSku' "$MAIN"
          grep -q 'mergeProductIdentityProfile' "$MAIN"

          grep -q 'mergeProductIdentityProfile' "$VM"

          grep -q 'require(name.isNotBlank())' "$REPO"
          grep -q 'ifBlank { null }' "$REPO"
          grep -q 'ProductIdentityProfileCodec' "$REPO"
          grep -q 'identity_profile_' "$REPO"

          grep -q 'fun generateSku' "$INPUT"

          grep -q 'val barcode: String?=null' \
            app/src/main/java/com/arspos/anglerriausyndicate/data/db/ProductEntity.kt

          echo "NO-BARCODE PRODUCT INPUT PATH OK"

      - name: Validate identity recognition engine
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          ENGINE="app/src/main/java/com/arspos/anglerriausyndicate/data/SmartRecognitionEngine.kt"
          REPO="app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"

          grep -q 'identityProfiles' "$ENGINE"
          grep -q 'aggregateVisual' "$ENGINE"
          grep -q 'profileScore' "$ENGINE"
          grep -q 'fuzzyToken' "$ENGINE"
          grep -q 'fuzzyCode' "$ENGINE"
          grep -q 'ACCEPT_PROFILE_IDENTITY' "$ENGINE"

          grep -q 'SmartRecognitionEngine.recognize' "$REPO"
          grep -q 'loadIdentityProfiles' "$REPO"
          grep -q 'mergeProductIdentityProfile' "$REPO"
          grep -q 'master_verified_' "$REPO"

          echo "IDENTITY ENGINE OK"

      - name: Validate ML Kit and Camera
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          GRADLE_FILE="app/build.gradle.kts"
          MAIN="app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"

          grep -q 'com.google.mlkit:object-detection:17.0.2' "$GRADLE_FILE"
          grep -q 'com.google.mlkit:text-recognition:16.0.1' "$GRADLE_FILE"
          grep -q 'com.google.mlkit:barcode-scanning:17.3.0' "$GRADLE_FILE"

          grep -q 'ActivityResultContracts.TakePicture()' "$MAIN"
          grep -q 'Manifest.permission.CAMERA' "$MAIN"
          grep -q 'FileProvider' app/src/main/AndroidManifest.xml

          if grep -q 'TakePicturePreview' "$MAIN"; then
            echo "ERROR: TakePicturePreview masih digunakan."
            exit 1
          fi

          echo "ML KIT + CAMERA OK"

      - name: Validate update compatibility
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          grep -q 'applicationId = "com.arspos.anglerriausyndicate"' app/build.gradle.kts
          grep -q 'versionCode = 122' app/build.gradle.kts
          grep -q 'versionName = "1.2.2"' app/build.gradle.kts
          grep -q 'signingConfig = signingConfigs.getByName("debug")' app/build.gradle.kts

          grep -q 'withTransaction' \
            app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt

          grep -q 'MIGRATION_3_4' \
            app/src/main/java/com/arspos/anglerriausyndicate/data/db/ArsDatabase.kt

          grep -q 'MIGRATION_4_5' \
            app/src/main/java/com/arspos/anglerriausyndicate/data/db/ArsDatabase.kt

          echo "UPDATE COMPATIBILITY OK"

      - name: Validate existing POS
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          MAIN="app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"
          REPO="app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"
          MONEY="app/src/main/java/com/arspos/anglerriausyndicate/Money.kt"

          grep -q 'CASH' "$MAIN"
          grep -q 'QRIS' "$MAIN"
          grep -q 'TRANSFER' "$MAIN"
          grep -q 'DEBIT' "$MAIN"
          grep -q 'processingPayment' "$MAIN"
          grep -q 'formatRupiah' "$MAIN"
          grep -q 'withTransaction' "$REPO"
          grep -q 'changeStock' "$REPO"
          grep -q 'Locale("id", "ID")' "$MONEY"

          echo "EXISTING POS OK"

      - name: Clean project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle clean --no-daemon --stacktrace

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          APK=$(find app/build/outputs/apk/release \
            -type f -name '*.apk' | head -n 1)

          test -n "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging "$APK" | grep -q 'package: name='

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose "$APK"

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -c -P 16 -v 4 "$APK" | tail -n 2

          echo "APK VERIFIED: $APK"

      - name: Rename signed APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          APK=$(find app/build/outputs/apk/release \
            -type f -name '*.apk' | head -n 1)

          OUT="app/build/outputs/apk/release/ARS-POS-1.2.2-PHASE4.3.2.12-PRODUCT-IDENTITY-ENGINE-V3-SIGNED.apk"

          cp "$APK" "$OUT"

          sha256sum "$OUT" | tee "$OUT.sha256"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ARS-POS-1.2.2-PHASE4.3.2.12
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.2.2-PHASE4.3.2.12-PRODUCT-IDENTITY-ENGINE-V3-SIGNED.apk
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.2.2-PHASE4.3.2.12-PRODUCT-IDENTITY-ENGINE-V3-SIGNED.apk.sha256
          if-no-files-found: error
