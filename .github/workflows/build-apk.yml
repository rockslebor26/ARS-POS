name: ARS POS Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ARS POS Phase 4.2 Visual Product Scanner
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v7


      # ============================================================
      # 2. SETUP JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. SETUP ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # ============================================================
      # 4. INSTALL ANDROID SDK PACKAGES
      # ============================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

          test -f "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -f "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -f "$ANDROID_HOME/build-tools/35.0.0/aapt"


      # ============================================================
      # 5. SETUP GRADLE 8.9
      # ============================================================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'


      # ============================================================
      # 6. CHECK REPOSITORY
      # ============================================================
      - name: Check repository files
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ARS POS PHASE 4.2"
          echo "=========================================="

          pwd

          echo ""
          echo "Repository contents:"
          ls -lah

          echo ""
          echo "ZIP FILES:"
          find . -type f -iname "*.zip" -print


      # ============================================================
      # 7. REQUIRE PHASE 4.2 ZIP
      # ============================================================
      - name: Require Phase 4.2 project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="./ARS_POS_PHASE4_2_VISUAL_SCANNER_COMPLETE.zip"

          echo "=========================================="
          echo "CHECK PHASE 4.2 ZIP"
          echo "=========================================="

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR:"
            echo "$ZIP_FILE tidak ditemukan."

            echo ""
            echo "Pastikan ZIP FIXED sudah di-upload"
            echo "ke ROOT repository dengan nama:"

            echo ""
            echo "ARS_POS_PHASE4_2_VISUAL_SCANNER_COMPLETE.zip"

            echo ""
            echo "ZIP yang tersedia:"
            find . -type f -iname "*.zip" -print

            exit 1
          fi

          echo ""
          echo "ZIP ditemukan:"
          ls -lh "$ZIP_FILE"

          echo ""
          echo "Testing ZIP integrity..."

          unzip -t "$ZIP_FILE"

          echo ""
          echo "ZIP integrity OK."

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ============================================================
      # 8. EXTRACT PROJECT
      # ============================================================
      - name: Extract ARS POS project
        shell: bash
        run: |
          set -e

          rm -rf extracted

          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo ""
          echo "Project extracted successfully."


      # ============================================================
      # 9. LOCATE GRADLE PROJECT
      # ============================================================
      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find extracted \
            -type f \
            -name "settings.gradle.kts" \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then

            echo "ERROR:"
            echo "settings.gradle.kts tidak ditemukan."

            echo ""
            echo "Isi extracted project:"

            find extracted \
              -maxdepth 8 \
              -type f \
              | sort

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo ""
          echo "Gradle project ditemukan:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 10. VALIDATE PROJECT STRUCTURE
      # ============================================================
      - name: Validate Phase 4.2 sources
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "VALIDATE PHASE 4.2 SOURCES"
          echo "=========================================="

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle.kts

          test -f app/src/main/AndroidManifest.xml

          test -f \
            app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt

          test -f \
            app/src/main/java/com/arspos/anglerriausyndicate/PosViewModel.kt

          test -f \
            app/src/main/java/com/arspos/anglerriausyndicate/Money.kt

          test -f \
            app/src/main/java/com/arspos/anglerriausyndicate/ProductVisualMatcher.kt

          test -f \
            app/src/main/java/com/arspos/anglerriausyndicate/VisualProductMatch.kt

          test -f \
            app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt

          echo ""
          echo "=========================================="
          echo "PHASE 4.2 SOURCE STRUCTURE OK"
          echo "=========================================="


      # ============================================================
      # 11. VALIDATE VISUAL MATCH MODEL
      # ============================================================
      - name: Validate VisualProductMatch
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          MODEL="app/src/main/java/com/arspos/anglerriausyndicate/VisualProductMatch.kt"

          MATCHER="app/src/main/java/com/arspos/anglerriausyndicate/ProductVisualMatcher.kt"

          MAIN="app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"

          REPO="app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"

          echo "=========================================="
          echo "VISUAL PRODUCT MATCH"
          echo "=========================================="

          echo ""
          echo "VisualProductMatch:"

          grep -n "data class VisualProductMatch" "$MODEL"

          grep -n "val product" "$MODEL"

          grep -n "val photo" "$MODEL"

          grep -n "val score" "$MODEL"

          echo ""
          echo "ProductVisualMatcher:"

          grep -n "object ProductVisualMatcher" "$MATCHER"

          grep -n "score" "$MATCHER"

          echo ""
          echo "MainActivity usage:"

          grep -n "VisualProductMatch" "$MAIN"

          echo ""
          echo "Repository usage:"

          grep -n "VisualProductMatch" "$REPO"

          echo ""
          echo "VisualProductMatch validation OK."


      # ============================================================
      # 12. VALIDATE VISUAL SCANNER
      # ============================================================
      - name: Validate Visual Scanner
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          MAIN="app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"
          VM="app/src/main/java/com/arspos/anglerriausyndicate/PosViewModel.kt"
          REPO="app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"

          echo "=========================================="
          echo "VISUAL SCANNER"
          echo "=========================================="

          echo ""
          echo "Camera feature:"

          grep -n "TakePicturePreview" "$MAIN"
          grep -n "Manifest.permission.CAMERA" "$MAIN"

          echo ""
          echo "Visual matching:"

          grep -n "findVisualMatches" "$VM"
          grep -n "visualProductMatches" "$VM"
          grep -n "ProductVisualMatcher" "$REPO"

          echo ""
          echo "Visual scanner UI:"

          grep -n "SCAN FOTO PRODUK" "$MAIN"
          grep -n "SCAN ULANG" "$MAIN"

          echo ""
          echo "Visual Scanner validation OK."


      # ============================================================
      # 13. VALIDATE PHOTO DATABASE
      # ============================================================
      - name: Validate Offline and Photo Database
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          DAO="app/src/main/java/com/arspos/anglerriausyndicate/data/db/ArsDao.kt"

          DB="app/src/main/java/com/arspos/anglerriausyndicate/data/db/ArsDatabase.kt"

          MAIN="app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"

          echo "=========================================="
          echo "PHOTO DATABASE"
          echo "=========================================="

          if [ -f "$DAO" ]; then
            grep -n "product_photos" "$DAO" || true
          fi

          if [ -f "$DB" ]; then
            grep -n "MIGRATION_3_4" "$DB" || true
            grep -n "version" "$DB" | head -10
          fi

          grep -n "filesDir" "$MAIN" || true

          grep -n "Bitmap.CompressFormat.JPEG" "$MAIN" || true

          echo ""
          echo "Offline/photo database validation OK."


      # ============================================================
      # 14. VALIDATE EXISTING POS
      # ============================================================
      - name: Validate Existing POS Features
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          MAIN="app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"

          REPO="app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"

          MONEY="app/src/main/java/com/arspos/anglerriausyndicate/Money.kt"

          echo "=========================================="
          echo "EXISTING POS FEATURES"
          echo "=========================================="

          echo ""
          echo "Payment:"

          grep -n "processingPayment" "$MAIN"
          grep -n "UANG PAS" "$MAIN"

          grep -n 'Rp 50.000' "$MAIN"
          grep -n 'Rp 100.000' "$MAIN"
          grep -n 'Rp 200.000' "$MAIN"
          grep -n 'Rp 500.000' "$MAIN"

          grep -n "QRIS" "$MAIN"
          grep -n "TRANSFER" "$MAIN"
          grep -n "DEBIT" "$MAIN"

          echo ""
          echo "Transaction safety:"

          grep -n "db.withTransaction" "$REPO"
          grep -n "yyyyMMdd-HHmmssSSS" "$REPO"
          grep -n "dao.changeStock" "$REPO"

          echo ""
          echo "Rupiah formatter:"

          grep -n "formatRupiah" "$MONEY"
          grep -n "formatRupiah" "$MAIN"

          echo ""
          echo "Existing POS feature validation OK."


      # ============================================================
      # 15. CHECK VERSION
      # ============================================================
      - name: Check ARS POS version
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "ARS POS VERSION"
          echo "=========================================="

          grep -n \
            "versionCode\|versionName" \
            app/build.gradle.kts

          grep -q \
            "versionCode = 105" \
            app/build.gradle.kts

          grep -q \
            'versionName = "1.0.5"' \
            app/build.gradle.kts

          echo ""
          echo "Version 1.0.5 validation OK."


      # ============================================================
      # 16. VALIDATE BRANDING
      # ============================================================
      - name: Validate ARS branding
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "ARS BRANDING"
          echo "=========================================="

          test -f \
            app/src/main/res/drawable/ars_background.png

          test -f \
            app/src/main/res/drawable/ars_logo_master.png

          echo ""
          echo "Manifest icon:"

          grep -n \
            "android:icon\|android:roundIcon" \
            app/src/main/AndroidManifest.xml

          echo ""
          echo "Launcher files:"

          find app/src/main/res \
            -type f \
            \( -iname "ic_launcher*" -o -iname "*launcher*" \) \
            -print

          echo ""
          echo "ARS branding validation OK."


      # ============================================================
      # 17. BUILD ENVIRONMENT
      # ============================================================
      - name: Show build environment
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "JAVA"
          echo "=========================================="

          java -version

          echo ""
          echo "=========================================="
          echo "GRADLE"
          echo "=========================================="

          gradle --version

          echo ""
          echo "=========================================="
          echo "ANDROID HOME"
          echo "=========================================="

          echo "$ANDROID_HOME"


      # ============================================================
      # 18. CLEAN PROJECT
      # ============================================================
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle clean \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 19. BUILD RELEASE APK
      # ============================================================
      - name: Build Release APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      # ============================================================
      # 20. LOCATE APK
      # ============================================================
      - name: Locate APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          APK_DIR="app/build/outputs/apk/release"

          APK=$(find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then

            echo "ERROR: APK tidak ditemukan."

            find app/build/outputs \
              -type f \
              | sort

            exit 1
          fi

          echo ""
          echo "APK ditemukan:"

          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"


      # ============================================================
      # 21. VERIFY APK SIGNATURE
      # ============================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "APK SIGNATURE"
          echo "=========================================="

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK_PATH"

          echo ""
          echo "Signature verification PASSED."


      # ============================================================
      # 22. VERIFY APK ALIGNMENT
      # ============================================================
      - name: Verify APK alignment
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "APK ALIGNMENT"
          echo "=========================================="

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -c \
            -P 16 \
            -v 4 \
            "$APK_PATH"

          echo ""
          echo "Alignment verification PASSED."


      # ============================================================
      # 23. VERIFY PACKAGE AND VERSION
      # ============================================================
      - name: Verify APK package and version
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "APK PACKAGE / VERSION"
          echo "=========================================="

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging \
            "$APK_PATH" \
            | grep -E \
            "package: name=|versionCode=|versionName="

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging \
            "$APK_PATH" \
            | grep -q \
            "versionCode='105'"

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging \
            "$APK_PATH" \
            | grep -q \
            "versionName='1.0.5'"

          echo ""
          echo "Package/version verification PASSED."


      # ============================================================
      # 24. PREPARE FINAL APK
      # ============================================================
      - name: Prepare final APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          APK_DIR="app/build/outputs/apk/release"

          FINAL_APK="$APK_DIR/ARS-POS-1.0.5-PHASE4.2-VISUAL-SCANNER-SIGNED.apk"

          cp "$APK_PATH" "$FINAL_APK"

          test -f "$FINAL_APK"

          echo ""
          echo "Generating SHA-256..."

          sha256sum "$FINAL_APK" \
            > "$FINAL_APK.sha256"

          echo ""
          echo "Final APK:"

          ls -lh "$FINAL_APK"

          echo ""
          echo "SHA-256:"

          cat "$FINAL_APK.sha256"


      # ============================================================
      # 25. FINAL RELEASE CHECK
      # ============================================================
      - name: Final release check
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR/app/build/outputs/apk/release"

          test -f \
            ARS-POS-1.0.5-PHASE4.2-VISUAL-SCANNER-SIGNED.apk

          test -f \
            ARS-POS-1.0.5-PHASE4.2-VISUAL-SCANNER-SIGNED.apk.sha256

          echo ""
          echo "=========================================="
          echo "ARS POS PHASE 4.2 READY"
          echo "=========================================="

          ls -lh \
            ARS-POS-1.0.5-PHASE4.2-VISUAL-SCANNER-SIGNED.apk

          echo ""

          cat \
            ARS-POS-1.0.5-PHASE4.2-VISUAL-SCANNER-SIGNED.apk.sha256


      # ============================================================
      # 26. UPLOAD SIGNED APK
      # ============================================================
      - name: Upload signed APK
        uses: actions/upload-artifact@v7
        with:
          name: ARS-POS-1.0.5-PHASE4.2-VISUAL-SCANNER-SIGNED

          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.0.5-PHASE4.2-VISUAL-SCANNER-SIGNED.apk
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.0.5-PHASE4.2-VISUAL-SCANNER-SIGNED.apk.sha256

          if-no-files-found: error

          retention-days: 30
