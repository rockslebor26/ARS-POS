name: ARS POS Official Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build ARS POS Phase 4.3.2.30 V8.4.10 Anchor-Preserving Rod Identity FIX1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -f "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -f "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -f "$ANDROID_HOME/build-tools/35.0.0/aapt"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Locate V8.4.10 source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="./ARS_POS_PHASE4_3_2_30_V8_4_10_ANCHOR_PRESERVING_ROD_IDENTITY_FIX1.zip"

          test -f "$ZIP_FILE" || {
            echo "ERROR: ZIP V8.4.10 tidak ditemukan: $ZIP_FILE"
            find . -maxdepth 3 -type f -iname '*.zip' -print
            exit 1
          }

          unzip -t "$ZIP_FILE"

          unzip -l "$ZIP_FILE" | grep -q \
            'app/src/main/java/com/arspos/anglerriausyndicate/ScanProposal.kt'

          unzip 
        -l "$ZIP_FILE" | grep -q \
            'app/src/main/java/com/arspos/anglerriausyndicate/LongObjectAnalyzer.kt'

          unzip -l "$ZIP_FILE" | grep -q \
            'app/src/main/java/com/arspos/anglerriausyndicate/data/SmartRecognitionEngine.kt'

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ARS POS project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=$(find extracted -type f -name 'settings.gradle.kts' | head -n 1)

          test -n "$SETTINGS" || {
            echo "ERROR: settings.gradle.kts tidak ditemukan"
            exit 1
          }

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Gradle project: $PROJECT_DIR"

      - name: Validate V8.4.10 FIX1 source files
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          PKG="app/src/main/java/com/arspos/anglerriausyndicate"
          FAILURES=0

          require_file() {
            local FILE="$1"
            if [ -f "$FILE" ]; then
              echo "OK FILE: $FILE"
            else
              echo "ERROR MISSING FILE: $FILE"
              FAILURES=$((FAILURES + 1))
            fi
          }

          require_text() {
            local FILE="$1"
            local TEXT="$2"
            local NAME="$3"
            if grep -Fq "$TEXT" "$FILE"; then
              echo "OK: $NAME"
            else
              echo "ERROR VALIDATION FAILED: $NAME"
              echo "  File: $FILE"
              echo "  Expected: $TEXT"
              FAILURES=$((FAILURES + 1))
            fi
          }

          REQUIRED=(
            "settings.gradle.kts"
            "build.gradle.kts"
            "gradle.properties"
            "app/build.gradle.kts"
            "app/src/main/AndroidManifest.xml"
            "app/src/main/res/xml/file_paths.xml"

            "$PKG/MainActivity.kt"
            "$PKG/PosViewModel.kt"
            "$PKG/ArsFlightRecorder.kt"
            "$PKG/ArsDevCenter.kt"
            "$PKG/ArsUpdateChannel.kt"
            "$PKG/BitmapSafety.kt"
            "$PKG/ProductMasterStudio.kt"
            "$PKG/FullscreenMasterCamera.kt"
            "$PKG/RodFocusProcessor.kt"
            "$PKG/SmartVisualScanner.kt"
            "$PKG/LongObjectAnalyzer.kt"
            "$PKG/ProductVisualMatcher.kt"
            "$PKG/VisualScanObject.kt"
            "$PKG/ScanResultAggregator.kt"
            "$PKG/ScanProposal.kt"
            "$PKG/ScanCoordinateNormalizer.kt"

            "$PKG/data/ProductionRepository.kt"
            "$PKG/data/SmartRecognitionEngine.kt"
            "$PKG/data/RecognitionCandidate.kt"
            "$PKG/data/ProductIdentityProfile.kt"
            "$PKG/data/ProductIdentityProfileCodec.kt"
            "$PKG/data/MasterVerificationResult.kt"

            "$PKG/data/db/ArsDao.kt"
            "$PKG/data/db/ArsDatabase.kt"
            "$PKG/data/db/ProductEntity.kt"
            "$PKG/data/db/ProductPhotoEntity.kt"

            "PHASE4_3_2_30_V8_4_10_ANCHOR_PRESERVING_ROD_IDENTITY.md"
            "ARS_OFFICIAL_RELEASE_SETUP.md"
            "PROJECT_CONTINUITY.md"
          )

          for FILE in "${REQUIRED[@]}"; do
            require_file "$FILE"
          done

          require_text app/build.gradle.kts 'applicationId = "com.arspos.anglerriausyndicate"' 'Official package ID'
          require_text app/build.gradle.kts 'versionCode = 145' 'Version code 145'
          require_text app/build.gradle.kts 'versionName = "1.4.5"' 'Version name 1.4.5'
          require_text app/build.gradle.kts 'create("arsOfficialRelease")' 'Official release signing config'
          require_text app/build.gradle.kts 'releaseSigningAvailable' 'Release signing availability guard'

          if grep -Fq 'signingConfig = signingConfigs.getByName("debug")' app/build.gradle.kts; then
            echo "ERROR: Release APK masih menggunakan debug signing."
            FAILURES=$((FAILURES + 1))
          else
            echo "OK: Release does not use debug signing"
          fi

          MAIN="$PKG/MainActivity.kt"
          FLIGHT="$PKG/ArsFlightRecorder.kt"
          DEV="$PKG/ArsDevCenter.kt"
          UPDATE="$PKG/ArsUpdateChannel.kt"
          SCANNER="$PKG/SmartVisualScanner.kt"
          LONG="$PKG/LongObjectAnalyzer.kt"
          MATCHER="$PKG/ProductVisualMatcher.kt"
          AGG="$PKG/ScanResultAggregator.kt"
          PROPOSAL="$PKG/ScanProposal.kt"
          NORMALIZER="$PKG/ScanCoordinateNormalizer.kt"
          REPO="$PKG/data/ProductionRepository.kt"
          ENGINE="$PKG/data/SmartRecognitionEngine.kt"
          CANDIDATE="$PKG/data/RecognitionCandidate.kt"

          require_text "$MAIN" 'Phase 4.3.2.30 V8.4.10' 'Main phase/version'
          require_text "$MAIN" 'Anchor-Preserving Rod Identity' 'Anchor-Preserving Rod Identity'
          require_text "$MAIN" 'Cross-Lane Scene Gate' 'Cross-Lane Scene Gate'

          require_text "$FLIGHT" 'Phase: 4.3.2.30' 'Flight Recorder phase 4.3.2.30'
          require_text "$FLIGHT" 'V8.4.10 — Anchor-Preserving Rod Identity + Deterministic Scene Gate' 'Flight Recorder engine label'
          require_text "$FLIGHT" 'persisted update channel' 'Persisted update channel'
          require_text "$FLIGHT" 'Latest cross-lane proposals suppressed' 'Cross-lane telemetry'
          require_text "$FLIGHT" 'Latest background long proposals suppressed' 'Background-long telemetry'
          require_text "$FLIGHT" 'Latest native heap delta' 'Native heap telemetry'
          require_text "$FLIGHT" 'Latest total PSS' 'Total PSS telemetry'
          require_text "$FLIGHT" 'Latest decision rule' 'Decision rule telemetry'
          require_text "$FLIGHT" 'Current Installed Version' 'Current installed version telemetry'
          require_text "$FLIGHT" 'Previous Installed Version' 'Previous installed version telemetry'
          require_text "$FLIGHT" 'Signer SHA-256' 'Signer telemetry'

          require_text "$UPDATE" 'APP_UPDATE' 'APP_UPDATE support'
          require_text "$UPDATE" 'IN_PLACE_UPDATE' 'IN_PLACE_UPDATE support'
          require_text "$UPDATE" 'signingSha256' 'Signing SHA-256 update protection'

          require_text "$DEV" 'cross-lane scene gate' 'Dev Center cross-lane scene gate'
          require_text "$DEV" 'rod-anchor identity' 'Dev Center rod-anchor identity'
          require_text "$DEV" 'com.openai.chatgpt' 'Dev Center OpenAI package diagnostic'

          require_text "$PROPOSAL" 'normalOwnershipConflict' 'Proposal normal ownership conflict'
          require_text "$PROPOSAL" 'rodStructureScore' 'Proposal rod structure score'
          require_text "$PROPOSAL" 'SOURCE_CROSS_LANE' 'Proposal cross-lane source'
          require_text "$PROPOSAL" 'SOURCE_BACKGROUND' 'Proposal background source'

          require_text "$SCANNER" 'applyCrossLaneSceneGate' 'Scanner cross-lane gate'
          require_text "$SCANNER" 'MIN_ANALYZER_ROD_STRUCTURE' 'Scanner rod structure threshold'
          require_text "$SCANNER" 'STRONG_NORMAL_OWNERSHIP' 'Scanner strong normal ownership'
          require_text "$SCANNER" 'SOURCE_CROSS_LANE' 'Scanner cross-lane source'
          require_text "$SCANNER" 'SOURCE_BACKGROUND' 'Scanner background source'
          require_text "$SCANNER" 'assignPhysicalHintsAndSuppressBridges' 'Physical hint / bridge suppression'
          require_text "$SCANNER" 'isParallelContainer' 'Parallel-container guard'

          require_text "$LONG" 'rodStructureScore' 'Long analyzer rod structure score'
          require_text "$LONG" 'background-rejection gate' 'Long analyzer background rejection'

          require_text "$MATCHER" 'scoreBatchLongCached' 'Cached long scoring'
          require_text "$MATCHER" 'referenceStripCache' 'Reference strip cache'
          require_text "$MATCHER" 'longProfileSimilarity' 'Long profile similarity'
          require_text "$MATCHER" 'scoreBatchCoarse' 'Coarse batch scoring'

          require_text "$CANDIDATE" 'anchorScore' 'Recognition candidate anchor score'

          require_text "$ENGINE" 'rodAnchorScore' 'Rod anchor score'
          require_text "$ENGINE" 'MIN_LONG_ANCHOR_SCORE' 'Minimum long anchor score'
          require_text "$ENGINE" 'MIN_LONG_ANCHOR_MARGIN' 'Minimum long anchor margin'
          require_text "$ENGINE" 'ROD_ANCHOR_VISUAL_VERIFIED' 'Rod anchor visual verification rule'
          require_text "$ENGINE" 'ruleId' 'Recognition decision rule ID'

          require_text "$REPO" 'coarseProducts' 'Repository coarse products'
          require_text "$REPO" 'shortlistedProducts' 'Repository shortlisted products'
          require_text "$REPO" 'decisionRuleId' 'Repository decision rule ID'
          require_text "$REPO" 'normalOwnershipConflict' 'Repository normal ownership conflict'
          require_text "$REPO" 'rodStructureScore' 'Repository rod structure score'
          require_text "$REPO" 'nativeDeltaMb' 'Repository native memory telemetry'
          require_text "$REPO" 'totalPssMb' 'Repository total PSS telemetry'
          require_text "$REPO" 'temporaryCrops' 'Repository temporary crop accounting'
          require_text "$REPO" 'recycledCrops' 'Repository recycled crop accounting'
          require_text "$REPO" 'longProposalCount <= 1' 'Long proposal count guard'
          require_text "$REPO" 'anchorOrder = listOf' 'Anchor order'
          require_text "$REPO" 'productRanks.take(2)' 'Top-two product ranking'
          require_text "$REPO" '"LONG_HANDLE", "LONG_SIDE", "LONG_TIP", "LONG_FULL_A", "LONG_FULL_B"' 'Long anchor order entries'

          require_text "$AGG" 'laneFamily' 'Aggregator lane family'
          require_text "$AGG" 'existing.all' 'Aggregator instance separation'
          require_text "$AGG" 'shouldSuppressDuplicateLong' 'Duplicate long suppression'
          require_text "$AGG" 'distinctLongInstances' 'Distinct long instances'
          require_text "$AGG" 'confirmedDistinctParallel' 'Confirmed distinct parallel objects'

          require_text "$NORMALIZER" 'object ScanCoordinateNormalizer' 'Coordinate normalizer object'
          require_text "$NORMALIZER" 'rotationDegrees' 'Coordinate rotation normalization'

          echo ""
          echo "========================================"
          if [ "$FAILURES" -gt 0 ]; then
            echo "V8.4.10 FIX1 SOURCE VALIDATION FAILED"
            echo "Critical failures: $FAILURES"
            echo "========================================"
            exit 1
          fi

          echo "V8.4.10 FIX1 SOURCE VALIDATION OK"
          echo "Phase: 4.3.2.30"
          echo "Version: 1.4.5 (145)"
          echo "Package: com.arspos.anglerriausyndicate"
          echo "========================================"

      - name: Validate Kotlin source balance
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path

          pairs = {'{': '}', '(': ')', '[': ']'}
          reverse = {v: k for k, v in pairs.items()}

          def check(path):
              text = path.read_text(encoding='utf-8')
              stack = []
              i = 0
              line = 1
              line_comment = False
              block_comment = False
              string = False
              char = False
              escaped = False

              while i < len(text):
                  c = text[i]

                  if c == '\n':
                      line += 1
                      line_comment = False
                      i += 1
                      continue

                  if line_comment:
                      i += 1
                      continue

                  if block_comment:
                      if c == '*' and i + 1 < len(text) and text[i + 1] == '/':
                          block_comment = False
                          i += 2
                      else:
                          i += 1
                      continue

                  if string:
                      if escaped:
                          escaped = False
                      elif c == '\\':
                          escaped = True
                      elif c == '"':
                          string = False
                      i += 1
                      continue

                  if char:
                      if escaped:
                          escaped = False
                      elif c == '\\':
                          escaped = True
                      elif c == "'":
                          char = False
                      i += 1
                      continue

                  if c == '/' and i + 1 < len(text) and text[i + 1] == '/':
                      line_comment = True
                      i += 2
                      continue

                  if c == '/' and i + 1 < len(text) and text[i + 1] == '*':
                      block_comment = True
                      i += 2
                      continue

                  if c == '"':
                      string = True
                      i += 1
                      continue

                  if c == "'":
                      char = True
                      i += 1
                      continue

                  if c in pairs:
                      stack.append((c, line))
                  elif c in reverse:
                      if not stack or stack[-1][0] != reverse[c]:
                          raise SystemExit(f"Mismatch in {path}:{line}")
                      stack.pop()

                  i += 1

              if string or char or block_comment or stack:
                  raise SystemExit(f"Unbalanced Kotlin: {path}")

          files = list(Path('app/src/main/java').rglob('*.kt'))
          for path in files:
              check(path)

          print(f"KOTLIN BALANCE OK: {len(files)} files")
          PY

      - name: Prepare ARS POS official release signing
        shell: bash
        env:
          ARS_RELEASE_KEYSTORE_BASE64: ${{ secrets.ARS_RELEASE_KEYSTORE_BASE64 }}
          ARS_RELEASE_STORE_PASSWORD: ${{ secrets.ARS_RELEASE_STORE_PASSWORD }}
          ARS_RELEASE_KEY_ALIAS: ${{ secrets.ARS_RELEASE_KEY_ALIAS }}
          ARS_RELEASE_KEY_PASSWORD: ${{ secrets.ARS_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$ARS_RELEASE_KEYSTORE_BASE64" || {
            echo "ERROR: GitHub Secret ARS_RELEASE_KEYSTORE_BASE64 belum dibuat."
            exit 1
          }

          test -n "$ARS_RELEASE_STORE_PASSWORD" || {
            echo "ERROR: GitHub Secret ARS_RELEASE_STORE_PASSWORD belum dibuat."
            exit 1
          }

          test -n "$ARS_RELEASE_KEY_ALIAS" || {
            echo "ERROR: GitHub Secret ARS_RELEASE_KEY_ALIAS belum dibuat."
            exit 1
          }

          test -n "$ARS_RELEASE_KEY_PASSWORD" || {
            echo "ERROR: GitHub Secret ARS_RELEASE_KEY_PASSWORD belum dibuat."
            exit 1
          }

          KEYSTORE="$RUNNER_TEMP/ars-pos-official-release.jks"
          printf '%s' "$ARS_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          test -s "$KEYSTORE"

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass "$ARS_RELEASE_STORE_PASSWORD" \
            -alias "$ARS_RELEASE_KEY_ALIAS" \
            >/dev/null

          echo "ARS_RELEASE_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "Official release keystore validated."

      - name: Clean project
        shell: bash
        env:
          ARS_RELEASE_STORE_PASSWORD: ${{ secrets.ARS_RELEASE_STORE_PASSWORD }}
          ARS_RELEASE_KEY_ALIAS: ${{ secrets.ARS_RELEASE_KEY_ALIAS }}
          ARS_RELEASE_KEY_PASSWORD: ${{ secrets.ARS_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle clean \
            --no-daemon \
            --stacktrace

      - name: Build official release APK
        shell: bash
        env:
          ARS_RELEASE_STORE_PASSWORD: ${{ secrets.ARS_RELEASE_STORE_PASSWORD }}
          ARS_RELEASE_KEY_ALIAS: ${{ secrets.ARS_RELEASE_KEY_ALIAS }}
          ARS_RELEASE_KEY_PASSWORD: ${{ secrets.ARS_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Verify official APK identity and signature
        shell: bash
        env:
          ARS_RELEASE_CERT_SHA256: ${{ secrets.ARS_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          APK=$(find \
            app/build/outputs/apk/release \
            -type f \
            -name '*.apk' \
            | head -n 1)

          test -n "$APK" || {
            echo "ERROR: APK tidak ditemukan"
            exit 1
          }

          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 1)
          echo "$BADGING"

          echo "$BADGING" | grep -q "name='com.arspos.anglerriausyndicate'"
          echo "$BADGING" | grep -q "versionCode='145'"
          echo "$BADGING" | grep -q "versionName='1.4.5'"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            --print-certs \
            "$APK" \
            | tee signer-info.txt

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -c \
            -P 16 \
            -v 4 \
            "$APK"

          CERT_SHA=$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}' signer-info.txt)
          test -n "$CERT_SHA" || {
            echo "ERROR: Tidak dapat membaca signer SHA-256 dari APK"
            exit 1
          }

          test -n "${ARS_RELEASE_CERT_SHA256:-}" || {
            echo "ERROR: GitHub Secret ARS_RELEASE_CERT_SHA256 wajib diisi untuk melindungi update channel."
            exit 1
          }

          NORMALIZED_CERT=$(printf '%s' "$CERT_SHA" | tr -d ':' | tr '[:lower:]' '[:upper:]')
          EXPECTED=$(printf '%s' "$ARS_RELEASE_CERT_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]')

          if [ "$NORMALIZED_CERT" != "$EXPECTED" ]; then
            echo "ERROR: SIGNER BERUBAH. Build dihentikan untuk melindungi update channel."
            echo "Current signer: $CERT_SHA"
            exit 1
          fi

          printf 'ARS POS OFFICIAL RELEASE\nVersion: 1.4.5 (145)\nPackage: com.arspos.anglerriausyndicate\nSigner SHA-256: %s\n' \
            "$CERT_SHA" > SIGNING_FINGERPRINT.txt

          echo "SIGNER_SHA256=$CERT_SHA" >> "$GITHUB_ENV"
          echo "APK identity + signing verified."

          {
            echo "### ARS POS Official Release"
            echo "- Version: 1.4.5 (145)"
            echo "- Phase: 4.3.2.30 / V8.4.10 FIX1"
            echo "- Package: com.arspos.anglerriausyndicate"
            echo "- Signer SHA-256: $CERT_SHA"
            echo "- Update target: install directly over V8.4.9 Official (do not uninstall)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rename APK and SHA256
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          APK=$(find \
            app/build/outputs/apk/release \
            -type f \
            -name '*.apk' \
            | head -n 1)

          test -n "$APK"

          OUT="app/build/outputs/apk/release/ARS-POS-1.4.5-PHASE4.3.2.30-V8.4.10-ANCHOR-PRESERVING-ROD-IDENTITY-FIX1-SIGNED.apk"

          cp "$APK" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          cp SIGNING_FINGERPRINT.txt app/build/outputs/apk/release/SIGNING_FINGERPRINT.txt

          ls -lh \
            "$OUT" \
            "$OUT.sha256" \
            app/build/outputs/apk/release/SIGNING_FINGERPRINT.txt

      - name: Upload official signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ARS-POS-1.4.5-PHASE4.3.2.30-V8.4.10-FIX1-OFFICIAL
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.4.5-PHASE4.3.2.30-V8.4.10-ANCHOR-PRESERVING-ROD-IDENTITY-FIX1-SIGNED.apk
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.4.5-PHASE4.3.2.30-V8.4.10-ANCHOR-PRESERVING-ROD-IDENTITY-FIX1-SIGNED.apk.sha256
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/SIGNING_FINGERPRINT.txt
          if-no-files-found: error
