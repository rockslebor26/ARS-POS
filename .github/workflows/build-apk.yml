name: ARS POS Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build ARS POS Phase 3 Payment
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v7


      # ============================================================
      # 2. SETUP JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. SETUP ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      # ============================================================
      # 4. INSTALL ANDROID SDK
      # ============================================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "INSTALL ANDROID SDK"
          echo "=========================================="

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo ""
          echo "Checking Android SDK..."

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -f "$ANDROID_HOME/platform-tools/adb"
          test -f "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -f "$ANDROID_HOME/build-tools/35.0.0/zipalign"

          echo "Android SDK OK."


      # ============================================================
      # 5. SETUP GRADLE 8.9
      # ============================================================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'


      # ============================================================
      # 6. CHECK REPOSITORY
      # ============================================================
      - name: Check repository files
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "REPOSITORY"
          echo "=========================================="

          echo "Working directory:"
          pwd

          echo ""
          echo "Repository contents:"
          ls -lah

          echo ""
          echo "ZIP files:"
          find . \
            -type f \
            -iname "*.zip" \
            -print


      # ============================================================
      # 7. REQUIRE LATEST ARS POS PHASE 3 ZIP
      # ============================================================
      - name: Find ARS POS Phase 3 project
        shell: bash
        run: |
          set -e

          ZIP_FILE="./ARS_POS_PHASE3_PAYMENT_V1_COMPLETE.zip"

          echo "=========================================="
          echo "ARS POS PHASE 3"
          echo "=========================================="

          if [ ! -f "$ZIP_FILE" ]; then

            echo "ERROR:"
            echo "ARS_POS_PHASE3_PAYMENT_V1_COMPLETE.zip"
            echo "tidak ditemukan di repository."

            echo ""
            echo "ZIP yang tersedia:"

            find . \
              -type f \
              -iname "*.zip" \
              -print

            echo ""
            echo "Pastikan file berikut sudah di-upload:"
            echo "$ZIP_FILE"

            exit 1
          fi

          echo ""
          echo "ZIP ditemukan:"
          echo "$ZIP_FILE"

          echo ""
          echo "Ukuran ZIP:"
          ls -lh "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ============================================================
      # 8. TEST ZIP INTEGRITY
      # ============================================================
      - name: Verify ZIP integrity
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFY ZIP"
          echo "=========================================="

          unzip -t "$ZIP_FILE"

          echo ""
          echo "ZIP integrity OK."


      # ============================================================
      # 9. EXTRACT ARS POS PROJECT
      # ============================================================
      - name: Extract ARS POS project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "EXTRACT ARS POS"
          echo "=========================================="

          rm -rf extracted

          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo ""
          echo "Project extracted successfully."

          echo ""
          echo "Project files:"

          find extracted \
            -maxdepth 5 \
            -type f \
            | sort \
            | head -n 250


      # ============================================================
      # 10. LOCATE GRADLE PROJECT
      # ============================================================
      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "LOCATE GRADLE PROJECT"
          echo "=========================================="

          SETTINGS_FILE=$(find extracted \
            -type f \
            -name "settings.gradle.kts" \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then

            echo "ERROR:"
            echo "settings.gradle.kts tidak ditemukan."

            echo ""
            echo "Extracted files:"

            find extracted \
              -maxdepth 8 \
              -type f \
              | sort

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo ""
          echo "settings.gradle.kts:"
          echo "$SETTINGS_FILE"

          echo ""
          echo "Gradle project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 11. VALIDATE PROJECT STRUCTURE
      # ============================================================
      - name: Validate project structure
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "VALIDATE PROJECT"
          echo "=========================================="

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties

          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          test -f \
            app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt

          test -f \
            app/src/main/java/com/arspos/anglerriausyndicate/PosViewModel.kt

          test -f \
            app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt

          test -f \
            app/src/main/java/com/arspos/anglerriausyndicate/data/PosRepository.kt

          test -f \
            app/src/main/java/com/arspos/anglerriausyndicate/data/db/ArsDatabase.kt

          test -f \
            app/src/main/java/com/arspos/anglerriausyndicate/data/db/ArsDao.kt

          echo ""
          echo "Project structure OK."


      # ============================================================
      # 12. VALIDATE PHASE 3 PAYMENT
      # ============================================================
      - name: Validate Phase 3 payment features
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "PHASE 3 PAYMENT VALIDATION"
          echo "=========================================="

          MAIN="app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"
          REPO="app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"

          echo ""
          echo "MainActivity:"
          wc -l "$MAIN"

          echo ""
          echo "Checking payment features..."

          grep -n "CASH" "$MAIN"
          grep -n "QRIS" "$MAIN"
          grep -n "TRANSFER" "$MAIN"
          grep -n "DEBIT" "$MAIN"
          grep -n "KEMBALIAN" "$MAIN"
          grep -n "UANG KURANG" "$MAIN"

          echo ""
          echo "Checking payment repository..."

          grep -n "metode pembayaran" "$REPO" || true
          grep -n "Pembayaran non-CASH" "$REPO" || true

          echo ""
          echo "Phase 3 payment markers detected."


      # ============================================================
      # 13. VALIDATE CART FEATURES
      # ============================================================
      - name: Validate cart features
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          MAIN="app/src/main/java/com/arspos/anglerriausyndicate/MainActivity.kt"

          echo "=========================================="
          echo "CART VALIDATION"
          echo "=========================================="

          grep -n "KERANJANG" "$MAIN"
          grep -n "JUMLAH BARANG" "$MAIN"
          grep -n "Icons.Default.Add" "$MAIN"
          grep -n "Icons.Default.Remove" "$MAIN"
          grep -n "Icons.Default.Delete" "$MAIN"

          echo ""
          echo "Cart features detected."


      # ============================================================
      # 14. VALIDATE ARS BRANDING
      # ============================================================
      - name: Validate ARS branding
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "ARS BRANDING VALIDATION"
          echo "=========================================="

          echo ""
          echo "Launcher icons:"

          find app/src/main/res \
            -type f \
            \( \
              -iname "ic_launcher*" \
              -o \
              -iname "*launcher*" \
            \) \
            -print

          echo ""
          echo "ARS background:"

          test -f \
            app/src/main/res/drawable/ars_background.png

          echo "ars_background.png OK."

          echo ""
          echo "ARS logo:"

          test -f \
            app/src/main/res/drawable/ars_logo_master.png

          echo "ars_logo_master.png OK."

          echo ""
          echo "Manifest icon:"

          grep -n \
            "android:icon\|android:roundIcon" \
            app/src/main/AndroidManifest.xml

          echo ""
          echo "ARS branding OK."


      # ============================================================
      # 15. CHECK RELEASE SIGNING CONFIGURATION
      # ============================================================
      - name: Validate release signing
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "RELEASE SIGNING"
          echo "=========================================="

          grep -n \
            "signingConfig" \
            app/build.gradle.kts

          echo ""
          echo "Checking debug signing configuration..."

          grep -n \
            'signingConfigs.getByName("debug")' \
            app/build.gradle.kts

          echo ""
          echo "Release signing configuration detected."


      # ============================================================
      # 16. SHOW ANDROID / JAVA / GRADLE VERSION
      # ============================================================
      - name: Show build environment
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILD ENVIRONMENT"
          echo "=========================================="

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          gradle --version

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Build tools:"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" version


      # ============================================================
      # 17. CLEAN PROJECT
      # ============================================================
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "GRADLE CLEAN"
          echo "=========================================="

          gradle clean \
            --no-daemon \
            --stacktrace


      # ============================================================
      # 18. BUILD RELEASE APK
      # ============================================================
      - name: Build Release APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "BUILD ARS POS RELEASE"
          echo "=========================================="

          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --warning-mode all

          echo ""
          echo "Build completed."


      # ============================================================
      # 19. CHECK APK OUTPUT
      # ============================================================
      - name: Check APK output
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "APK OUTPUT"
          echo "=========================================="

          APK_DIR="app/build/outputs/apk/release"

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: APK output directory tidak ditemukan."
            exit 1
          fi

          find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$APK_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          echo ""
          echo "APK ditemukan:"
          echo "$APK"

          echo ""
          echo "APK size:"
          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"


      # ============================================================
      # 20. VERIFY APK SIGNATURE
      # ============================================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "VERIFY APK SIGNATURE"
          echo "=========================================="

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            "$APK_PATH"

          echo ""
          echo "APK signature verification PASSED."


      # ============================================================
      # 21. VERIFY APK ALIGNMENT
      # ============================================================
      - name: Verify APK alignment
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "VERIFY APK ALIGNMENT"
          echo "=========================================="

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -c \
            -P 16 \
            -v 4 \
            "$APK_PATH"

          echo ""
          echo "APK alignment verification PASSED."


      # ============================================================
      # 22. VERIFY APK PACKAGE INFORMATION
      # ============================================================
      - name: Verify APK package
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "VERIFY APK PACKAGE"
          echo "=========================================="

          "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            dump badging \
            "$APK_PATH" \
            | grep -E \
              "package: name=|versionCode=|versionName="

          echo ""
          echo "APK package validation PASSED."


      # ============================================================
      # 23. PREPARE FINAL APK
      # ============================================================
      - name: Prepare final APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          APK_DIR="app/build/outputs/apk/release"

          FINAL_APK="$APK_DIR/ARS-POS-1.0.0-PHASE3-PAYMENT-SIGNED.apk"

          cp "$APK_PATH" "$FINAL_APK"

          echo ""
          echo "=========================================="
          echo "FINAL APK"
          echo "=========================================="

          ls -lh "$FINAL_APK"

          echo "FINAL_APK=$FINAL_APK" >> "$GITHUB_ENV"


      # ============================================================
      # 24. GENERATE SHA-256 CHECKSUM
      # ============================================================
      - name: Generate APK checksum
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          APK_DIR="app/build/outputs/apk/release"

          cd "$APK_DIR"

          sha256sum \
            ARS-POS-1.0.0-PHASE3-PAYMENT-SIGNED.apk \
            > ARS-POS-1.0.0-PHASE3-PAYMENT-SIGNED.apk.sha256

          echo ""
          echo "=========================================="
          echo "APK SHA-256"
          echo "=========================================="

          cat \
            ARS-POS-1.0.0-PHASE3-PAYMENT-SIGNED.apk.sha256


      # ============================================================
      # 25. FINAL APK CHECK
      # ============================================================
      - name: Final APK verification
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR/app/build/outputs/apk/release"

          echo "=========================================="
          echo "FINAL RELEASE CHECK"
          echo "=========================================="

          test -f \
            ARS-POS-1.0.0-PHASE3-PAYMENT-SIGNED.apk

          test -f \
            ARS-POS-1.0.0-PHASE3-PAYMENT-SIGNED.apk.sha256

          echo ""
          echo "Final APK:"
          ls -lh \
            ARS-POS-1.0.0-PHASE3-PAYMENT-SIGNED.apk

          echo ""
          echo "Checksum:"
          cat \
            ARS-POS-1.0.0-PHASE3-PAYMENT-SIGNED.apk.sha256

          echo ""
          echo "=========================================="
          echo "ARS POS PHASE 3 BUILD READY"
          echo "=========================================="


      # ============================================================
      # 26. UPLOAD APK ARTIFACT
      # ============================================================
      - name: Upload ARS POS Phase 3 APK
        uses: actions/upload-artifact@v7
        with:
          name: ARS-POS-1.0.0-PHASE3-PAYMENT-SIGNED
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.0.0-PHASE3-PAYMENT-SIGNED.apk
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/ARS-POS-1.0.0-PHASE3-PAYMENT-SIGNED.apk.sha256
          if-no-files-found: error
          retention-days: 30
