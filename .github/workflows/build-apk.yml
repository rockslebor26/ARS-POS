name: ARS POS V8.9.0-A Smart Product Enrollment Private Visual DNA Foundation R1 212

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ARS_POS_V8_9_0_A_R1_212_SOURCE.zip
      - .github/workflows/build-apk.yml

permissions:
  contents: read

concurrency:
  group: ars-pos-v890a-smart-enrollment-visual-dna-212-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      SOURCE_ZIP: ARS_POS_V8_9_0_A_R1_212_SOURCE.zip
      SOURCE_SHA256: 9cb690d3a5129be03e70be6d874c9daea955ed5c267d432fb79e75af518c5971
      EXPECTED_PACKAGE: com.arspos.anglerriausyndicate
      EXPECTED_VERSION_CODE: '212'
      EXPECTED_VERSION_NAME: '1.12.0'
      PREVIOUS_VERSION_CODE: '211'
      OFFICIAL_CERT_SHA256: AA2A8C6C885BA887577A2C2813AEA2F72E5FB51892FC486108B57F8389D56AEB

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Verify V8.9.0-A source package
        shell: bash
        run: |
          set -euo pipefail

          test -f "$SOURCE_ZIP" || {
            echo "::error::Source ZIP tidak ditemukan: $SOURCE_ZIP"
            echo "::error::Upload ZIP ke root repository lalu jalankan workflow pada commit terbaru."
            exit 1
          }

          printf '%s  %s\n' "$SOURCE_SHA256" "$SOURCE_ZIP" | sha256sum -c -
          unzip -t "$SOURCE_ZIP" >/dev/null

          PROJECT_DIR="$(mktemp -d "$RUNNER_TEMP/ars-v890a-212.XXXXXX")"
          unzip -q "$SOURCE_ZIP" -d "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          for f in \
            settings.gradle.kts \
            build.gradle.kts \
            app/build.gradle.kts \
            tools/validate_source.py \
            SOURCE_FILES_SHA256.txt \
            PHASE4_3_6_0_V8_9_0_A_SMART_PRODUCT_ENROLLMENT_PRIVATE_VISUAL_DNA_FOUNDATION_R1.md \
            RELEASE_212.md \
            BUILD_V890A.md \
            ARS_POS_V8_9_0_A_RELEASE_MANIFEST_212.txt \
            V8_9_0_A_VALIDATION_STATUS.txt \
            app/src/main/java/com/arspos/anglerriausyndicate/data/db/VisualDnaEntities.kt \
            app/src/main/java/com/arspos/anglerriausyndicate/visualdna/VisualDnaContract.kt \
            app/src/main/java/com/arspos/anglerriausyndicate/visualdna/PrivateVisualDnaRepository.kt; do
            test -f "$PROJECT_DIR/$f" || {
              echo "::error::File release wajib tidak ditemukan: $f"
              exit 1
            }
          done

          python3 "$PROJECT_DIR/tools/validate_source.py" --root "$PROJECT_DIR"

          (
            cd "$PROJECT_DIR"
            sha256sum -c SOURCE_FILES_SHA256.txt > "$RUNNER_TEMP/ars-source-checks.txt"
          )

          python3 -m unittest discover \
            -s "$PROJECT_DIR/tools" \
            -p 'test_*.py'

          (
            cd "$PROJECT_DIR/ars-ai-gateway"
            node --check server.mjs
            node --check security.mjs
            node --check runtime-bundled.mjs
            node --test
          )

          APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"
          CONFIG="$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/ArsV850Config.kt"
          CAMERA="$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/LiveSmartScanCamera.kt"
          REPO="$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/data/ProductionRepository.kt"
          BINDER="$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/PersistentPhysicalIdBinder.kt"
          MATCHER="$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/ProductVisualMatcher.kt"

          grep -Fq 'applicationId = "com.arspos.anglerriausyndicate"' "$APP_GRADLE"
          grep -Fq 'versionCode = 212' "$APP_GRADLE"
          grep -Fq 'versionName = "1.12.0"' "$APP_GRADLE"

          grep -Fq 'const val PHASE = "4.3.6.0"' "$CONFIG"
          grep -Fq 'const val ENGINE = "V8.9.0-A"' "$CONFIG"
          grep -Fq 'const val RELEASE_REVISION = "SMART_PRODUCT_ENROLLMENT_PRIVATE_VISUAL_DNA_FOUNDATION_R1"' "$CONFIG"

          grep -Fq 'FEATURE_PARALLEL_MULTI_OBJECT_IDENTITY = true' "$CONFIG"
          grep -Fq 'FEATURE_PER_TRACK_IDENTITY_STATE = true' "$CONFIG"
          grep -Fq 'FEATURE_BATCH_IDENTITY_RETRIEVAL = true' "$CONFIG"
          grep -Fq 'FEATURE_PREWARMED_VISUAL_MASTER = true' "$CONFIG"
          grep -Fq 'FEATURE_SELECTIVE_OCR_ESCALATION = true' "$CONFIG"
          grep -Fq 'FEATURE_SELECTIVE_HIGH_RES_ESCALATION = true' "$CONFIG"
          grep -Fq 'FEATURE_SELECTED_TRACK_PRIORITY_ONLY = true' "$CONFIG"
          grep -Fq 'FEATURE_MULTI_OBJECT_FINALIZATION_PRESERVE = true' "$CONFIG"
          grep -Fq 'FEATURE_STRICT_FINAL_BINDING_VETO = true' "$CONFIG"
          grep -Fq 'FEATURE_LATEST_FRAME_BACKPRESSURE = true' "$CONFIG"
          grep -Fq 'MAX_PARALLEL_IDENTITY_TRACKS = 4' "$CONFIG"
          grep -Fq 'MAX_LIVE_OCR_REQUESTS_PER_PASS = 1' "$CONFIG"
          grep -Fq 'MAX_LIVE_HIGH_RES_REQUESTS_PER_PASS = 1' "$CONFIG"
          grep -Fq 'IDENTITY_STARVATION_LIMIT_MS = 2_000L' "$CONFIG"

          grep -Fq 'FEATURE_AI_IN_CRITICAL_SCAN_PATH = false' "$CONFIG"
          grep -Fq 'LiveIdentityScheduler.chooseBatch' "$CAMERA"
          grep -Fq 'identityBatchSize' "$CAMERA"
          grep -Fq 'OCR_BATCH_BUDGET_DEFERRED' "$REPO"
          grep -Fq 'selectedTrackPriorityOnly' "$REPO"
          grep -Fq 'MIN_NORMAL_FINAL_BINDING_SCORE = 0.48f' "$BINDER"
          grep -Fq 'prewarmReferences' "$MATCHER"

          DB="$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/data/db/ArsDatabase.kt"
          VISUAL_REPO="$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/visualdna/PrivateVisualDnaRepository.kt"

          grep -Eq 'version\s*=\s*6' "$DB"
          grep -Fq 'MIGRATION_5_6' "$DB"
          grep -Fq 'product_visual_dna' "$DB"
          grep -Fq 'catalog_collisions' "$DB"
          grep -Fq 'catalog_snapshots' "$DB"

          grep -Fq 'FEATURE_SMART_PRODUCT_ENROLLMENT_FOUNDATION = true' "$CONFIG"
          grep -Fq 'FEATURE_PRIVATE_VISUAL_DNA_SCHEMA = true' "$CONFIG"
          grep -Fq 'FEATURE_CATALOG_COLLISION_GRAPH = true' "$CONFIG"
          grep -Fq 'FEATURE_ATOMIC_CATALOG_COMMIT = true' "$CONFIG"
          grep -Fq 'FEATURE_DB_V6_NON_DESTRUCTIVE_MIGRATION = true' "$CONFIG"

          grep -Fq 'FEATURE_VISUAL_DNA_EXTRACTION_ENGINE = false' "$CONFIG"
          grep -Fq 'FEATURE_VISUAL_DNA_SCANNER_ROUTING = false' "$CONFIG"

          grep -Fq 'db.withTransaction' "$VISUAL_REPO"
          grep -Fq 'Unresolved HIGH/CRITICAL catalog collision' "$VISUAL_REPO"

          if grep -Fq 'AUTOMATIC_SCAN_FAILURE' \
            "$PROJECT_DIR/app/src/main/java/com/arspos/anglerriausyndicate/PosViewModel.kt"; then
            echo "::error::AI handoff tidak boleh masuk critical Smart Scan path."
            exit 1
          fi

          echo "V8.9.0-A source/invariants: PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve Android SDK manager
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          test -n "$SDK_ROOT" && test -d "$SDK_ROOT" || {
            echo "::error::Android SDK root tidak tersedia pada runner."
            exit 1
          }

          SDKMANAGER_BIN="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER_BIN" ]; then
            SDKMANAGER_BIN="$(
              find "$SDK_ROOT/cmdline-tools" \
                -type f \
                -name sdkmanager \
                -perm -111 \
                2>/dev/null \
              | sort -V \
              | tail -n 1 || true
            )"
          fi

          test -n "$SDKMANAGER_BIN" && test -x "$SDKMANAGER_BIN" || {
            echo "::error::sdkmanager tidak ditemukan."
            exit 1
          }

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER_BIN=$SDKMANAGER_BIN" >> "$GITHUB_ENV"

          {
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "sdkmanager=$SDKMANAGER_BIN"
            "$SDKMANAGER_BIN" --version
          } > "$RUNNER_TEMP/ars-sdk-info.txt"

      - name: Install Android SDK 35 build tools
        shell: bash
        run: |
          set -euo pipefail

          yes | "$SDKMANAGER_BIN" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses >/dev/null || true

          "$SDKMANAGER_BIN" \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -f "$ANDROID_SDK_ROOT/platforms/android-35/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Verify official ARS signer
        shell: bash
        env:
          ARS_RELEASE_KEYSTORE_BASE64: ${{ secrets.ARS_RELEASE_KEYSTORE_BASE64 }}
          ARS_RELEASE_STORE_PASSWORD: ${{ secrets.ARS_RELEASE_STORE_PASSWORD }}
          ARS_RELEASE_KEY_ALIAS: ${{ secrets.ARS_RELEASE_KEY_ALIAS }}
          ARS_RELEASE_KEY_PASSWORD: ${{ secrets.ARS_RELEASE_KEY_PASSWORD }}
          ARS_RELEASE_CERT_SHA256: ${{ secrets.ARS_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail

          : "${ARS_RELEASE_KEYSTORE_BASE64:?Missing ARS_RELEASE_KEYSTORE_BASE64}"
          : "${ARS_RELEASE_STORE_PASSWORD:?Missing ARS_RELEASE_STORE_PASSWORD}"
          : "${ARS_RELEASE_KEY_ALIAS:?Missing ARS_RELEASE_KEY_ALIAS}"
          : "${ARS_RELEASE_KEY_PASSWORD:?Missing ARS_RELEASE_KEY_PASSWORD}"
          : "${ARS_RELEASE_CERT_SHA256:?Missing ARS_RELEASE_CERT_SHA256}"

          EXPECTED="$(
            printf '%s' "$ARS_RELEASE_CERT_SHA256" \
            | tr -d ':[:space:]' \
            | tr '[:lower:]' '[:upper:]'
          )"

          test "$EXPECTED" = "$OFFICIAL_CERT_SHA256" || {
            echo "::error::Secret certificate bukan signer resmi ARS POS."
            exit 1
          }

          KEYSTORE="$RUNNER_TEMP/ars-v890a-212.jks"

          umask 077
          printf '%s' "$ARS_RELEASE_KEYSTORE_BASE64" \
            | base64 --decode > "$KEYSTORE"

          test -s "$KEYSTORE"

          keytool -list \
            -keystore "$KEYSTORE" \
            -storepass:env ARS_RELEASE_STORE_PASSWORD \
            -alias "$ARS_RELEASE_KEY_ALIAS" >/dev/null

          ACTUAL=$(
            keytool -exportcert -rfc \
              -keystore "$KEYSTORE" \
              -storepass:env ARS_RELEASE_STORE_PASSWORD \
              -alias "$ARS_RELEASE_KEY_ALIAS" \
            | openssl x509 -outform DER \
            | sha256sum \
            | awk '{print toupper($1)}'
          )

          test "$ACTUAL" = "$OFFICIAL_CERT_SHA256" || {
            echo "::error::Keystore signer mismatch: $ACTUAL"
            exit 1
          }

          echo "ARS_RELEASE_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "Official signer pre-build verification: PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Compile Kotlin and run regression tests
        shell: bash
        env:
          ARS_RELEASE_STORE_PASSWORD: ${{ secrets.ARS_RELEASE_STORE_PASSWORD }}
          ARS_RELEASE_KEY_ALIAS: ${{ secrets.ARS_RELEASE_KEY_ALIAS }}
          ARS_RELEASE_KEY_PASSWORD: ${{ secrets.ARS_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle \
            :app:compileDebugKotlin \
            :app:compileReleaseKotlin \
            :physicaltruth-jvm:test \
            :app:testDebugUnitTest \
            --no-daemon \
            --stacktrace

      - name: Build signed official release APK
        shell: bash
        env:
          ARS_RELEASE_STORE_PASSWORD: ${{ secrets.ARS_RELEASE_STORE_PASSWORD }}
          ARS_RELEASE_KEY_ALIAS: ${{ secrets.ARS_RELEASE_KEY_ALIAS }}
          ARS_RELEASE_KEY_PASSWORD: ${{ secrets.ARS_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle \
            :app:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify package version signer and alignment
        shell: bash
        env:
          ARS_RELEASE_CERT_SHA256: ${{ secrets.ARS_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          APK="app/build/outputs/apk/release/app-release.apk"

          test -s "$APK"

          SDK_BIN="$ANDROID_SDK_ROOT/build-tools/35.0.0"

          "$SDK_BIN/aapt" \
            dump badging "$APK" > apk-badging.txt

          grep -Fq \
            "name='$EXPECTED_PACKAGE'" \
            apk-badging.txt

          grep -Fq \
            "versionCode='$EXPECTED_VERSION_CODE'" \
            apk-badging.txt

          grep -Fq \
            "versionName='$EXPECTED_VERSION_NAME'" \
            apk-badging.txt

          test "$EXPECTED_VERSION_CODE" -gt "$PREVIOUS_VERSION_CODE"

          "$SDK_BIN/apksigner" \
            verify \
            --verbose \
            --print-certs \
            "$APK" > signer-info.txt

          "$SDK_BIN/zipalign" \
            -c \
            -P 16 \
            -v 4 \
            "$APK"

          ACTUAL="$(
            awk -F': ' \
              '/Signer #1 certificate SHA-256 digest:/ {
                print $2;
                exit
              }' signer-info.txt \
            | tr -d ':[:space:]' \
            | tr '[:lower:]' '[:upper:]'
          )"

          EXPECTED="$(
            printf '%s' "$ARS_RELEASE_CERT_SHA256" \
            | tr -d ':[:space:]' \
            | tr '[:lower:]' '[:upper:]'
          )"

          test -n "$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          test "$ACTUAL" = "$OFFICIAL_CERT_SHA256"

          mkdir -p "$GITHUB_WORKSPACE/release-output"

          OUT_APK="$GITHUB_WORKSPACE/release-output/ARS-POS-1.12.0-V8.9.0-A-SMART-ENROLLMENT-VISUAL-DNA-212-20260929-SIGNED.apk"

          cp "$APK" "$OUT_APK"

          cp signer-info.txt \
            "$GITHUB_WORKSPACE/release-output/SIGNING_FINGERPRINT.txt"

          cp apk-badging.txt \
            "$GITHUB_WORKSPACE/release-output/APK_METADATA.txt"

          cp "$RUNNER_TEMP/ars-source-checks.txt" \
            "$GITHUB_WORKSPACE/release-output/SOURCE_CHECKS.txt"

          cp "$RUNNER_TEMP/ars-sdk-info.txt" \
            "$GITHUB_WORKSPACE/release-output/SDK_INFO.txt"

          cp validation/validation-status.json \
            "$GITHUB_WORKSPACE/release-output/SOURCE_VALIDATION_STATUS.json"

          sha256sum "$OUT_APK" \
            > "$GITHUB_WORKSPACE/release-output/APK_SHA256.txt"

          echo \
            "Build 1.12.0 (212) / Phase 4.3.6.0 / V8.9.0-A: PASS." \
            >> "$GITHUB_STEP_SUMMARY"

          echo \
            "Smart Enrollment/Private Visual DNA DB v6 foundation: ACTIVE; new extraction/scanner routing: DEFERRED." \
            >> "$GITHUB_STEP_SUMMARY"

          echo \
            "Cloud Identity=SHADOW; Self Learning=ACTIVE_CONFIRMED_ONLY; recognition thresholds unchanged." \
            >> "$GITHUB_STEP_SUMMARY"

          echo \
            "Install in-place only; do not uninstall production app." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified official APK
        uses: actions/upload-artifact@v7
        with:
          name: ARS-POS-V8.9.0-A-SMART-ENROLLMENT-VISUAL-DNA-212-OFFICIAL
          path: release-output/
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: always() && env.PROJECT_DIR != ''
        uses: actions/upload-artifact@v7
        with:
          name: ARS-POS-V8.9.0-A-212-TEST-REPORTS
          path: |
            ${{ env.PROJECT_DIR }}/physicaltruth-jvm/build/reports/tests/
            ${{ env.PROJECT_DIR }}/physicaltruth-jvm/build/test-results/
            ${{ env.PROJECT_DIR }}/app/build/reports/tests/
            ${{ env.PROJECT_DIR }}/app/build/test-results/
            ${{ env.PROJECT_DIR }}/validation/
          if-no-files-found: warn
          retention-days: 30

      - name: Remove runner copy of signing key
        if: always()
        shell: bash
        run: |
          KEYSTORE="$RUNNER_TEMP/ars-v890a-212.jks"

          if [ -f "$KEYSTORE" ]; then
            if command -v shred >/dev/null 2>&1; then
              shred -u "$KEYSTORE" || rm -f -- "$KEYSTORE"
            else
              rm -f -- "$KEYSTORE"
            fi
          fi
